<!DOCTYPE html>
<html>
<head>
<script>

var c = document.getElementById("frameCanvas");
var ctx = c.getContext("2d");
var img = document.getElementById("frameImage");
ctx.drawImage(img,10,10);

ctx.beginPath();
ctx.arc(120,150,30,0,2*Math.PI);
ctx.strokeStyle = '#ffffaa';
ctx.stroke();

</script>

</head>
