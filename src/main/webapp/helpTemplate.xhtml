<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html">

    <h:head>
        <meta charset="UTF-8" />
        <title>Phasing Camera Help Pages</title>

        <!-- Your main stylesheet -->
        <h:outputStylesheet library="css" name="peas.css" />
    </h:head>

    <h:body>

        <!-- Workaround for session creation timing issue -->
        <f:event type="jakarta.faces.event.PreRenderViewEvent"
                 listener="#{applicationScopeBean.preRenderView}" />

        <div class="page">

            <!-- HEADER -->
            <header class="top">
                <h:form id="topForm">
                    <h:outputText
                        value="Phasing Camera System Help Pages"
                        styleClass="header-title" />
                </h:form>
            </header>

            <!-- MAIN CONTENT -->
            <main class="center">
                <ui:insert name="content" />
            </main>

        </div>

    </h:body>

</f:view>
</html>
