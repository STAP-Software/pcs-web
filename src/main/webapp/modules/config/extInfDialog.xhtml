<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">
  
		<p:dialog id="extInfDlg" header="Connect to RPC Interfaces" widgetVar="extInfDialog" closable="false" modal="true" resizable="false">  
    		<h:form id="extInfDialogForm">
    		<div style="margin: 20px">
    		<br/>
    		
    		
			<p:fieldset legend="External Interfaces Connection Setup" toggleable="true" toggleSpeed="500">

				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

					<h:outputLabel value="Camera" />
					<p:selectBooleanCheckbox value="#{sessionController.extInfConnectConfig.cameraEnabled}" widgetVar="cameraCheck" />

					<h:outputLabel value="CCD" />
					<p:selectBooleanCheckbox value="#{sessionController.extInfConnectConfig.ccdEnabled}" widgetVar="ccdCheck" />

					<h:outputLabel value="ACS" />
					<p:selectBooleanCheckbox value="#{sessionController.extInfConnectConfig.acsEnabled}" widgetVar="acsCheck" />

					<h:outputLabel value="DCS" />
					<p:selectBooleanCheckbox value="#{sessionController.extInfConnectConfig.dcsEnabled}" widgetVar="dcsCheck" />

				</p:panelGrid>

			</p:fieldset>
    		
    		
    		</div>  
    	
    		
			<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px;">
				<p:commandButton id="button2" value="Ok" style="float:right" update=":growl :errorGrowl :menuForm"
					action="#{sessionController.doExtInfChange(true)}" oncomplete="PF('extInfDialog').hide();waitingPopup();"   />					
    			<p:commandButton id="button1" value="Cancel" style="float:right" update=":growl :errorGrowl :menuForm"
					action="#{sessionController.doExtInfChange(false)}" oncomplete="PF('extInfDialog').hide();" />
			</div>	
			
			<p:remoteCommand name="startSession" action="#{sessionController.doCheckStartSession}" update=":growl :errorGrowl" />
			
			</h:form>
		</p:dialog> 
		
<script>

//<![CDATA[		
		
function setAllExtInfCheckboxes() {
    if (PF('cameraCheck')) PF('cameraCheck').check();
    if (PF('ccdCheck')) PF('ccdCheck').check();
    if (PF('acsCheck')) PF('acsCheck').check();
    if (PF('dcsCheck')) PF('dcsCheck').check();
}
         
	function waitingPopup() {
		// popup a waiting popup if camera check is checked and execute a call to a JSF action
		
		if (PF('cameraCheck').input.is(':checked') || PF('ccdCheck').input.is('checked')) {
			
			// Maybe no dialog but instead the Camera Status should be "Initializing" in the header section
			// still execute call to JSF action here
			
			startSession();
			
		}

	}
	
           
//]]>
	
</script>


</ui:composition>
