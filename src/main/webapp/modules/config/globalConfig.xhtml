<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">


<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="setupForm"  style="margin:30px">

			<p:panelGrid columns="1" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

				<f:facet name="header">
					<h:outputText value="Global Configuration" />
				</f:facet>

				<p:fieldset legend="General" toggleable="true" toggleSpeed="500">

					<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

						<h:outputLabel value="Coarse Mirror Offset x(microns)" for="coarseMirrorX" />
						<p:inputText id="coarseMirrorX" value="#{globalConfigController.globalConfigDefaults.coarseMirrorX}" size="5" />

						<h:outputLabel value="Coarse Mirror Offset y(microns)" for="coarseMirrorY" />
						<p:inputText id="coarseMirrorY" value="#{globalConfigController.globalConfigDefaults.coarseMirrorY}" size="5" />

					</p:panelGrid>

				</p:fieldset>

				<p:spacer height="10px" />

				<p:fieldset legend="Advanced" toggleable="true" toggleSpeed="500">

					<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">


						<h:outputLabel value="Remove Bad Pixels" />
						<p:selectBooleanCheckbox value="#{globalConfigController.globalConfigDefaults.removeBadPixels}" />

						<h:outputLabel value="UFS/SUFS Auto Point Telescope to Segment/Group" />
						<p:selectOneMenu id="options" value="#{globalConfigController.globalConfigDefaults.autoPointTelescope}">
							<f:selectItem itemLabel="Auto Point Telescope" itemValue="1" />
							<f:selectItem itemLabel="Never Auto Point Telescope" itemValue="2" />
							<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />
						</p:selectOneMenu>


					</p:panelGrid>

				</p:fieldset>

				<p:spacer height="10px" />

				<p:fieldset legend="Procedure Display Preferences" toggleable="true" toggleSpeed="500">

					<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

						<p:spacer height="5px" />
						<p:spacer height="5px" />

						<h:outputLabel value="Auto Display Centroids" />
						<p:selectBooleanCheckbox value="#{globalConfigController.globalConfigDefaults.autoDisplayCentroids}" />
						<h:outputLabel value="Auto Display Centroid Offsets" />
						<p:selectBooleanCheckbox value="#{globalConfigController.globalConfigDefaults.autoDisplayCentroidOffsets}" />
						<h:outputLabel value="Auto Display Avg. Centroid Offsets" />
						<p:selectBooleanCheckbox value="#{globalConfigController.globalConfigDefaults.autoDisplayAvgCentroidOffsets}" />
						<h:outputLabel value="Auto Display Actuator Deltas" />
						<p:selectBooleanCheckbox value="#{globalConfigController.globalConfigDefaults.autoDisplayActuatorDeltas}" />
						<h:outputLabel value="Auto Display Procedure Data Log" />
						<p:selectBooleanCheckbox value="#{globalConfigController.globalConfigDefaults.autoDisplayProcedureDataLog}" />


					</p:panelGrid>

				</p:fieldset>


				<f:facet name="footer">
					<p:commandButton style="float:right" value="Save" icon="ui-icon-check" ajax="true" action="#{globalConfigController.doSaveSetup}" update=":growl :errorGrowl" />
					<p:commandButton style="float:right" value="Cancel" icon="ui-icon-cancel" ajax="true" immediate="true"
						action="#{globalConfigController.doCancelSaveSetup}" />
				</f:facet>

			</p:panelGrid>
		</h:form>
	</ui:define>

</ui:composition>
</html>
