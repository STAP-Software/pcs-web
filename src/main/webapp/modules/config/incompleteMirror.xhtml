<ui:composition template="../../template.xhtml" 
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets">

    <ui:define name="content">

			<div style="display: inline-flex; flex-direction: column; gap: 0; 
                width: fit-content; border: 1px solid #d0d0d0; margin: 30px">
			
		       <div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
                   padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
           			Select Desired Primary Mirror Configuration
       			</div>

        		<div style="padding: 16px;">
        		
	            	<div class="label-input-grid" 
	                 	style="display: grid; grid-template-columns: max-content;
	                        align-items: baseline; 
	                        row-gap: 24px; column-gap: 24px;">




			            <!-- Canvas outside any form -->
			            <canvas id="incmirCanvas" width="600" height="600" style="border:0px solid #d3d3d3;">
			                Your browser does not support HTML5 canvas.
			            </canvas>
			
			            <!-- Hidden inputs and remote commands inside a main form -->
			            <h:form id="incmirForm" style="display:none;">
			                <h:inputHidden id="mirrors" value="#{incompleteMirrorController.mirrors}" />
			                <h:inputHidden id="segCentDefXs" value="#{visualizationController.segCentersX}" />
			                <h:inputHidden id="segCentDefYs" value="#{visualizationController.segCentersY}" />
			
			                <p:remoteCommand name="selectSegment"
			                                 action="#{incompleteMirrorController.doHandleSelect}"
			                                 update=":incmirForm"
			                                 oncomplete="drawIncompleteMirror()" />
			
			                <p:remoteCommand name="initMirror"
			                                 oncomplete="drawIncompleteMirror(); initCanvasClickHandler();"
			                                 autoRun="true" />
			            </h:form>

 
					    <h:form style="margin:0;">
		            		<div style="display: flex; justify-content: flex-end; gap: 12px;">
					            <p:commandButton value="Save" icon="pi pi-check"
					                             action="#{incompleteMirrorController.doSave}"
					                             update=":growl :errorGrowl" />
					            <p:commandButton value="Reset" icon="pi pi-refresh"
					                             action="#{incompleteMirrorController.doReset}"
					                             update=":incmirForm"
					                             oncomplete="drawIncompleteMirror(); initCanvasClickHandler();" />
					        </div>
					    </h:form>

					</div>
				</div>
			</div>

        <script type="text/javascript">
        //<![CDATA[
        var sideLen = 77;
        var hexRadius = (Math.sqrt(3)/2) * sideLen;

        function drawIncompleteMirror() {
            var c = document.getElementById("incmirCanvas");
            var ctx = c.getContext("2d");
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.scale(0.61, 0.61);
            refreshIncMirDisplay();
        }

        function refreshIncMirDisplay() {
            var c = document.getElementById("incmirCanvas");
            var ctx = c.getContext("2d");

            var xField1 = document.getElementById('incmirForm:segCentDefXs').value;
            var xHexCenterArray = xField1.split(',');

            var yField1 = document.getElementById('incmirForm:segCentDefYs').value;
            var yHexCenterArray = yField1.split(',');

            var field = document.getElementById('incmirForm:mirrors').value;
            var mirrorStatusArray = field.split(',');

            var centerX = 512;
            var centerY = 512;

            for (var i = 0; i < xHexCenterArray.length; i++) {
                var x = centerX + parseFloat(xHexCenterArray[i]) * sideLen;
                var y = centerY - parseFloat(yHexCenterArray[i]) * sideLen;
                drawHex(ctx, x, y, sideLen, i + 1, mirrorStatusArray[i]);
            }
        }

        function drawHex(ctx, x, y, sideLen, number, isPresent) {
            var a = sideLen;
            var b = a * Math.sqrt(3) / 2;

            ctx.beginPath();
            ctx.strokeStyle = '#888888';
            ctx.moveTo(x - a, y);
            ctx.lineTo(x - a/2, y - b);
            ctx.lineTo(x + a/2, y - b);
            ctx.lineTo(x + a, y);
            ctx.lineTo(x + a/2, y + b);
            ctx.lineTo(x - a/2, y + b);
            ctx.closePath();
            ctx.stroke();

            ctx.fillStyle = (isPresent == 1) ? "#e8f0f8" : "#ffffff";
            ctx.fill();

            ctx.fillStyle = '#888888';
            ctx.font="28px Arial";
            ctx.fillText(number, x - (number>9?15:10), y + 10);
        }

        function getIncMirMousePos(canvas, evt) {
            var rect = canvas.getBoundingClientRect();
            return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
        }

        function initCanvasClickHandler() {
            var canvas = document.getElementById("incmirCanvas");
            $(canvas).off('click');
            $(canvas).on('click', function(e) {
                var mousePos = getIncMirMousePos(canvas, e);
                selectSegment([
                    {name: 'canvas_x', value: mousePos.x},
                    {name: 'canvas_y', value: mousePos.y}
                ]);
            });
        }
        //]]>
        </script>

    </ui:define>
</ui:composition>
