<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="missingSpotsForm">

			<h:inputHidden id="centroidNbrs" value="#{missingSpotsController.centroidNumbers}" />
			<h:inputHidden id="centroidXs" value="#{missingSpotsController.centroidXs}" />
			<h:inputHidden id="centroidYs" value="#{missingSpotsController.centroidYs}" />
			<h:inputHidden id="missingSpots" value="#{missingSpotsController.missingSpots}" />
			<h:inputHidden id="showSegNum" value="#{missingSpotsController.showSegmentNumbers}" />
			<h:inputHidden id="groupSegmentNumbers" value="#{missingSpotsController.groupSegmentNumbers}" />

			<div style="display: inline-flex; flex-direction: column; gap: 0; 
			            width: fit-content; border: 1px solid #d0d0d0; margin: 30px">
			
			    <div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
			               padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
			
			        <!-- Container for all 4 pairs -->
			        <h:panelGroup layout="block" style="display:flex; gap:36px; flex-wrap:wrap;">
			
			            <!-- Pair 1: Spot List Type -->
			            <h:panelGroup layout="block" style="display:flex; flex-direction:column; gap:6px;">
			                <h:panelGroup layout="block" style="display:flex; align-items:center; gap:10px;">
			                    <h:outputLabel value="Spot List Type" />
			                    <p:selectOneMenu id="options1" value="#{missingSpotsController.spotListType}" 
			                                     style="min-width:160px;"
			                                     rendered="#{not missingSpotsController.pupilMaskType.pupilMaskTypePh}">
			                        <f:selectItem itemLabel="Find and Identify" itemValue="1" />
			                        <f:selectItem itemLabel="Analysis" itemValue="2" />
			                        <p:ajax update="spotSelector centroidNbrs centroidXs centroidYs missingSpots" 
			                                listener="#{missingSpotsController.listViewChangeListener}"
			                                oncomplete="drawMissingSpots();" />
			                    </p:selectOneMenu>
			
			                    <p:selectOneMenu id="options2" value="#{missingSpotsController.spotListType}" 
			                                     style="min-width:160px;"
			                                     rendered="#{missingSpotsController.pupilMaskType.pupilMaskTypePh}">
			                        <f:selectItem itemLabel="Find and Identify" itemValue="1" />
			                        <f:selectItem itemLabel="CPH Analysis" itemValue="2" />
			                        <f:selectItem itemLabel="NPH Analysis" itemValue="3" />
			                        <p:ajax update="spotSelector centroidNbrs centroidXs centroidYs missingSpots" 
			                                listener="#{missingSpotsController.listViewChangeListener}"
			                                oncomplete="drawMissingSpots();" />
			                    </p:selectOneMenu>
			                </h:panelGroup>
			            </h:panelGroup>
			
			            <!-- Pair 2: Mask Type -->
			            <h:panelGroup layout="block" style="display:flex; flex-direction:column; gap:6px;">
			                <h:panelGroup layout="block" style="display:flex; align-items:center; gap:10px;">
			                    <h:outputLabel value="Mask Type" />
			                    <h:panelGroup id="maskPanel">
			                        <p:selectOneMenu value="#{missingSpotsController.pupilMaskType}" 
			                                         style="min-width:90px;"
			                                         converter="#{pupilMaskTypeConverter}">
			                            <f:selectItems value="#{pupilMaskController.pupilMaskTypeList}" var="type" 
			                                           itemLabel="#{type.pupilMaskTypeName}" itemValue="#{type}" />
			                            <p:ajax event="change" update=":missingSpotsForm" 
			                                    listener="#{missingSpotsController.listViewChangeListener}" 
			                                    process="@this" oncomplete="drawMissingSpots();" />
			                        </p:selectOneMenu>
			                    </h:panelGroup>
			                </h:panelGroup>
			            </h:panelGroup>
			
			            <!-- Pair 3: SUFS Group -->
			            <h:panelGroup layout="block" style="display:flex; flex-direction:column; gap:6px;">
			                <h:panelGroup layout="block" style="display:flex; align-items:center; gap:10px;">
			                    <h:outputLabel value="SUFS Group" rendered="#{missingSpotsController.renderSufsGroup}" />
			                    <h:panelGroup id="sufsGroupPanel" rendered="#{missingSpotsController.renderSufsGroup}">
			                        <p:selectOneMenu value="#{missingSpotsController.sufsGroup}" 
			                                         style="min-width:60px;"
			                                         converter="#{sufsGroupConverter}">
			                            <f:selectItems value="#{missingSpotsController.sufsGroupList}" var="group" 
			                                           itemLabel="#{group.groupNumber}" itemValue="#{group}" />
			                            <p:ajax update="groupSegmentNumbers maskPanel centroidDisplay spotSelector centroidNbrs centroidXs centroidYs missingSpots"  
			                                    listener="#{missingSpotsController.listViewChangeListener}" 
			                                    oncomplete="drawMissingSpots();" />
			                        </p:selectOneMenu>
			                    </h:panelGroup>
			                </h:panelGroup>
			            </h:panelGroup>
			
			            <!-- Pair 4: Show Segment Numbers -->
			            <h:panelGroup layout="block" style="display:flex; flex-direction:column; gap:6px;">
			                <h:panelGroup layout="block" style="display:flex; align-items:center; gap:10px;">
			                    <h:outputLabel value="Show Segment Numbers" rendered="#{missingSpotsController.renderSufsGroup}" />
			                    <h:panelGroup id="showSegNumPanel" rendered="#{missingSpotsController.renderSufsGroup}">
			                        <p:selectBooleanCheckbox id="showSegmentNumbers" value="#{missingSpotsController.showSegmentNumbers}">
			                            <p:ajax update="showSegNum maskPanel centroidDisplay spotSelector centroidNbrs centroidXs centroidYs missingSpots" 
			                                    oncomplete="drawMissingSpots();" />
			                        </p:selectBooleanCheckbox>
			                    </h:panelGroup>
			                </h:panelGroup>
			            </h:panelGroup>
			
			        </h:panelGroup>
			
			    </div>
			
			    <div style="padding: 16px;">
        		
	            	<div id="centroidDisplay" style="display: flex; flex-direction: row; align-items: flex-start; gap: 24px;">
  
						<canvas id="spotCanvas" width="750" height="750" style="border:1px solid #d3d3d3;"> Your browser does not support the HTML5 canvas tag.</canvas>					
						
						<div style="display:flex; flex-direction:column; gap:4px;">
						    <div style="font-size:16px; font-family:Arial, sans-serif; font-weight:normal;">spot #</div>
						    <p:scrollPanel style="width:200px;height:728px">
						        <p:selectManyCheckbox id="spotSelector" value="#{missingSpotsController.selectedSpots}" layout="pageDirection" converter="jakarta.faces.Integer">
						            <f:selectItems value="#{missingSpotsController.spots}" />
						            <p:ajax update="centroidNbrs centroidXs centroidYs missingSpots spotSelector" 
						                    listener="#{missingSpotsController.spotChangeListener}" 
						                    oncomplete="drawMissingSpots();"/>
						        </p:selectManyCheckbox>
						    </p:scrollPanel>
						</div>						
						<!--  			
						<p:selectManyMenu id="spotSelector" value="#{missingSpotsController.selectedSpots}" label="Spots" filter="true" showCheckbox="true"
							filterMatchMode="contains" var="spot" style="height:748px;width:150px" converter="jakarta.faces.Integer">
							<f:selectItems value="#{missingSpotsController.spots}" />
							<p:column>spot # #{spot}</p:column>
							<p:ajax update="centroidDisplay spotSelector centroidNbrs centroidXs centroidYs missingSpots" listener="#{missingSpotsController.spotChangeListener}" oncomplete="runDrawMissingSpots();"/>
						</p:selectManyMenu>
						-->
					
		                <p:remoteCommand name="initSpots" oncomplete="drawMissingSpots();" autoRun="true" />
				
					</div>
					
					<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px;">

						<p:commandButton value="Save" icon="pi pi-check" ajax="true" action="#{missingSpotsController.doSave}" update=":growl :errorGrowl" />
						<p:commandButton value="Reset" icon="pi pi-refresh" ajax="false" action="#{missingSpotsController.doViewMissingSpots}" />

			        </div>
				</div>
			</div>


		</h:form>


<script type="text/javascript">  
//<![CDATA[
    

function drawMissingSpots() {
	
	var c = document.getElementById("spotCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,c.width, c.height);

	var numbersField = document.getElementById('missingSpotsForm:centroidNbrs').value;
	var numbersArray = numbersField.split(','); 
  
	var xField = document.getElementById('missingSpotsForm:centroidXs').value;
	var xArray = xField.split(','); 
  
	var yField = document.getElementById('missingSpotsForm:centroidYs').value;
	var yArray = yField.split(','); 
	var msField = document.getElementById('missingSpotsForm:missingSpots').value;
	var msArray = msField.split(','); 
  
	
	var fontSize;
	if (numbersArray.length > 1000) {
		fontSize = 8;
	} else if (numbersArray.length > 200) {
		fontSize = 10;
	} else if (numbersArray.length > 100) {
		fontSize = 12;
	} else {
		fontSize = 14;
	}
	
	ctx.font = fontSize + "px Arial";
	
	for (i = 0; i < numbersArray.length; i++) {
		var missingSpot = false;
		for (j = 0; j < msArray.length; j++) {
			if (numbersArray[i] == msArray[j].trim()) {
				missingSpot = true;
			}
		}
		
		if (missingSpot) {
			ctx.fillStyle = "red";			
		} else {
	 		ctx.fillStyle = "blue";
		}
		ctx.fillText(numbersArray[i], (xArray[i] * 0.78) - 45, (yArray[i] * 0.78) - 20);	
	}
	
	
	var numberSegments = document.getElementById('missingSpotsForm:showSegNum').value;

	if (numberSegments=="true") {
		
		var gsnField = document.getElementById('missingSpotsForm:groupSegmentNumbers').value;
		var gsnArray = gsnField.split(','); 		

		ctx.font = "30px Arial";
		ctx.fillStyle = "black";			
		ctx.fillText(gsnArray[0], (512 * 0.78) - 55, (512 * 0.78) - 15);
		
		
		
		ctx.fillText(gsnArray[1], (512 * 0.78) - 55, (768 * 0.78) - 25);	
		
		ctx.fillText(gsnArray[2], (768 * 0.78) - 70, (640 * 0.78) - 20);	
		
		ctx.fillText(gsnArray[3], (768 * 0.78) - 70, (384 * 0.78) - 10);	
		
		ctx.fillText(gsnArray[4], (512 * 0.78) - 55, (256 * 0.78) - 5);	
		
		ctx.fillText(gsnArray[5], (256 * 0.78) - 40, (384 * 0.78) - 10);	
		
		ctx.fillText(gsnArray[6], (256 * 0.78) - 40, (640 * 0.78) - 20);	

	}
	
	
}


//]]>  
</script>  







 
	</ui:define>
</ui:composition>
</html>
