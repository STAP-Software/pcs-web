<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

   <ui:define name="content">
      
      
      	 
 		
       	<h:form id="setupForm">
       		
       		<p:panelGrid columns="1" style="margin:30px;" styleClass="pcsForm" >
       		
       			<f:facet name="header">
					Setup Information
				</f:facet>
 
        		<h:outputLabel style="height: 8px" />
       			<h:outputLabel />
 
 				<p:fieldset legend="General" toggleable="true" toggleSpeed="500">
 				
       			<p:panelGrid columns="2" style="margin:10px;"  columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
       		
    			<h:outputLabel value="Coarse Mirror Offset x(microns)" for="coarseMirrorX" />  			
    			<p:inputText id="coarseMirrorX" value="#{setupController.setup.coarseMirrorX}"  size="5" />
 
   				<h:outputLabel value="Coarse Mirror Offset y(microns)" for="coarseMirrorY" />  			
    			<p:inputText id="coarseMirrorY" value="#{setupController.setup.coarseMirrorY}"  size="5" />
 
    			<h:outputLabel value="Find and Identify Attempts" />
    			<p:inputText value="#{setupController.setup.fandIAttempts}" size="2"/>   		

   				<h:outputLabel value="Rotate Camera (deg)" />
    			<p:inputText value="#{setupController.setup.cameraRot}" size="6"/>   		

				</p:panelGrid>
				
				</p:fieldset>
				
				<p:fieldset legend="Advanced" toggleable="true" toggleSpeed="500">
 				
       			<p:panelGrid columns="2" style="margin:10px;"  columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
				

    			<h:outputLabel value="Remove Bad Pixels" />
    			<p:selectBooleanCheckbox value="#{setupController.setup.removeBadPixels}" />   		

  				<h:outputLabel value="Subtract Dark Current" />
    			<p:selectBooleanCheckbox value="#{setupController.setup.subtractDarkCurrent}" />   		

   				<h:outputLabel value="Flatten Field" />
    			<p:selectBooleanCheckbox value="#{setupController.setup.flattenField}" />   		

   				<h:outputLabel value="UFS/SUFS Auto Point Telescope to Segment/Group" />
    			<p:selectOneMenu id="options" value="#{setupController.setup.autoPointTelescope}">  
            		<f:selectItem itemLabel="Auto Point Telescope" itemValue="1" />  
            		<f:selectItem itemLabel="Never Auto Point Telescope" itemValue="2" />  
            		<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />  
        		</p:selectOneMenu>   		
       		


  				<h:outputLabel value="Comparison Phasing PLOG filename" for="compPhasingFile" />  			
    			<p:inputText id="compPhasingFile" value="#{setupController.setup.compPhasingPlogFilename}"  size="40" />

				</p:panelGrid>
				
				</p:fieldset>
 
       			<h:outputLabel style="height: 10px" />
       			<h:outputLabel style="height: 10px" />
       			
       			<f:facet name="footer">
					<p:commandButton value="Save" icon="ui-icon-check" ajax="false" action="#{setupController.doCancelSaveSetup}" />
					<p:commandButton value="Cancel" icon="ui-icon-check" ajax="false" action="#{setupController.doCancelSaveSetup}" />
					<p:commandButton value="Reset" icon="ui-icon-check" ajax="false" action="#{setupController.doCancelSaveSetup}" />
					<p:commandButton value="Reset to Last Session" icon="ui-icon-check" ajax="false" action="#{setupController.doCancelSaveSetup}" />
				</f:facet>

        	</p:panelGrid>
    		
    		
       	</h:form>
              
   </ui:define>
</ui:composition>
</html>
