<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="acsManualForm">


			<p:panelGrid columns="3" style="margin:10px;"
				styleClass="pcsExecutionPanel">
				<p:panelGrid columns="1" style="margin:10px;" styleClass="pcsForm">

					<f:facet name="header">
					ACS Command Tool
					</f:facet>

					<p:dataTable value="#{acsManualController.actDeltas}" var="segAct" rowIndexVar="rowIndex" paginator="true" rows="12">

						<p:column headerText="Segment">
							<h:outputLabel value="#{rowIndex + 1}" />
						</p:column>
						<p:column headerText="Actuator 1 (um)">
							<p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][0]}" />
						</p:column>
						<p:column headerText="Actuator 2 (um)">
							<p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][1]}" />
						</p:column>
						<p:column headerText="Actuator 3 (um)">
							<p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][2]}" />
						</p:column>
						

					</p:dataTable>

					<h:outputLabel style="height: 10px" />

					<f:facet name="footer">
						<p:commandButton value="Send Commands" icon="ui-icon-check"
							ajax="false" action="#{acsManualController.doSendCommand}"
							update=":growl" />
					</f:facet>

				</p:panelGrid>


			</p:panelGrid>

		</h:form>

	</ui:define>
</ui:composition>
</html>
