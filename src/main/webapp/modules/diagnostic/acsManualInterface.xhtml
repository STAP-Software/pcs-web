<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="acsManualForm">


			<p:panelGrid columns="2" style="margin:10px;" styleClass="pcsExecutionPanel">
				<p:panelGrid columns="1" style="margin:0" styleClass="pcsForm">

					<f:facet name="header">
					ACS Actuator Delta Command Tool
					</f:facet>
					

					<p:dataTable value="#{acsManualController.actDeltas}" var="segAct" rowIndexVar="rowIndex" paginator="true" rows="12">

						<p:column headerText="Segment">
							<h:outputLabel value="#{rowIndex + 1}" />
						</p:column>
						<p:column headerText="Actuator 1 (nm)">
							<p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][0]}" />
						</p:column>
						<p:column headerText="Actuator 2 (nm)">
							<p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][1]}" />
						</p:column>
						<p:column headerText="Actuator 3 (nm)">
							<p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][2]}" />
						</p:column>
						

					</p:dataTable>

						<p:panelGrid styleClass="pcsFormNoBorder">
							<p:row>
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Upload values from File: " style="position:relative; top:-10px"/>
								</p:column>
								<p:column>
									<p:fileUpload fileUploadListener="#{acsManualController.handleFileUpload}" mode="advanced" update=":growl :errorGrowl @form"
										sizeLimit="40000" auto="true" styleClass="no-expand"/>
								</p:column>
							</p:row>

						</p:panelGrid>
					

					<h:outputLabel style="height: 0px" />
											
					<f:facet name="footer">
						<p:commandButton value="Reset" icon="ui-icon-refresh"
							ajax="false" action="#{acsManualController.doClear}" update="@form"/>
						<p:commandButton value="Send Commands" icon="ui-icon-check"
							ajax="false" action="#{acsManualController.doSendActDeltaCommands}"
							update=":growl :errorGrowl" />
					</f:facet>

				</p:panelGrid>
				
				<p:panelGrid columns="1" style="margin-top:5px;" styleClass="pcsFormNoBorder">
				<p:panelGrid columns="3" style="margin:0px;width:100%" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormInputColumn">
					<f:facet name="header">
						ACS Query Tool
					</f:facet>
					
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					
					<h:outputLabel value="Mirror Temp (C)" style="position:relative; top:5px" />
					<h:outputText value="#{acsManualController.mirrorTemp}" style="position:relative; top:8px"/>
					<p:commandButton value="Query" icon="ui-icon-refresh"
							ajax="false" action="#{acsManualController.doQueryMirrorTemp}"
							update=":growl :errorGrowl" />		
										
					<h:outputLabel value="Is Running" style="position:relative; top:5px" />
					<h:outputText value="#{acsManualController.acsRunning}" style="position:relative; top:8px"/>
					<p:commandButton value="Query" icon="ui-icon-refresh"
							ajax="false" action="#{acsManualController.doQueryRunning}"
							update=":growl :errorGrowl" />		
						
					<h:outputLabel value="RMS Actuator Move (nm)" style="position:relative; top:5px" />
					<h:outputText value="#{acsManualController.rmsActuatorMove}" style="position:relative; top:8px"/>
					<p:commandButton value="Query" icon="ui-icon-refresh"
							ajax="false" action="#{acsManualController.doQueryRmsActMove}"
							update=":growl :errorGrowl" />		
						
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
						
					<f:facet name="footer">
						<p:commandButton value="Query All" icon="ui-icon-refresh"
							ajax="false" action="#{acsManualController.doQueryAll}"
							update=":growl :errorGrowl" />
					
					</f:facet>
				</p:panelGrid>
				
				<p:panelGrid columns="2" style="margin-top:30px;width:100%" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					<f:facet name="header">
						ACS Snapshot Tool
					</f:facet>
					
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					
					<h:outputLabel value="Snapshot number" />
					<p:inputText size="6" value="#{acsManualController.snapshotNumber}" />
						
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
						
					<f:facet name="footer">
						<p:commandButton value="Load Snapshot" icon="ui-icon-transferthick-e-w"
							ajax="false" action="#{acsManualController.doLoadSnapshot}"
							update=":growl :errorGrowl" />
					
						<p:commandButton value="Take Snapshot" icon="ui-icon-check"
							ajax="false" action="#{acsManualController.doTakeSnapshot}"
							update=":growl :errorGrowl" />
					</f:facet>
				</p:panelGrid>


			</p:panelGrid>
			</p:panelGrid>

		</h:form>

	</ui:define>
</ui:composition>
</html>
