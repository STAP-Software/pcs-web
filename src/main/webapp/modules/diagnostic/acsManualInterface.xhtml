<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui">

<ui:composition template="../../template.xhtml">

    <ui:define name="content">

        <h:form id="acsManualForm">

            <div style="display:flex; flex-direction:row; align-items:flex-start; gap:24px; margin:30px;">

                <!-- Left column: Actuator Delta Command Tool -->
                <div style="display:inline-flex; flex-direction:column; gap:0; width:fit-content; border:1px solid #d0d0d0;">
                
                    <div style="background:#e8e8e8; border-bottom:1px solid #d0d0d0;
                               padding:6px 12px; font-weight:bold; font-size:18px; font-family:Arial, sans-serif;">
                        ACS Actuator Delta Command Tool
                    </div>

                    <div style="padding:16px;">

                        <p:dataTable id="actDeltasTable" value="#{acsManualController.actDeltas}" var="segAct" rowIndexVar="rowIndex" 
                                     paginator="true" rows="12" tableStyle="width:auto">
                        
                            <p:column headerText="Segment" style="width:70px">
                                <h:outputLabel value="#{rowIndex + 1}" />
                            </p:column>
                            <p:column headerText="Actuator 1 (nm)" style="width:100px">
                                <p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][0]}" />
                            </p:column>
                            <p:column headerText="Actuator 2 (nm)" style="width:100px">
                                <p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][1]}" />
                            </p:column>
                            <p:column headerText="Actuator 3 (nm)" style="width:100px">
                                <p:inputText size="4" value="#{acsManualController.actDeltas[rowIndex][2]}" />
                            </p:column>
                        
                        </p:dataTable>
                        
						<div style="border:1px solid #d0d0d0; padding:12px; margin-top:16px;">
						    <div style="font-weight:bold; font-size:14px; font-family:Arial, sans-serif; 
						                margin-bottom:12px;">
						        Upload Values from File
						    </div>
							<p:fileUpload id="fileUpload"
							              mode="advanced"
							              auto="false"
							              multiple="false"
							              maxFileSize="10485760"
							              accept="*/*"
							              listener="#{acsManualController.handleFileUpload}"
							              update="@form :growl :errorGrowl"/>
			                           
			 			</div>

						
				        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:16px;">
							<p:commandButton value="Reset" icon="pi pi-refresh"
							    action="#{acsManualController.doClear}"
							    process="@this :acsManualForm:actDeltasTable"
							    update="@form"/>
							
							<p:commandButton value="Send Commands" icon="pi pi-send"
							    action="#{acsManualController.doSendActDeltaCommands}"
							    process="@this :acsManualForm:actDeltasTable"
							    update=":growl :errorGrowl"/>
			    
			            </div>

                    </div>
                </div>

                <!-- Right column: Query Tool + Snapshot Tool stacked -->
                <div style="display:flex; flex-direction:column; gap:24px; width:fit-content; align-items:stretch;">

                    <!-- ACS Query Tool -->
                    <div style="display:inline-flex; flex-direction:column; gap:0; width:fit-content; border:1px solid #d0d0d0;">
                        <div style="background:#e8e8e8; border-bottom:1px solid #d0d0d0;
                                   padding:6px 12px; font-weight:bold; font-size:18px; font-family:Arial, sans-serif;">
                            ACS Query Tool
                        </div>
                        <div style="padding:16px;">
                        
                            <div class="label-value-grid" 
                                 style="display: grid; grid-template-columns: max-content max-content max-content;
                                        align-items: baseline; 
                                        row-gap: 20px; column-gap: 24px;">

                                <h:outputLabel value="Mirror Temp (C)" style="font-weight:bold; position:relative; top:-3px" />
                                <h:outputText value="#{acsManualController.mirrorTemp}" style="font-weight:normal; position:relative; top:0px">
                                    <f:convertNumber pattern="#0.000" />
                                </h:outputText>
                                <p:commandButton value="Query" icon="pi pi-refresh"
                                    action="#{acsManualController.doQueryMirrorTemp}"
                                    process="@this"
                                    update=":growl :errorGrowl :acsManualForm" />

                                <h:outputLabel value="Is Running" style="font-weight:bold; position:relative; top:-3px" />
                                <h:outputText value="#{acsManualController.acsRunning}" style="font-weight:normal; position:relative; top:0px"/>
                                <p:commandButton value="Query" icon="pi pi-refresh"
                                    action="#{acsManualController.doQueryRunning}"
                                    process="@this"
                                    update=":growl :errorGrowl :acsManualForm" />

                                <h:outputLabel value="RMS Actuator Move (nm)" style="font-weight:bold; position:relative; top:-3px" />
                                <h:outputText value="#{acsManualController.rmsActuatorMove}" style="font-weight:normal; position:relative; top:0px">
                                    <f:convertNumber pattern="#0.000" />
                                </h:outputText>
                                <p:commandButton value="Query" icon="pi pi-refresh"
                                    action="#{acsManualController.doQueryRmsActMove}"
                                    process="@this"
                                    update=":growl :errorGrowl :acsManualForm" />

                                <h:outputLabel value="Sensor Range (nm)" style="font-weight:bold; position:relative; top:-3px" />
                                <h:outputText value="#{acsManualController.sensorRange}" style="font-weight:normal; position:relative; top:0px">
                                    <f:convertNumber pattern="#0" />
                                </h:outputText>
                                <p:commandButton value="Query" icon="pi pi-refresh"
                                    action="#{acsManualController.doQuerySensorRange}"
                                    process="@this"
                                    update=":growl :errorGrowl :acsManualForm" />

                            </div>
                            <div style="display:flex; justify-content:flex-end; margin-top:16px;">
                                <p:commandButton value="Query All" icon="pi pi-sync"
                                    action="#{acsManualController.doQueryAll}"
                                    process="@this"
                                    update=":growl :errorGrowl :acsManualForm" />
                            </div>
                        </div>
                    </div>

                    <!-- ACS Snapshot Tool -->
                    <div style="display:flex; flex-direction:column; gap:0; width:100%; border:1px solid #d0d0d0;">
                        <div style="background:#e8e8e8; border-bottom:1px solid #d0d0d0;
                                   padding:6px 12px; font-weight:bold; font-size:18px; font-family:Arial, sans-serif;">
                            ACS Snapshot Tool
                        </div>
                        <div style="padding:16px;">
                            <p:panelGrid columns="2" style="margin:0px;width:100%" styleClass="pcsForm"
                                         columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

                                <h:outputLabel value="Snapshot number" style="font-weight:bold" />
                                <p:inputText size="6" value="#{acsManualController.snapshotNumber}" />

                            </p:panelGrid>
                            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:16px;">
                                <p:commandButton value="Load Snapshot" icon="pi pi-download"
                                    action="#{acsManualController.doLoadSnapshot}"
                                    process="@this :acsManualForm:snapshotNumber"
                                    update=":growl :errorGrowl :acsManualForm" />
                                <p:commandButton value="Take Snapshot" icon="pi pi-save"
                                    action="#{acsManualController.doTakeSnapshot}"
                                    process="@this :acsManualForm:snapshotNumber"
                                    update=":growl :errorGrowl :acsManualForm" />
                            </div>
                        </div>
                    </div>

                </div>
                <!-- end right column -->

            </div>

        </h:form>

    </ui:define>
</ui:composition>
</html>
