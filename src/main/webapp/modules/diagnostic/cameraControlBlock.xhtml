<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">


	<p:panelGrid columns="2" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

		<h:outputLabel value="Command" />
		<p:selectOneMenu value="#{cameraManualController.commandSelection}" style="top:2px">
			<f:selectItem itemLabel="Pupil Mask" itemValue="1" />
			<f:selectItem itemLabel="Filter" itemValue="2" />
			<f:selectItem itemLabel="Ref. Beam" itemValue="3" />
			<f:selectItem itemLabel="Shutter" itemValue="4" />
			<f:selectItem itemLabel="Fine Tilt (&#181;m)" itemValue="5" />
			<f:selectItem itemLabel="Coarse Tilt (&#181;m)" itemValue="6" />
			<f:selectItem itemLabel="Two Position Mech" itemValue="7" />
			<f:selectItem itemLabel="CCD Power" itemValue="8" />

			<p:ajax update="cameraCommandPanel" />
		</p:selectOneMenu>
		<h:outputLabel value="" />
		<h:panelGroup id="cameraCommandPanel">
			<p:selectOneMenu value="#{cameraManualController.selectedPupilMaskPos}" style="top:2px"
				rendered="#{cameraManualController.commandSelection eq 1}">
				<f:selectItem itemLabel="Position 1" itemValue="1" />
				<f:selectItem itemLabel="Position 2" itemValue="2" />
				<f:selectItem itemLabel="Position 3" itemValue="3" />
				<f:selectItem itemLabel="Position 4" itemValue="4" />
				<f:selectItem itemLabel="Position 5" itemValue="5" />
				<f:selectItem itemLabel="Position 6" itemValue="6" />
			</p:selectOneMenu>

			<p:selectOneMenu value="#{cameraManualController.selectedFilterWheelPos}" style="top:2px"
				rendered="#{cameraManualController.commandSelection eq 2}">
				<f:selectItem itemLabel="Position 1" itemValue="1" />
				<f:selectItem itemLabel="Position 2" itemValue="2" />
				<f:selectItem itemLabel="Position 3" itemValue="3" />
				<f:selectItem itemLabel="Position 4" itemValue="4" />
				<f:selectItem itemLabel="Position 5" itemValue="5" />
				<f:selectItem itemLabel="Position 6" itemValue="6" />
			</p:selectOneMenu>

			<p:selectOneMenu value="#{cameraManualController.selectedRefBeam}" style="top:2px" rendered="#{cameraManualController.commandSelection eq 3}">
				<f:selectItem itemLabel="Ref. Beam 1" itemValue="1" />
				<f:selectItem itemLabel="Ref. Beam 2" itemValue="2" />
				<f:selectItem itemLabel="Ref. Beam 3" itemValue="3" />
				<f:selectItem itemLabel="Ref. Beam 4" itemValue="4" />
				<f:selectItem itemLabel="Ref. Beam 5" itemValue="5" />
				<f:selectItem itemLabel="Ref. Beam 6" itemValue="6" />
				<f:selectItem itemLabel="Ref. Beam 7" itemValue="7" />
				<f:selectItem itemLabel="Ref. Beam 8" itemValue="8" />
				<f:selectItem itemLabel="Ref. Beam 9" itemValue="9" />
				<f:selectItem itemLabel="Ref. Beams Off" itemValue="0" />
			</p:selectOneMenu>

			<p:selectOneMenu value="#{cameraManualController.shutterCmd}" style="top:2px" rendered="#{cameraManualController.commandSelection eq 4}">
				<f:selectItem itemLabel="Open" itemValue="1" />
				<f:selectItem itemLabel="Close" itemValue="2" />
				<f:selectItem itemLabel="Timed Exposure" itemValue="3" />
				<p:ajax update="cameraCommandPanel" />
			</p:selectOneMenu>
			<h:outputText value="&#160;&#160;&#160;&#160;Exposure Time (sec) &#160;&#160;" rendered="#{cameraManualController.renderExposureTime}" />
			<p:inputText value="#{cameraManualController.ccdExposureTime}" size="5" rendered="#{cameraManualController.renderExposureTime}" />

			<h:outputText value="x &#160;&#160;" rendered="#{cameraManualController.commandSelection eq 5}" />
			<p:inputText value="#{cameraManualController.fineTiltCmd.x}" size="3" rendered="#{cameraManualController.commandSelection eq 5}" />
			<h:outputText value="&#160;&#160;y &#160;&#160;" rendered="#{cameraManualController.commandSelection eq 5}" />
			<p:inputText value="#{cameraManualController.fineTiltCmd.y}" size="3" rendered="#{cameraManualController.commandSelection eq 5}" />

			<h:outputText value="x &#160;&#160;" rendered="#{cameraManualController.commandSelection eq 6}" />
			<p:inputText value="#{cameraManualController.coarseTiltCmd.x}" size="3" rendered="#{cameraManualController.commandSelection eq 6}" />
			<h:outputText value="&#160;&#160;y &#160;&#160;" rendered="#{cameraManualController.commandSelection eq 6}" />
			<p:inputText value="#{cameraManualController.coarseTiltCmd.y}" size="3" rendered="#{cameraManualController.commandSelection eq 6}" />

			<p:selectOneMenu value="#{cameraManualController.twoPosCmd}" style="top:2px" rendered="#{cameraManualController.commandSelection eq 7}">
				<f:selectItem itemLabel="Extend" itemValue="1" />
				<f:selectItem itemLabel="Retract" itemValue="2" />
			</p:selectOneMenu>

			<p:selectOneMenu value="#{cameraManualController.ccd.state}" style="top:2px" rendered="#{cameraManualController.commandSelection eq 8}">
				<f:selectItem itemLabel="On" itemValue="1" />
				<f:selectItem itemLabel="Off" itemValue="2" />
			</p:selectOneMenu>


		</h:panelGroup>

		<p:spacer height="1px" />
		<p:spacer height="1px" />

		<f:facet name="footer">
			<p:commandButton value="Send Command" icon="ui-icon-check" ajax="true" action="#{cameraManualController.doSendCommand}"
				update="cameraPanel :growl :errorGrowl" />
		</f:facet>


	</p:panelGrid>


</ui:composition>
