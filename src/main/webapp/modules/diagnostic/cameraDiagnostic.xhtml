<ui:composition template="../../template.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

	<ui:define name="content">

		<h:form id="cameraDiagForm" style="margin:30px">

			<div style="display: flex; align-items: flex-start; gap: 24px;">

				<!-- Camera Status -->
				<div style="display: inline-flex; flex-direction: column; gap: 0;
					width: fit-content; border: 1px solid #d0d0d0;">

					<div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
						padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
						Camera Status
					</div>

					<div style="padding: 16px;">
						<ui:include src="../diagnostic/cameraDiagnosticStatusBlock.xhtml"/>
					</div>

				</div>

				<!-- Camera Manual Control -->
				<div style="display: inline-flex; flex-direction: column; gap: 0;
					width: fit-content; border: 1px solid #d0d0d0;">

					<div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
						padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
						Camera Manual Control
					</div>

					<div style="padding: 16px;">
						<ui:include src="../diagnostic/cameraDiagnosticControlBlock.xhtml"/>
					</div>

				</div>

			</div>

		</h:form>

	</ui:define>
</ui:composition>
