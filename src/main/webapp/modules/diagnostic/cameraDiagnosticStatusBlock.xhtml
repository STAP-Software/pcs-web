<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panelGrid id="cameraStatusPanel" columns="3" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormInputColumn">

		<h:outputLabel value="Pupil Mask" />	
		<h:outputText value="#{cameraManualController.camera.pupilWheel.selectedPupilMask.wheelPosition} (#{cameraManualController.camera.pupilWheel.selectedPupilMask.maskName})" style="position:relative; top:0px" />
		<h:outputText value="#{cameraManualController.camera.pupilWheel.rawStateDisplayString}" style="position:relative; top:0px" />
		
		<h:outputLabel value="Filter" />
		<h:outputText value="#{cameraManualController.camera.filterWheel.selectedFilter.wheelPosition} (#{cameraManualController.camera.filterWheel.selectedFilter.filterName})" style="position:relative; top:0px" />
		<h:outputText value="#{cameraManualController.camera.filterWheel.rawStateDisplayString}" style="position:relative; top:0px" />

		<h:outputLabel value="Ref. Beam" />
		<h:outputText value="#{cameraManualController.camera.currentRefBeamDisplayString}" style="position:relative; top:0px" />
		<h:outputText />

		<h:outputLabel value="Shutter" />
		<h:outputText value="#{cameraManualController.camera.shutter.shutterDisplayString}" style="position:relative; top:0px" />
		<h:outputText value="#{cameraManualController.camera.shutter.rawStateDisplayString}" style="position:relative; top:0px" />


		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','TiltPlateX')}" />						
		<h:outputLabel value="Fine Pupil Adj (x) (#{fieldMetaData.units})" />
		<h:outputText value="#{cameraManualController.camera.fineTiltMirror.currentPosition.x}" />
		<h:outputText value="#{cameraManualController.camera.fineTiltMirror.rawStateXDisplayString}" />
		
		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','TiltPlateX')}" />						
		<h:outputLabel value="Fine Pupil Adj (y) (#{fieldMetaData.units})" />
		<h:outputText value="#{cameraManualController.camera.fineTiltMirror.currentPosition.y}" />
		<h:outputText value="#{cameraManualController.camera.fineTiltMirror.rawStateYDisplayString}" />
		
		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','SteeringMirrorX')}" />				
		<h:outputLabel value="Coarse Pupil Adj (x) (#{fieldMetaData.units})" />
		<h:outputText value="#{cameraManualController.camera.coarseTiltMirror.currentPosition.x}" />
		<h:outputText value="#{cameraManualController.camera.coarseTiltMirror.rawStateXDisplayString}" />
		
		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','SteeringMirrorX')}" />				
		<h:outputLabel value="Coarse Pupil Adj (y) (#{fieldMetaData.units})" />
		<h:outputText value="#{cameraManualController.camera.coarseTiltMirror.currentPosition.y}" />
		<h:outputText value="#{cameraManualController.camera.coarseTiltMirror.rawStateYDisplayString}" />

		<h:outputLabel value="Two Position Mech" />
		<h:outputText value="#{cameraManualController.camera.twoPosMechanism.displayString}" style="position:relative; top:0px" />
		<h:outputText value="#{cameraManualController.camera.twoPosMechanism.rawStateDisplayString}" style="position:relative; top:0px" />

		<h:outputLabel value="CCD Power" />
		<h:outputText value="#{cameraManualController.ccd.displayString}" style="position:relative; top:0px" />
		<h:outputText />

		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','CcdTemp')}" />				
		<h:outputLabel value="CCD Temp (#{fieldMetaData.units})" />
		<h:outputText value="#{cameraManualController.ccd.temperature}" style="position:relative; top:0px" >
			<f:converter converterId="DynamicNumberConverter" />
			<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
		</h:outputText>
		<h:outputText />
		
		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BenchTemp')}" />				
		<h:outputLabel value="Instrument Temp (#{fieldMetaData.units})" />
		<h:outputText value="#{cameraManualController.camera.instrumentTemperature}" style="position:relative; top:0px" >
			<f:converter converterId="DynamicNumberConverter" />
			<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
		</h:outputText>
		<h:outputText />

		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BoxTemp')}" />				
		<h:outputLabel value="Electronics Box Temp (#{fieldMetaData.units})" />
		<h:outputText value="#{cameraManualController.camera.electronicsBoxTemperature}" style="position:relative; top:0px" >
			<f:converter converterId="DynamicNumberConverter" />
			<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
		</h:outputText>
		<h:outputText />

		<h:outputLabel value="Instrument Humidity" />
		<h:outputText value="#{cameraManualController.camera.instrumentHumidity}%" style="position:relative; top:0px" />
		<h:outputText />
		
		<h:outputLabel value="Electronics Box Humidity" />
		<h:outputText value="#{cameraManualController.camera.electronicsBoxHumidity}%" style="position:relative; top:0px" />
		<h:outputText />
		
		<h:outputLabel value="Temperature Interlock" />
		<h:outputText value="#{cameraManualController.camera.temperatureInterlock}" style="position:relative; top:0px" />
		<h:outputText />
		
		<h:outputLabel value="Purge State" />
		<h:outputText value="#{cameraManualController.camera.purgeState}" style="position:relative; top:0px" />
		<h:outputText />
		
		<h:outputLabel value="Glycol Flow" />
		<h:outputText value="#{cameraManualController.camera.glycolFlow}" style="position:relative; top:0px" />
		<h:outputText />
		

		<f:facet name="footer">
			<p:commandButton value="Refresh" icon="ui-icon-refresh" ajax="true" update="cameraStatusPanel :growl :errorGrowl" />
		</f:facet>

	</p:panelGrid>


</ui:composition>
