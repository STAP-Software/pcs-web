<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:outputPanel id="cameraStatusPanel" style="padding: 16px;">
	
    	<div class="label-input-grid" 
         	style="display: grid; grid-template-columns: max-content max-content;
                align-items: baseline; 
                row-gap: 24px; column-gap: 24px;">

			<h:outputLabel value="Overall Status" />
			<h:outputText value="#{cameraManualController.camera.overallStatusDisplayString}" style="position:relative; top:2px" />
	
			<h:outputLabel value="Pupil Mask" />
			<h:outputText value="#{cameraManualController.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
	
			<h:outputLabel value="Filter" />
			<h:outputText value="#{cameraManualController.camera.filterWheel.stateDisplayString}" style="position:relative; top:2px" />
	
			<h:outputLabel value="Ref. Beam" />
			<h:outputText value="#{cameraManualController.camera.currentRefBeamDisplayString}" style="position:relative; top:2px" />
	
	
			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','TiltPlateX')}" />						
			<h:outputLabel value="Fine Pupil Adj (x, y) (#{fieldMetaData.units})" />
			<h:panelGroup style="position:relative; top:3px">
				<h:outputText value="#{cameraManualController.camera.fineTiltMirror.stateXDisplayString}" />
				<h:outputText value=", " />
				<h:outputText value="#{cameraManualController.camera.fineTiltMirror.stateYDisplayString}" />
			</h:panelGroup>
	
			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','SteeringMirrorX')}" />				
			<h:outputLabel value="Coarse Pupil Adj (x, y) (#{fieldMetaData.units})" />
			<h:panelGroup style="position:relative; top:3px">
				<h:outputText value="#{cameraManualController.camera.coarseTiltMirror.stateXDisplayString}" />
				<h:outputText value=", " />
				<h:outputText value="#{cameraManualController.camera.coarseTiltMirror.stateYDisplayString}" />
			</h:panelGroup>
	
			<h:outputLabel value="Two Position Mech" />
			<h:outputText value="#{cameraManualController.camera.twoPosMechanism.displayString}" style="position:relative; top:2px" />
	
			<h:outputLabel value="CCD Power" />
			<h:outputText value="#{cameraManualController.ccd.displayString}" style="position:relative; top:2px" />
			
			<h:outputLabel value="CCD Gain" />
			<h:outputText value="#{cameraManualController.ccd.ccdGain.gainDisplay}" style="position:relative; top:2px" />
	
			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','CcdTemp')}" />				
			<h:outputLabel value="CCD Temp (L,R) (#{fieldMetaData.units})" />
			<h:panelGroup style="position:relative; top:3px">
				<h:outputText value="#{cameraManualController.ccd.leftTemperature}" style="position:relative; top:2px" >
					<f:converter converterId="DynamicNumberConverter" />
					<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
				</h:outputText>
				<h:outputText value=", "  style="position:relative; top:2px" />
				<h:outputText value="#{cameraManualController.ccd.rightTemperature}" style="position:relative; top:2px" >
					<f:converter converterId="DynamicNumberConverter" />
					<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
			</h:outputText>
			</h:panelGroup>
			
	
			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BenchTemp')}" />				
			<h:outputLabel value="Instrument Temp (#{fieldMetaData.units})" />
			<h:outputText value="#{cameraManualController.camera.instrumentTemperature}" style="position:relative; top:2px" >
				<f:converter converterId="DynamicNumberConverter" />
				<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
			</h:outputText>
	
			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BoxTemp')}" />				
			<h:outputLabel value="Electronics Box Temp (#{fieldMetaData.units})" />
			<h:outputText value="#{cameraManualController.camera.electronicsBoxTemperature}" style="position:relative; top:2px" >
				<f:converter converterId="DynamicNumberConverter" />
				<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
			</h:outputText>
		</div>

		<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">
			<p:commandButton value="Refresh" icon="pi pi-refresh" ajax="true" update="cameraStatusPanel :growl :errorGrowl" />
		</div>
		

	</p:outputPanel>



</ui:composition>
