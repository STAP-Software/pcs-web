<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">


	<p:panelGrid id="cameraStatusPanel" columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

		<h:outputLabel value="Pupil Mask" />
		<h:outputText value="#{physicalModel.instrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />

		<h:outputLabel value="Filter" />
		<h:outputText value="#{physicalModel.instrument.camera.filterWheel.stateDisplayString}" style="position:relative; top:2px" />

		<h:outputLabel value="Ref. Beam" />
		<h:outputText value="#{physicalModel.instrument.camera.currentRefBeamDisplayString}" style="position:relative; top:2px" />

		<h:outputLabel value="Shutter" />
		<h:outputText value="#{physicalModel.instrument.camera.shutter.shutterDisplayString}" style="position:relative; top:2px" />

		<h:outputLabel value="Fine Tilt (x, y &#181;m)" />
		<h:panelGroup style="position:relative; top:3px">
			<h:outputText value="#{physicalModel.instrument.camera.fineTiltMirror.stateXDisplayString}" />
			<h:outputText value=", " />
			<h:outputText value="#{physicalModel.instrument.camera.fineTiltMirror.stateYDisplayString}" />
		</h:panelGroup>

		<h:outputLabel value="Coarse Tilt (x, y &#181;m)" />
		<h:panelGroup style="position:relative; top:3px">
			<h:outputText value="#{physicalModel.instrument.camera.coarseTiltMirror.stateXDisplayString}" />
			<h:outputText value=", " />
			<h:outputText value="#{physicalModel.instrument.camera.coarseTiltMirror.stateYDisplayString}" />
		</h:panelGroup>

		<h:outputLabel value="Two Position Mech" />
		<h:outputText value="#{physicalModel.instrument.camera.twoPosMechanism.displayString}" style="position:relative; top:2px" />

		<h:outputLabel value="CCD Power" />
		<h:outputText value="#{physicalModel.instrument.ccd.displayString}" style="position:relative; top:2px" />

		<h:outputLabel value="CCD Temp" />
		<h:outputText value="#{physicalModel.instrument.ccd.temperature}" style="position:relative; top:2px" />

		<h:outputLabel value="Instrument Temp" />
		<h:outputText value="#{physicalModel.instrument.camera.instrumentTemperature}" style="position:relative; top:2px" />

		<h:outputLabel value="Electronics Box Temp" />
		<h:outputText value="#{physicalModel.instrument.camera.electronicsBoxTemperature}" style="position:relative; top:2px" />


		<f:facet name="footer">
			<p:commandButton value="Refresh" icon="ui-icon-refresh" ajax="true" update="cameraStatusPanel :growl" />
		</f:facet>

	</p:panelGrid>



</ui:composition>
