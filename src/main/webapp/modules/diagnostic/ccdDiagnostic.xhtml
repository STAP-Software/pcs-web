<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

   <ui:define name="content">
      
      
      	 
 		
       	<h:form id="setupForm">
       		       		
       		<p:panelGrid columns="2" style="margin:30px;" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
       		
       			<f:facet name="header">
					CCD Diagnostic Tools
				</f:facet>
 
        		<h:outputLabel style="height: 8px" />
       			<h:outputLabel />
      
   				<h:outputLabel value="CCD Command Choices" />
   				<h:panelGroup id="commandPanel">
    			<p:selectOneMenu id="options" value="#{ccdDiagnosticController.ccdCommand}" style="top:2px">  
            		<f:selectItem itemLabel="Open CCD Channel" itemValue="1" />  
            		<f:selectItem itemLabel="Close CCD Channel" itemValue="2" />  
            		<f:selectItem itemLabel="Clear CCD" itemValue="3" />  
            		<f:selectItem itemLabel="Wipe CCD" itemValue="4" />  
            		<f:selectItem itemLabel="Fastwipe CCD" itemValue="5" />  
            		<f:selectItem itemLabel="Send Utility Word to CCD" itemValue="6" />  
            		<f:selectItem itemLabel="Set Continuous Wipe On" itemValue="7" />  
            		<f:selectItem itemLabel="Set Continuous Wipe Off" itemValue="8" />  
            		<f:selectItem itemLabel="Set Residual Image Fix On" itemValue="9" />  
           		    <f:selectItem itemLabel="Set Residual Image Fix Off" itemValue="10" />  
            		<f:selectItem itemLabel="Read CCD Raw" itemValue="11" />  
            		<p:ajax update="commandPanel" />
         		</p:selectOneMenu>  
         		<h:outputText value="&#160;&#160;&#160;&#160;&#160;&#160;" />	
         		<h:outputText value="Utility Word (Decimal) &#160;&#160;" 	rendered="#{ccdDiagnosticController.showUtilityWord}"/>	
        		<p:inputText id="utilityWord" value="#{ccdDiagnosticController.utilityWord}"  size="5" rendered="#{ccdDiagnosticController.showUtilityWord}"/>
       			</h:panelGroup>

       			<h:outputLabel style="height: 10px" />
       			<h:outputLabel style="height: 10px" />
       			
       			<f:facet name="footer">
					<p:commandButton value="Send Command" icon="ui-icon-check" ajax="true" action="#{ccdDiagnosticController.doSendCommand}" update=":growl"/>
					<p:commandButton value="Cancel" icon="ui-icon-close" ajax="false" action="#{ccdDiagnosticController.doCancel}" />
				</f:facet>

        	</p:panelGrid>
    		
       	</h:form>
              
   </ui:define>
</ui:composition>
</html>
