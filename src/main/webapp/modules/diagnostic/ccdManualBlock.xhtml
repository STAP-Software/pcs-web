<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">


	<p:outputPanel style="padding: 16px;">

    	<div class="label-input-grid" 
         	style="display: grid; grid-template-columns: max-content max-content;
                align-items: baseline; 
                row-gap: 24px; column-gap: 24px;">

		<h:outputLabel value="CCD Command" />
		<h:panelGroup id="commandPanel" style="align-self:center">
			<p:selectOneMenu value="#{ccdManualController.commandSelection}" style="position:relative; top:-2px">
				<f:selectItem itemLabel="Take Exposure" itemValue="1" />
				<f:selectItem itemLabel="Take Overscanned Exposure" itemValue="2" />
				<f:selectItem itemLabel="Set Gain" itemValue="3" />
				<f:selectItem itemLabel="Trigger Offset Calibration" itemValue="4" />
				<f:selectItem itemLabel="Set One Channel Offset" itemValue="5" />
				<f:selectItem itemLabel="Set Both Channel Offsets" itemValue="6" />
				<f:selectItem itemLabel="Set CCD Temperature" itemValue="7" />
				
				<p:ajax listener="#{ccdManualController.updateCommandListener}" update="ccdCommandPanel" />
			</p:selectOneMenu>
		</h:panelGroup>

		<h:outputLabel value="" />

		<h:panelGroup id="ccdCommandPanel">
			<h:outputText value="Exposure Time &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 1 or ccdManualController.commandSelection eq 2}" />
			<p:inputText value="#{ccdManualController.exposureTime}" size="5" rendered="#{ccdManualController.commandSelection eq 1 or ccdManualController.commandSelection eq 2}" />			
					
			<h:outputText value="Gain &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 3}" />
			<p:inputText value="#{ccdManualController.gainNumber}" size="5" rendered="#{ccdManualController.commandSelection eq 3}" />			
					
			<h:outputText value="Channel &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 5}" />
			<p:selectOneMenu value="#{ccdManualController.channel}" style="vertical-align:middle"
				rendered="#{ccdManualController.commandSelection eq 5}">
				<f:selectItem itemLabel="0" itemValue="0" />
				<f:selectItem itemLabel="1" itemValue="1" />
			</p:selectOneMenu>

			<h:outputText value="&#160;&#160;&#160;&#160;Offset &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 5}" />
			<p:inputText value="#{ccdManualController.channelOffset}" size="4" rendered="#{ccdManualController.commandSelection eq 5}" />			
			
			<h:outputText value="Offset 0 &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 6}" />
			<p:inputText value="#{ccdManualController.channelOffset1}" size="4" rendered="#{ccdManualController.commandSelection eq 6}" />			
			<h:outputText value="&#160;&#160;&#160;&#160;Offset 1 &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 6}" />
			<p:inputText value="#{ccdManualController.channelOffset2}" size="4" rendered="#{ccdManualController.commandSelection eq 6}" />			

			<h:outputText value="Offset 0: &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 4 and ccdManualController.cmdExecuted}" />
			<h:outputText value="#{ccdManualController.offsetCalibration[0]}" size="5" rendered="#{ccdManualController.commandSelection eq 4 and ccdManualController.cmdExecuted}" />			
			<h:outputText value="&#160;&#160;&#160;&#160;Offset 1: &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 4 and ccdManualController.cmdExecuted}" />
			<h:outputText value="#{ccdManualController.offsetCalibration[1]}" size="5" rendered="#{ccdManualController.commandSelection eq 4 and ccdManualController.cmdExecuted}" />			

			<h:outputText value="Temperature &#160;&#160;" rendered="#{ccdManualController.commandSelection eq 7}" />
			<p:inputText value="#{ccdManualController.desiredTemp}" size="5" rendered="#{ccdManualController.commandSelection eq 7}" />			
		</h:panelGroup>

		</div>

		<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">
			<p:commandButton value="Send Command" icon="pi pi-check" ajax="true" action="#{ccdManualController.doSendCommand}"
				update=":growl :errorGrowl ccdStatusPanel ccdCommandPanel :frameHiddenForm" />
		</div>

	</p:outputPanel>


</ui:composition>
