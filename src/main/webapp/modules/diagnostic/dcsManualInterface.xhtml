<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

   <ui:define name="content">
  		
       	<h:form id="dcsManualForm">
       		
  
       		<p:panelGrid columns="3" style="margin:10px;" styleClass="pcsExecutionPanel">
         		<p:panelGrid columns="2" style="margin:10px;" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormLabelColumn, btmsFormInputColumn">
       		
       			<f:facet name="header">
					DCS Command Tool
				</f:facet>
 
        		<h:outputLabel style="height: 8px" />
       			<h:outputLabel />
      

 				
   				<h:outputLabel value="Command Secondary Mirror Actuator Deltas" />
 				<h:outputLabel />

   				<h:outputLabel value="" />
 				<h:panelGroup>
 				<h:outputLabel value="Actuator 1 (mm): "/>
          		<p:inputText size="4" />  
          		</h:panelGroup>
         		
   				<h:outputLabel value="" />
 				<h:panelGroup>
 				<h:outputLabel value="Actuator 2 (mm): "/>
          		<p:inputText size="4" />  
          		</h:panelGroup>
         		
   				<h:outputLabel value="" />
 				<h:panelGroup>
 				<h:outputLabel value="Actuator 3 (mm): "/>
          		<p:inputText size="4" />  
          		</h:panelGroup>
         		

 				<h:outputLabel value="Command Telescope" />
 				<h:panelGroup>
          		<h:outputLabel /> 
          		</h:panelGroup>
				
    			<h:outputLabel value="" />
 				<h:panelGroup>
  				<p:spacer width="5px"/>
 				<h:outputLabel value="Delta Asimuth (&#181;rad): "/>
          		<p:inputText size="4" />  
          		</h:panelGroup>
       			
    			<h:outputLabel value="" />
 				<h:panelGroup>
 				<h:outputLabel value="Delta Elevation (&#181;rad): "/>
          		<p:inputText size="4" />  
          		</h:panelGroup>
       			
       			
       			<h:outputLabel style="height: 10px" />
       			<h:outputLabel style="height: 10px" />
       			
       			<f:facet name="footer">
					<p:commandButton value="Send Commands" icon="ui-icon-check" ajax="true" action="#{ccdManualController.doSendCommand}" update=":growl"/>
				</f:facet>

        	</p:panelGrid>
   
       		<p:panelGrid columns="2" style="margin:10px;" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormLabelColumn, btmsFormInputColumn">
       		
       			<f:facet name="header">
					DCS Status
				</f:facet>
 
        		<h:outputLabel style="height: 8px" />
       			<h:outputLabel />
       
   				<h:outputLabel value="DCS Status" />
          		<h:outputText value="Status Unknown" />	

 				<h:outputLabel value="Tertiary Mirror" />
          		<h:outputText value="?????" />	
 
   				<h:outputLabel value="Secondary Mirror" />
          		<h:outputText value="" />	

				<h:outputLabel value="" />
				<h:panelGroup>
				<h:outputText value="Actuator #1: " />
				<p:spacer width="5px"/>				
          		<h:outputText value="0.000000 nm" />	
 				</h:panelGroup>
 				
   				<h:outputLabel value="" />
 				<h:panelGroup>
          		<h:outputText value="Actuator #2: " />	
  				<p:spacer width="5px"/>				
         		<h:outputText value="0.000000 nm" />	
          		</h:panelGroup>

   				<h:outputLabel value="" />
 				<h:panelGroup>
          		<h:outputText value="Actuator #3: " />	
				<p:spacer width="5px"/>				
         		<h:outputText value="0.000000 nm" />	
          		</h:panelGroup>

   				<h:outputLabel value="Instrument Rotator" />
          		<h:outputText value="0.0 deg" />	

 				<h:outputLabel value="Telescope" />
          		<h:outputText value="" />	
 				
 				<h:outputLabel value="" />
 				<h:panelGroup>
          		<h:outputText value="Azimuth: " />	
 				<p:spacer width="12px"/>				
         		<h:outputText value="0.000000 nm" />	
          		</h:panelGroup>
 				
  				<h:outputLabel value="" />
 				<h:panelGroup>
          		<h:outputText value="Elevation: " />	
 				<p:spacer width="5px"/>				
         		<h:outputText value="0.000000 nm" />	
          		</h:panelGroup>
 				          		
 
       			<h:outputLabel style="height: 10px" />
       			<h:outputLabel style="height: 10px" />
        			
       			<f:facet name="footer">
					<p:commandButton value="Query All Status" icon="ui-icon-check" ajax="true" action="#{ccdManualController.doSendCommand}" update=":growl"/>
				</f:facet>

        	</p:panelGrid>
         	
				<p:panelGrid columns="1" style="margin-top:5px;" styleClass="pcsFormNoBorder">
				<p:panelGrid columns="3" style="margin:0px;width:100%" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormInputColumn">
					<f:facet name="header">
						ACS Query Tool
					</f:facet>
					
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					
					<h:outputLabel value="DCS Status" style="position:relative; top:5px; font-weight:bold" />
					<h:outputText value="#{dcsManualController.dcsStatus}" style="position:relative; top:8px"/>
					<p:commandButton value="Query" icon="ui-icon-refresh"
							ajax="false" action="#{dcsManualController.doQueryDcsStatus}" 
							update=":growl" />		
										
					<h:outputLabel value="Telescope Position (rads)" style="position:relative; top:5px; font-weight:bold" />
					<h:panelGroup>
					<h:outputText value="Az: " style="position:relative; top:8px; font-weight:bold"/>
					<h:outputText value="#{dcsManualController.telescopePosition[0]},  " style="position:relative; top:8px"/>
					<h:outputText value="El: " style="position:relative; top:8px; font-weight:bold"/>
					<h:outputText value="#{dcsManualController.telescopePosition[1]}" style="position:relative; top:8px"/>
					</h:panelGroup>
					<p:commandButton value="Query" icon="ui-icon-refresh"
							ajax="false" action="#{dcsManualController.doQueryTelescopePosition}"
							update=":growl" />		
						
						
					<h:outputLabel value="Star" style="position:relative; top:5px; font-weight:bold" />
					<h:panelGroup>
					<h:outputText value="Name:" style="position:relative; top:8px; font-weight:bold"/>
					<h:outputText value=" #{dcsManualController.star.starName},  " style="position:relative; top:8px"/>
					
					<h:outputText value="Mag: " style="position:relative; top:8px; font-weight:bold"/>
					<h:outputText value="#{dcsManualController.star.starMag},  " style="position:relative; top:8px"/>
					
					<h:outputText value="Color: " style="position:relative; top:8px; font-weight:bold"/>
					<h:outputText value="#{dcsManualController.star.starColor}" style="position:relative; top:8px"/>
					</h:panelGroup>
					<p:commandButton value="Query" icon="ui-icon-refresh"
							ajax="false" action="#{dcsManualController.doQueryStar}"
							update=":growl" />		
						
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
						
					<f:facet name="footer">
						<p:commandButton value="Query All" icon="ui-icon-refresh"
							ajax="false" action="#{dcsManualController.doQueryAll}"
							update=":growl" />
					
					</f:facet>
				</p:panelGrid>
				
				<p:panelGrid columns="2" style="margin-top:30px;width:100%" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					<f:facet name="header">
						ACS Snapshot Tool
					</f:facet>
					
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
					
					<h:outputLabel value="Snapshot number" />
					<p:inputText size="6" value="#{acsManualController.snapshotNumber}" />
						
					<h:outputLabel style="height: 10px" />
					<h:outputLabel style="height: 10px" />
						
					<f:facet name="footer">
						<p:commandButton value="Load Snapshot" icon="ui-icon-transferthick-e-w"
							ajax="false" action="#{acsManualController.doLoadSnapshot}"
							update=":growl" />
					
						<p:commandButton value="Take Snapshot" icon="ui-icon-check"
							ajax="false" action="#{acsManualController.doTakeSnapshot}"
							update=":growl" />
					</f:facet>
				</p:panelGrid>


			</p:panelGrid>
        	</p:panelGrid>
    		
       	</h:form>
              
   </ui:define>
</ui:composition>
</html>
