<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

   <ui:define name="content">
  		
       	<h:form id="dcsManualForm">
       		
  
            <div style="display:flex; flex-direction:row; align-items:flex-start; gap:24px; margin:30px;">

                <!-- Left column: Actuator Delta Command Tool -->
                <div style="display:inline-flex; flex-direction:column; gap:0; width:fit-content; border:1px solid #d0d0d0;">
                
                    <div style="background:#e8e8e8; border-bottom:1px solid #d0d0d0;
                               padding:6px 12px; font-weight:bold; font-size:18px; font-family:Arial, sans-serif;">
                        DCS Command Tool
                    </div>
     
				<div style="padding:16px; display:flex; flex-direction:column; gap:24px;">
				
				    <p:fieldset legend="Secondary Mirror Actuator Deltas">
				    
				        <div style="display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:24px;">
				
				            <div style="display:grid; 
				                        grid-template-columns: max-content max-content;
				                        align-items: center;
				                        row-gap: 24px; 
				                        column-gap: 24px;">
				
				                <h:outputText value="Actuator #1 (mm): " style="font-weight:bold" />
				                <p:inputText value="#{dcsManualController.secondaryDeltaCmds[0]}" size="4" />
				
				                <h:outputText value="Actuator #2 (mm): " style="font-weight:bold" />
				                <p:inputText value="#{dcsManualController.secondaryDeltaCmds[1]}" size="4" />
				
				                <h:outputText value="Actuator #3 (mm): " style="font-weight:bold" />
				                <p:inputText value="#{dcsManualController.secondaryDeltaCmds[2]}" size="4" />
				
				            </div>
				
				            <p:commandButton value="Send Commands" icon="pi pi-send"
				                ajax="false" action="#{dcsManualController.doCommandSecondary}"
				                update=":growl :errorGrowl" />
				
				        </div>
				    </p:fieldset>
				
				    <p:fieldset legend="Telescope">
				        <div style="display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:24px;">
				
				            <div style="display:grid; 
				                        grid-template-columns: max-content max-content;
				                        align-items: center;
				                        row-gap: 24px; 
				                        column-gap: 24px;">
				
				                <h:outputText value="Delta Azimuth (arcsec): " style="font-weight:bold" />
				                <p:inputText value="#{dcsManualController.telescopeDeltaCmds[0]}" size="4" />
				
				                <h:outputText value="Delta Elevation (arcsec): " style="font-weight:bold" />
				                <p:inputText value="#{dcsManualController.telescopeDeltaCmds[1]}" size="4" />
				
				            </div>
				
				            <p:commandButton value="Send Commands" icon="pi pi-send"
				                ajax="false" action="#{dcsManualController.doCommandTelescopeDelta}"
				                update=":growl :errorGrowl" />
				
				        </div>
				    </p:fieldset>
				
				</div>
        	</div>
   
            <div style="display:inline-flex; flex-direction:column; gap:0; width:fit-content; border:1px solid #d0d0d0;">
             
                 <div style="background:#e8e8e8; border-bottom:1px solid #d0d0d0;
                            padding:6px 12px; font-weight:bold; font-size:18px; font-family:Arial, sans-serif;">
                     DCS Status
                 </div>
                 
                 
                 
  
 				<div style="padding:16px; display:flex; flex-direction:column; gap:24px;">
				
				    <p:fieldset legend="DCS Status">
				    
				        <div style="display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:24px;">
				
				            <div style="display:grid; 
				                        grid-template-columns: max-content max-content;
				                        align-items: center;
				                        row-gap: 24px; 
				                        column-gap: 24px;">
				                        
				                <h:outputLabel value="Status:" style="font-weight:bold" />
          						<h:outputText value="#{dcsManualController.dcsStatusDisplayString}" />
          					</div>
          					<p:commandButton value="Query" icon="pi pi-refresh" 
								ajax="false" action="#{dcsManualController.doQueryDcsStatus}" 
								update=":growl :errorGrowl" />	
						</div>
          			</p:fieldset>	
       			
 
 
 					<p:fieldset legend="Secondary Mirror">
				        <div style="display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:24px;">
				
				            <div style="display:grid; 
				                        grid-template-columns: max-content max-content;
				                        align-items: center;
				                        row-gap: 24px; 
				                        column-gap: 24px;">
 

								<h:outputLabel value="Actuator #1 (mm):" style="font-weight:bold" />
				          		<h:outputText value="#{dcsManualController.m2Pos[0]}">
				          			<f:convertNumber pattern="#0.000" />
				          		</h:outputText>	
				
				          		<h:outputLabel value="Actuator #2 (mm): " style="font-weight:bold" />	
				         		<h:outputText value="#{dcsManualController.m2Pos[1]}" >
				          			<f:convertNumber pattern="#0.000" />
				          		</h:outputText>		
				
				          		<h:outputLabel value="Actuator #3 (mm): " style="font-weight:bold" />	
				         		<h:outputText value="#{dcsManualController.m2Pos[2]}" >
				          			<f:convertNumber pattern="#0.000" />
				          		</h:outputText>		
				          	</div>
							<p:commandButton value="Query" icon="pi pi-refresh" 
								ajax="false" action="#{dcsManualController.doQuerySecondary}" 
								update=":growl :errorGrowl" />	
						</div>
					</p:fieldset>
      			
			
				
				
	 				<p:fieldset legend="Telescope">
				        <div style="display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:24px;">
				
				            <div style="display:grid; 
				                        grid-template-columns: max-content max-content;
				                        align-items: center;
				                        row-gap: 24px; 
				                        column-gap: 24px;">
	
				 				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CcdFrame','TelescopeAzEl')}" />
				          		<h:outputLabel value="Azimuth (#{fieldMetaData.units}): " style="font-weight:bold" />	
				         		<h:outputText value="#{dcsManualController.telescopePosition[0]}" >
				          			<f:converter converterId="DynamicNumberConverter" />
									<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
				          		</h:outputText>			
				
				 				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CcdFrame','TelescopeAzEl')}" />
				          		<h:outputLabel value="Elevation (#{fieldMetaData.units}): " style="font-weight:bold" />	
							
				         		<h:outputText value="#{dcsManualController.telescopePosition[1]}" >
				          			<f:converter converterId="DynamicNumberConverter" />
									<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
				          		</h:outputText>		
	 						</div>
	 						<p:commandButton value="Query" icon="pi pi-refresh" 
								ajax="false" action="#{dcsManualController.doQueryTelescopePosition}"
								update=":growl :errorGrowl" />
								
						</div>
	 				</p:fieldset>
	 				
 								          		
				
				
				
				
	 				<p:fieldset legend="M2 Focus and Tilt">
	 					<div style="display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:24px;">
				
				            <div style="display:grid; 
				                        grid-template-columns: max-content max-content;
				                        align-items: center;
				                        row-gap: 24px; 
				                        column-gap: 24px;">
	 				

				          		<h:outputLabel value="Telescope Focus (mm): " style="font-weight:bold" />	
				 							
				         		<h:outputText value="#{dcsManualController.telescopeFocusAndTilt[0]}" >
				          			<f:convertNumber pattern="#0.00" />
				          		</h:outputText>		
				          	
				 			
				          		<h:outputLabel value="M2 Tilt-X (arcsec): " style="font-weight:bold" />	
						
				         		<h:outputText value="#{dcsManualController.telescopeFocusAndTilt[1]}" >
				          			<f:convertNumber pattern="#0.00" />
				          		</h:outputText>		
				          	
				 				
				          		<h:outputLabel value="M2 Tilt-Y (arcsec): " style="font-weight:bold" />	
				 								
				         		<h:outputText value="#{dcsManualController.telescopeFocusAndTilt[2]}" >
				          			<f:convertNumber pattern="#0.00" />
				          		</h:outputText>		

	 						</div>
	 				
	          				<p:commandButton value="Query" icon="pi pi-refresh" 
								ajax="false" action="#{dcsManualController.doQueryM2FocusAndTilt}"
								update=":growl :errorGrowl" />
						</div>
	 				</p:fieldset>
	 				
 								          		
				
				
				
				
					<p:fieldset legend="Star">
	 					<div style="display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:24px;">
				
				            <div style="display:grid; 
				                        grid-template-columns: max-content max-content;
				                        align-items: center;
				                        row-gap: 24px; 
				                        column-gap: 24px;">

				          		<h:outputLabel value="Name: " style="font-weight:bold" />	
				         		<h:outputText value="#{dcsManualController.starInfo.starName}" />	
			
				          		<h:outputLabel value="Mag: " style="font-weight:bold" />	
				         		<h:outputText value="#{dcsManualController.starInfo.starMag}" >
				         			<f:convertNumber pattern="#0.00" />
				         		</h:outputText>	
			
				          		<h:outputLabel value="Color: " style="font-weight:bold" />	
				         		<h:outputText value="#{dcsManualController.starInfo.starColor}" />	
				         	</div>
							<p:commandButton value="Query" icon="pi pi-refresh" 
								ajax="false" action="#{dcsManualController.doQueryStar}"
								update=":growl :errorGrowl" />
						</div>
	 				</p:fieldset>
	 				
 								          		 				          		
        			
       				<div style="display:flex; justify-content:flex-end;">
       					<p:commandButton value="Query All" icon="pi pi-sync"
							ajax="false" action="#{dcsManualController.doQueryAll}"
							update=":growl :errorGrowl" />

					</div>
        		</div>
         	
       		</div>
       	</div>
       
    		
       	</h:form>
              
   </ui:define>
</ui:composition>
</html>
