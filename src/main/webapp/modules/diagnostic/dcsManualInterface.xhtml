<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

   <ui:define name="content">
  		
       	<h:form id="dcsManualForm">
       		
  
       		<p:panelGrid columns="3" style="margin:10px;" styleClass="pcsExecutionPanel">
  
         		<p:panelGrid columns="2" style="margin:10px;" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormOutputColumn">
       		
       			<f:facet name="header">
					DCS Command Tool
				</f:facet>
 
        		<h:outputLabel style="height: 2px" />
        		<h:outputLabel style="height: 2px" />
      
 				<p:fieldset legend="Secondary Mirror Actuator Deltas">
 
    			<p:panelGrid columns="1" style="margin:2px 10px 2px 10px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormInputColumn">
				<h:panelGroup>
				<h:outputText value="Actuator #1 (mm): " />
				<p:spacer width="5px"/>								
          		<p:inputText value="#{dcsManualController.secondaryDeltaCmds[0]}" size="4" />	
 				</h:panelGroup>
 				
 				<h:panelGroup>
          		<h:outputText value="Actuator #2 (mm): " />	
  				<p:spacer width="5px"/>				
         		<p:inputText value="#{dcsManualController.secondaryDeltaCmds[1]}" size="4" />	
          		</h:panelGroup>

 				<h:panelGroup>
          		<h:outputText value="Actuator #3 (mm): " />	
				<p:spacer width="5px"/>				
         		<p:inputText value="#{dcsManualController.secondaryDeltaCmds[2]}" size="4" />	
          		</h:panelGroup>
				</p:panelGrid>
				</p:fieldset>
      			<p:commandButton value="Send Commands" icon="ui-icon-check" 
							ajax="false" action="#{dcsManualController.doCommandSecondary}" 
							update=":growl" />	
				
				
 				<p:fieldset legend="Telescope">
    			<p:panelGrid columns="1" style="margin:2px 10px 2px 10px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormInputColumn">
 				
 				<h:panelGroup>
          		<h:outputText value="Delta Asimuth (&#181;rad): " />	
 				<p:spacer width="12px"/>				
         		<p:inputText value="#{dcsManualController.telescopeDeltaCmds[0]}" size="4" />	
          		</h:panelGroup>
 				
 				<h:panelGroup>
          		<h:outputText value="Delta Elevation (&#181;rad): " />	
 				<p:spacer width="5px"/>				
         		<p:inputText value="#{dcsManualController.telescopeDeltaCmds[1]}" size="4" />	
          		</h:panelGroup>
       			</p:panelGrid>
 				</p:fieldset>
 				<p:commandButton value="Send Commands" icon="ui-icon-check" 
							ajax="false" action="#{dcsManualController.doCommandTelescopeDelta}"
							update=":growl" />
 								          		
       			
         		<h:outputLabel style="height: 2px" />
        		<h:outputLabel style="height: 2px" />
       			
        	</p:panelGrid>
   
       		<p:panelGrid columns="2" style="margin:10px;" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormLabelColumn, btmsFormInputColumn">
       		
       			<f:facet name="header">
					DCS Status
				</f:facet>
 
        		<h:outputLabel style="height: 2px" />
        		<h:outputLabel style="height: 2px" />
        
        		<p:fieldset legend="DCS Status">
   				
   				<p:panelGrid columns="1" style="margin:2px 10px 2px 10px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormInputColumn">
          		<h:outputText value="#{dcsManualController.dcsStatusDisplayString}" />
          		</p:panelGrid>
          		</p:fieldset>	
       			<p:commandButton value="Query" icon="ui-icon-refresh" 
							ajax="false" action="#{dcsManualController.doQueryDcsStatus}" 
							update=":growl" />	
 
 
 				<p:fieldset legend="Secondary Mirror">
 
    			<p:panelGrid columns="1" style="margin:2px 10px 2px 10px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormInputColumn">
				<h:panelGroup>
				<h:outputText value="Actuator #1: " />
				<p:spacer width="5px"/>				
          		<h:outputText value="#{dcsManualController.m2Pos[0]} nm" />	
 				</h:panelGroup>
 				
 				<h:panelGroup>
          		<h:outputText value="Actuator #2: " />	
  				<p:spacer width="5px"/>				
         		<h:outputText value="#{dcsManualController.m2Pos[1]} nm" />	
          		</h:panelGroup>

 				<h:panelGroup>
          		<h:outputText value="Actuator #3: " />	
				<p:spacer width="5px"/>				
         		<h:outputText value="#{dcsManualController.m2Pos[2]} nm" />	
          		</h:panelGroup>
				</p:panelGrid>
				</p:fieldset>
      			<p:commandButton value="Query" icon="ui-icon-refresh" 
							ajax="false" action="#{dcsManualController.doQuerySecondary}" 
							update=":growl" />	
				
				
 				<p:fieldset legend="Telescope">
    			<p:panelGrid columns="1" style="margin:2px 10px 2px 10px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormInputColumn">
 				
 				<h:panelGroup>
          		<h:outputText value="Azimuth (rads): " />	
 				<p:spacer width="12px"/>				
         		<h:outputText value="#{dcsManualController.telescopePosition[0]}" />	
          		</h:panelGroup>
 				
 				<h:panelGroup>
          		<h:outputText value="Elevation (rads): " />	
 				<p:spacer width="5px"/>				
         		<h:outputText value="#{dcsManualController.telescopePosition[1]}" />	
          		</h:panelGroup>
       			</p:panelGrid>
 				</p:fieldset>
 				<p:commandButton value="Query" icon="ui-icon-refresh" 
							ajax="false" action="#{dcsManualController.doQueryTelescopePosition}"
							update=":growl" />
 								          		
				<p:fieldset legend="Star">
   				<p:panelGrid columns="1" style="margin:2px 10px 2px 10px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormInputColumn">
 				
 				<h:panelGroup>
          		<h:outputText value="Name: " />	
 				<p:spacer width="12px"/>				
         		<h:outputText value="#{dcsManualController.starInfo.starName}" />	
          		</h:panelGroup>
 				
 				<h:panelGroup>
          		<h:outputText value="Mag: " />	
 				<p:spacer width="5px"/>				
         		<h:outputText value="#{dcsManualController.starInfo.starMag}" />	
          		</h:panelGroup>
 				          		 				          		
 				<h:panelGroup>
          		<h:outputText value="Color: " />	
 				<p:spacer width="5px"/>				
         		<h:outputText value="#{dcsManualController.starInfo.starColor}" />	
          		</h:panelGroup>
       			</p:panelGrid>
 				</p:fieldset>
 				<p:commandButton value="Query" icon="ui-icon-refresh" 
							ajax="false" action="#{dcsManualController.doQueryStar}"
							update=":growl" />
 								          		 				          		
 							
        		<h:outputLabel style="height: 2px" />
        		<h:outputLabel style="height: 2px" />
 
        			
       			<f:facet name="footer">
       				<p:commandButton value="Query All" icon="ui-icon-refresh"
							ajax="false" action="#{dcsManualController.doQueryAll}"
							update=":growl" />
				</f:facet>

        	</p:panelGrid>
         	
        	</p:panelGrid>
    		
       	</h:form>
              
   </ui:define>
</ui:composition>
</html>
