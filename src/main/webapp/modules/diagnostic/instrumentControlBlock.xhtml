<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">


	<p:panelGrid columns="2" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

		<h:outputLabel value="CCD Command" />
		<p:selectOneMenu value="#{ccdManualController.advCommandSelection}" style="top:2px">
			<f:selectItem itemLabel="Set Gain" itemValue="1" />
			<f:selectItem itemLabel="Set Offset" itemValue="2" />
			<f:selectItem itemLabel="Set Binning" itemValue="3" />
			<f:selectItem itemLabel="Get Image" itemValue="4" />

			<p:ajax update="instrumentCommandPanel" />
		</p:selectOneMenu>
		
		<h:outputLabel value="" />
		<h:panelGroup id="instrumentCommandPanel">
			<h:outputText value="&#160;&#160;&#160;&#160;Channel: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 1}" />
			<p:inputText value="#{ccdManualController.channel}" size="5" rendered="#{ccdManualController.advCommandSelection eq 1}" />
			<h:outputText value="&#160;&#160;&#160;&#160;Gain: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 1}" />
			<p:inputText value="#{ccdManualController.gain}" size="5" rendered="#{ccdManualController.advCommandSelection eq 1}" />

			<h:outputText value="&#160;&#160;&#160;&#160;Channel: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 2}" />
			<p:inputText value="#{ccdManualController.channel}" size="5" rendered="#{ccdManualController.advCommandSelection eq 2}" />
			<h:outputText value="&#160;&#160;&#160;&#160;Offset: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 2}" />
			<p:inputText value="#{ccdManualController.offset}" size="5" rendered="#{ccdManualController.advCommandSelection eq 2}" />

			<h:outputText value="&#160;&#160;&#160;&#160;X: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 3}" />
			<p:inputText value="#{ccdManualController.binning[0]}" size="5" rendered="#{ccdManualController.advCommandSelection eq 3}" />
			<h:outputText value="&#160;&#160;&#160;&#160;Y: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 3}" />
			<p:inputText value="#{ccdManualController.binning[1]}" size="5" rendered="#{ccdManualController.advCommandSelection eq 3}" />

			<h:outputText value="&#160;&#160;&#160;&#160;Exposure Time: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 4}" />
			<p:inputText value="#{ccdManualController.exposureTime}" size="5" rendered="#{ccdManualController.advCommandSelection eq 4}" />
			<h:outputText value="&#160;&#160;&#160;&#160;Use Shutter: &#160;&#160;" rendered="#{ccdManualController.advCommandSelection eq 4}" />
			<p:selectBooleanCheckbox value="#{ccdManualController.useShutter}" rendered="#{ccdManualController.advCommandSelection eq 4}" style="position:relative; top:4px" />

		</h:panelGroup>

		<f:facet name="footer">
			<p:commandButton value="Send Command" icon="ui-icon-check" ajax="true" action="#{ccdManualController.doSendAdvCommand}"
				update=":growl" />
		</f:facet>

	</p:panelGrid>


</ui:composition>
