<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">


	<p:panelGrid columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

		<h:outputLabel value="Plate Scale" />
		<h:outputText value="#{ccdManualController.plateScale}" style="position:relative; top:2px" />

		<h:outputLabel value="Image Size (width, height px)" />
		<h:panelGroup style="position:relative; top:3px">
			<h:outputText value="#{ccdManualController.imageSize[0]}" />
			<h:outputText value=", " />
			<h:outputText value="#{ccdManualController.imageSize[0]}" />
		</h:panelGroup>

		<f:facet name="footer">
			<p:commandButton value="Refresh" icon="ui-icon-refresh" ajax="true" update="advTab :growl :errorGrowl" action="#{ccdManualController.doRefresh}"/>
		</f:facet>

	</p:panelGrid>



</ui:composition>
