<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panelGrid id="voltageStatusPanel" columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

		<h:outputLabel value="Camera 12V Supply" />
		<h:outputText value="#{cameraManualController.camera.camera12Supply}" style="position:relative; top:2px" />

		<h:outputLabel value="Camera 5V Supply" />
		<h:outputText value="#{cameraManualController.camera.camera5Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="Camera -12V Supply" />
		<h:outputText value="#{cameraManualController.camera.cameraN12Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="LED Supply" />
		<h:outputText value="#{cameraManualController.camera.ledDraw}" style="position:relative; top:2px" />
		
		<h:outputLabel value="Ref Beam Supply" />
		<h:outputText value="#{cameraManualController.camera.refBeamSupply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="VICOR 12V Supply" />
		<h:outputText value="#{cameraManualController.camera.vicor12Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="VICOR 5V Supply" />
		<h:outputText value="#{cameraManualController.camera.vicor5Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="StandBy Supply" />
		<h:outputText value="#{cameraManualController.camera.standbySupply}" style="position:relative; top:2px" />
			
		

		<f:facet name="footer">
			<p:commandButton value="Refresh" icon="ui-icon-refresh" ajax="true" update="voltageStatusPanel :growl :errorGrowl" />
		</f:facet>

	</p:panelGrid>

</ui:composition>
