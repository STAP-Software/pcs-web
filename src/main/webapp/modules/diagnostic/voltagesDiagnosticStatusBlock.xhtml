<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panelGrid id="voltageUpdateMethodPanel" columns="4" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormLabelColumn, btmsFormInputColumn">
		<h:outputLabel value="Update using " />
		<p:selectOneMenu value="#{cameraManualController.voltageUpdateMethod}" style="top:2px">
			<f:selectItem itemLabel="Select update method" itemValue="0" />
			<f:selectItem itemLabel="Voltage Change Listener" itemValue="1" />
			<f:selectItem itemLabel="Voltage Periodic Listener" itemValue="2" />
			<f:selectItem itemLabel="Both" itemValue="3" />
			<f:selectItem itemLabel="getVoltages() call" itemValue="4" />
			<p:ajax listener="#{cameraManualController.voltageUpdateMethodChangeListener}" update="voltageUpdateMethodPanel voltageStatusPanel" />
		</p:selectOneMenu>
		<h:outputLabel value="Period (sec): " style="position:relative; top:2px" rendered="#{cameraManualController.voltageUpdateMethod eq 2 or cameraManualController.voltageUpdateMethod eq 3}"/>
		<p:inputText value="#{cameraManualController.voltagePeriod}" size="3" style="position:relative; top:3px" rendered="#{cameraManualController.voltageUpdateMethod eq 2 or cameraManualController.voltageUpdateMethod eq 3}" />
		<p:commandButton value="getVoltage()" action="#{cameraManualController.doGetVoltage}" icon="ui-icon-refresh" ajax="true" update="voltageStatusPanel :growl :errorGrowl" 
			rendered="#{cameraManualController.voltageUpdateMethod eq 4}" style="position: relative; top:-2px;"/>
		
	</p:panelGrid>

	<p:spacer width="400px" height="1px" />

	<p:panelGrid id="voltageStatusPanel" columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

		<h:outputLabel value="Camera 12V Supply" />
		<h:outputText value="#{cameraManualController.camera.camera12Supply}" style="position:relative; top:2px" />

		<h:outputLabel value="Camera 5V Supply" />
		<h:outputText value="#{cameraManualController.camera.camera5Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="Camera -12V Supply" />
		<h:outputText value="#{cameraManualController.camera.cameraN12Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="LED Supply" />
		<h:outputText value="#{cameraManualController.camera.ledDraw}" style="position:relative; top:2px" />
		
		<h:outputLabel value="Ref Beam Supply" />
		<h:outputText value="#{cameraManualController.camera.refBeamSupply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="VICOR 12V Supply" />
		<h:outputText value="#{cameraManualController.camera.vicor12Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="VICOR 5V Supply" />
		<h:outputText value="#{cameraManualController.camera.vicor5Supply}" style="position:relative; top:2px" />
		
		<h:outputLabel value="StandBy Supply" />
		<h:outputText value="#{cameraManualController.camera.standbySupply}" style="position:relative; top:2px" />
			
		<p:spacer width="180px" height="1px" />
		<p:spacer width="180px" height="1px" />
		


	</p:panelGrid>

</ui:composition>
