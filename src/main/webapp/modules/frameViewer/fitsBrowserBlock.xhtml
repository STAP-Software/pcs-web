<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">


	<style type="text/css">
	    .fitsBrowserTabView .ui-tabs-panels {
	        border: 1px solid #d0d0d0;
	        border-top: none;
	    }

	    .fitsBrowserTabView .ui-tabs-nav li {
	        background: #e8e8e8 !important;
	        border: 1px solid #d0d0d0 !important;
	    }

	    .fitsBrowserTabView .ui-tabs-nav li.ui-tabs-active,
	    .fitsBrowserTabView .ui-tabs-nav li.ui-state-active {
	        background: #1a73e8 !important;
	        border-color: #1a73e8 !important;
	    }

	    .fitsBrowserTabView .ui-tabs-nav li.ui-tabs-active a,
	    .fitsBrowserTabView .ui-tabs-nav li.ui-state-active a {
	        color: #ffffff !important;
	    }

		.fitsBrowserTabView .ui-tabs-nav li.ui-tabs-header {
		    padding: 0 !important;
		}

		.fitsBrowserTabView .ui-tabs-nav li.ui-tabs-header a {
		    display: block !important;
		    padding: 1rem !important;
		    cursor: pointer !important;
		}

		.fitsBrowserTabView .ui-tabs-nav li.ui-tabs-selected a,
		.fitsBrowserTabView .ui-tabs-nav li.ui-state-active a {
		    cursor: pointer !important;
		    display: block !important;
		    padding: 1rem !important;
		}


		.fitsBrowserTabView .ui-tabs-nav li.ui-state-active {
		    box-shadow: none !important;
		}


		.fitsBrowserTabView .ui-tabs-nav.ui-widget-header {
		    border: none !important;
		    background: none !important;
		}

		.fitsBrowserTabView .ui-tabs-nav {
		    border-bottom: 2px solid #dee2e6;
		}

	</style>


	<p:tabView id="fitsBrowserTabView" styleClass="fitsBrowserTabView">
		<p:tab title="Seach by Session">
			<p:scrollPanel style="width:100%;height:250px" mode="native">
				<p:tree value="#{frameController.sessionRoot}" var="frameTreeElement" selectionMode="single" style="width:100%;border:none"
					selection="#{frameController.selectedNode}" id="sessionTree" animate="true">

					<p:ajax event="select" update=":frameDisplayForm:framePanel :markingForm" listener="#{frameController.onNodeSelect}" oncomplete="drawFrame()" />


					<p:treeNode expandedIcon="ui-icon-folder-open" collapsedIcon="ui-icon-folder-collapsed">
						<h:outputText value="#{frameTreeElement.displayName}" />
					</p:treeNode>


					<p:treeNode type="picture" icon="ui-icon-image">
						<h:outputText value="#{frameTreeElement.displayName}" />
					</p:treeNode>

				</p:tree>
			</p:scrollPanel>
		</p:tab>
		<p:tab title="Search by Type">
			<p:scrollPanel style="width:100%;height:250px" mode="native">
				<p:tree value="#{frameController.typeRoot}" var="frameTreeElement" selectionMode="single" style="width:100%"
					selection="#{frameController.selectedNode}" id="typeTree" animate="true">

					<p:ajax event="select" update=":frameDisplayForm:framePanel :frameHiddenForm :markingForm" listener="#{frameController.onNodeSelect}" oncomplete="drawFrame()" />

					<p:treeNode expandedIcon="ui-icon-folder-open" collapsedIcon="ui-icon-folder-collapsed">
						<h:outputText value="#{frameTreeElement.displayName}" />
					</p:treeNode>


					<p:treeNode type="picture" icon="ui-icon-image">
						<h:outputText value="#{frameTreeElement.displayName}" />
					</p:treeNode>
				</p:tree>
			</p:scrollPanel>
		</p:tab>
	</p:tabView>


</ui:composition>
