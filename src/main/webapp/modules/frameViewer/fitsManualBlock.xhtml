<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

	<p:panelGrid styleClass="pcsFormNoBorder">
		<p:row>
			<p:column colspan="2">
				<p:fileUpload value="#{procedureController.uploadFitsFile}" mode="advanced" auto="true" dragDropSupport="false" 
					fileUploadListener="#{procedureController.handleFileUpload}"
					update=":growl :errorGrowl :frameDisplayForm:framePanel"
					sizeLimit="4000000" allowTypes="/(\.|\/)(FTS)$/" />
			</p:column>
		</p:row>

	</p:panelGrid>

</ui:composition>
