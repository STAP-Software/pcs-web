<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">


			<p:spacer height="10px" />


			<p:panelGrid columns="2">

			<h:form id="frameViewerForm">
				<p:tabView>
					<p:tab title="Session">
						<p:scrollPanel style="width:350px;height:512px" mode="native">  
						<p:tree value="#{frameController.sessionRoot}" var="frameTreeElement" selectionMode="single" style="width:340px"
							selection="#{frameController.selectedNode}" id="sessionTree" animate="true">

							<p:ajax event="select" update=":framePanel" listener="#{frameController.onNodeSelect}" />


							<p:treeNode expandedIcon="ui-icon-folder-open" collapsedIcon="ui-icon-folder-collapsed">
								<h:outputText value="#{frameTreeElement.displayName}" />
							</p:treeNode>


							<p:treeNode type="picture" icon="ui-icon-image">
								<h:outputText value="#{frameTreeElement.displayName}" />
							</p:treeNode>

						</p:tree>
						</p:scrollPanel>
					</p:tab>
					<p:tab title="Type">
						<p:scrollPanel style="width:350px;height:512px" mode="native">  
						<p:tree value="#{frameController.typeRoot}" var="frameTreeElement" selectionMode="single" style="width:340px"
							selection="#{frameController.selectedNode}" id="typeTree" animate="true">

							<p:ajax event="select" update=":framePanel" listener="#{frameController.onNodeSelect}" />

							<p:treeNode expandedIcon="ui-icon-folder-open" collapsedIcon="ui-icon-folder-collapsed">
								<h:outputText value="#{frameTreeElement.displayName}" />
							</p:treeNode>


							<p:treeNode type="picture" icon="ui-icon-image">
								<h:outputText value="#{frameTreeElement.displayName}" />
							</p:treeNode>
						</p:tree>
						</p:scrollPanel>
					</p:tab>
				</p:tabView>

		</h:form>

				<p:panelGrid style="width:520px;height:520px" columns="1" id="framePanel">
					<h:panelGrid columns="1" style="width:512px;height:512px" cellpadding="5">

						<p:graphicImage value="#{frameController.graphicImage}" height="512px" width="512px" />							
						  
						<!--  
						<p:lightBox>

							<h:outputLink value="#">
								<p:graphicImage value="#{frameController.graphicImage}" height="512px" width="512px" cache="false"/>							
							</h:outputLink>
							
							
							<f:facet name="inline">
								<p:graphicImage value="#{frameController.graphicImage}" height="512px" width="512px" cache="false"/>							
							</f:facet>


						</p:lightBox>
						-->
						
						
					</h:panelGrid>
				</p:panelGrid>

			</p:panelGrid>



	</ui:define>
</ui:composition>
</html>
