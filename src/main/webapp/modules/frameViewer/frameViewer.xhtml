
<ui:composition template="../../template.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

	<ui:define name="content">

		<style>
			.fitsBrowserCol { width: 35%; vertical-align: top; }
			.frameViewerCol { width: 33%; vertical-align: top; }
			.cameraCol { width: 32%; vertical-align: top; }
		</style>

		<h:form id="frameHiddenForm">
			<h:inputHidden id="centroidXs" value="#{frameController.centroidXs}" />
			<h:inputHidden id="centroidYs" value="#{frameController.centroidYs}" />
			<h:inputHidden id="spotRadius" value="#{frameController.searchRadius}" />
			<h:inputHidden id="pixelValue" value="#{frameController.pixelValue}" />
			<h:inputHidden id="frameEditMode" value="#{frameController.frameEditMode}" />
			<h:inputHidden id="frameWidth" value="#{frameController.ccdFrame.frameWidth}" />
			<h:inputHidden id="frameHeight" value="#{frameController.ccdFrame.frameHeight}" />
		</h:form>
		<h:form id="frameDisplayForm">

			<p:spacer height="10px" />

			<p:panelGrid columns="3" styleClass="pcsExecutionPanel" columnClasses="fitsBrowserCol,frameViewerCol,cameraCol">


				<p:accordionPanel id="loadPanel" multiple="true" activeIndex="1,2">

					<p:tab id="fitsBrowser" title="FITS File Browsing">
						<ui:include src="fitsBrowserBlock.xhtml"/>
					</p:tab>

					<p:tab title="#{ccdManualController.statusPanelTitle}" rendered="#{sessionController.ifCommandPermission}">
						<ui:include src="../diagnostic/ccdStatusBlock.xhtml"/>
					</p:tab>
					<p:tab title="#{ccdManualController.commandPanelTitle}" rendered="#{sessionController.ifCommandPermission}">
						<ui:include src="../diagnostic/ccdManualBlock.xhtml"/>
					</p:tab>

				</p:accordionPanel>

				<p:accordionPanel id="frameViewerPanel">
					<ui:include src="../frameViewer/frameDisplayBlock.xhtml"/>
				</p:accordionPanel>

				<p:accordionPanel id="cameraPanel" multiple="true" activeIndex="0,1"  >

					<p:tab title="#{cameraManualController.statusPanelTitle}" rendered="#{sessionController.ifCommandPermission}">
						<ui:include src="../diagnostic/cameraStatusBlock.xhtml"/>
					</p:tab>

					<p:tab title="#{cameraManualController.commandPanelTitle}" rendered="#{sessionController.ifCommandPermission}">
						<ui:include src="../diagnostic/cameraControlBlock.xhtml"/>
					</p:tab>

				</p:accordionPanel>


			</p:panelGrid>
		</h:form>

		<ui:include src="markingInfoDialog.xhtml"/>


	</ui:define>
</ui:composition>
