<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
		<p:dialog id="advancedDlg" header="Advanced Configuration Options" widgetVar="advancedDialog">

			<h:form id="advancedForm">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

					<p:spacer height="5px" />
					<p:spacer height="5px" />

					<h:outputLabel value="Calculation Options" />
					<p:selectOneMenu value="#{passiveTiltController.procedure.procedureConfig.calculationOptions}" disabled="#{passiveTiltController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItem itemLabel="Pure Tilts" itemValue="1" />
						<f:selectItem itemLabel="Focus Mode Pistons" itemValue="2" />
						<f:selectItem itemLabel="Pure Tilts + Focus Mode Pistons" itemValue="3" />
						<f:selectItem itemLabel="Pure Focus Mode" itemValue="4" />
						<f:selectItem itemLabel="Pure Tilts + Optimal Pistons" itemValue="5" />
						<f:selectItem itemLabel="Optimal Pistons" itemValue="6" />
					</p:selectOneMenu>

	
					<h:outputLabel value="Add Integration Times to Menu" />
					<h:panelGroup>
					<h:outputText value="This can now be performed by entering the value "/>
					<br/>
					<h:outputText value="directly into the integration time combo box "/>
					</h:panelGroup>
					<p:spacer height="5px" />
					<p:spacer height="5px" />

				</p:panelGrid>

				<p:commandButton id="saveButton" value="Save" icon="ui-icon-check" style="float:right" update=":growl"
					action="#{passiveTiltController.doSaveAdvancedOptions}" oncomplete="advancedDialog.hide();" />
				<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update=":growl"
					action="#{passiveTiltController.doCancelSaveAdvancedOptions}" oncomplete="advancedDialog.hide();" />

			</h:form>
		</p:dialog>

</ui:composition>

</html>
