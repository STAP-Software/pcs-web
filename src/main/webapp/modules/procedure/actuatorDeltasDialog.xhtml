<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

<script type="text/javascript">  
//<![CDATA[

var sideLen = 77
var hexRadius = (Math.sqrt(3.0)/2.0) * sideLen
   
var a = sideLen
var b = a * Math.sqrt(3) / 2;

var resizing = false;

var actDeltaScope = {drawSegments: true, drawSegNums: true, drawActVals: true, drawHeat: true, drawHeatCircles: false};


function runDrawActDeltas() {

	var c = document.getElementById("actDeltasCanvas");
	var ctx = c.getContext("2d");

	ctx.translate(-25,-10);

	var cl = document.getElementById("legendCanvas");
	var ctxl = cl.getContext("2d");

	window.setTimeout("drawActDeltas(true,true,true,true,false)", 10);
	
	$(PF('actuatorDeltasDisplayDialog').jqId).bind('resize', function(){
		if (!resizing) {
			resizing = true;
			window.setTimeout("actuatorDeltasResizeHandler()", 50);
		}
	})
}


function actuatorDeltasResizeHandler() {

    var c = document.getElementById("actDeltasCanvas");
    var rightPanel = document.getElementById("actDeltasForm:actDeltasRightPanel");
    var dlgWrapper = document.getElementById("actDeltasDialog").closest('.ui-dialog');

    c.style.width = "0px";
    c.style.height = "0px";

    var availableWidth = dlgWrapper.offsetWidth - rightPanel.offsetWidth - 30 - 48;
    var availableHeight = dlgWrapper.offsetHeight - 128;
    var available = Math.max(776, Math.min(availableWidth, availableHeight));

    c.width = available;
    c.height = available;
    c.style.width = available + "px";
    c.style.height = available + "px";

    var ctx = c.getContext("2d");
    var scale = available / 1000.0;
    ctx.scale(scale, scale);
    ctx.translate(-25, -10);

    drawActDeltas(actDeltaScope.drawSegments, actDeltaScope.drawSegNums, actDeltaScope.drawActVals, actDeltaScope.drawHeat, actDeltaScope.drawHeatCircles);

    resizing = false;

}

function drawActDeltas(drawSegments,drawSegNums,drawActVals,drawHeat,drawHeatCircles) {
    
	actDeltaScope.drawSegments = drawSegments; 
	actDeltaScope.drawSegNums = drawSegNums;
	actDeltaScope.drawActVals = drawActVals;
	actDeltaScope.drawHeat = drawHeat;
	actDeltaScope.drawHeatCircles = drawHeatCircles;
	
	var c = document.getElementById("actDeltasCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,1000,1000);

	// display coordinates
	var xField1 = document.getElementById('actDeltasForm:centDefXs').value;
 	var xHexCenterArray = xField1.split(','); 
 	
	var yField1 = document.getElementById('actDeltasForm:centDefYs').value;
 	var yHexCenterArray = yField1.split(','); 
 	
	var act1PosField = document.getElementById('actDeltasForm:act1Pos').value;
 	var act1PosArray = act1PosField.split(','); 
   
	var actDeltasField = document.getElementById('actDeltasForm:actuatorDeltas').value;
 	var actDeltasArray = actDeltasField.split(','); 
   
	var heatField = document.getElementById('actDeltasForm:actDeltaHeats').value;
 	var heatArray = heatField.split(','); 

 	
	var centerX = 512;
	var centerY = 512;
    	 	
	for (var i = 0; i < xHexCenterArray.length; i++) {
		
		var x = centerX + parseFloat(xHexCenterArray[i]) * sideLen;
		var y = centerY - parseFloat(yHexCenterArray[i]) * sideLen;
		
		var act1Position = parseFloat(act1PosArray[i]);
		
		// parse to float, convert to um, and keep 3 decimal places
		var actDelta1 = (parseFloat(actDeltasArray[(i*3)+0])/1000.0).toFixed(3);
		var actDelta2 = (parseFloat(actDeltasArray[(i*3)+1])/1000.0).toFixed(3);
		var actDelta3 = (parseFloat(actDeltasArray[(i*3)+2])/1000.0).toFixed(3);
								
		var heat1 = heatArray[(i*3)+0];
		var heat2 = heatArray[(i*3)+1];
		var heat3 = heatArray[(i*3)+2];
		
		drawHex2(ctx, x, y, sideLen, i+1, drawSegments, drawSegNums, act1Position, actDelta1, actDelta2, actDelta3, drawActVals,
				heat1, heat2, heat3, drawHeat, drawHeatCircles)
		
	}
	
	// draw key
	var cl = document.getElementById("legendCanvas");
	var ctxl = cl.getContext("2d");
	ctxl.clearRect(0,0,500,500)

	// 1. 'up' triangle (use circles and numbers)
	ctxl.fillStyle = "#e8f0f8";
	ctxl.font="18px Arial";

	var x = 200;
	var y = 100;
	var radius = 30;
	var txtOffset = 5;

	ctxl.fillStyle = "#e8f0f8";
	ctxl.beginPath();
	ctxl.arc(x, y - b/2, radius, 0, 2 * Math.PI, false);
	ctxl.fill();
	
	ctxl.beginPath();
	ctxl.arc(x - a/2, y + b/2, radius, 0, 2 * Math.PI, false);
	ctxl.fill();
	
	ctxl.beginPath();
	ctxl.arc(x + a/2, y + b/2, radius, 0, 2 * Math.PI, false);
	ctxl.fill();
	
	ctxl.fillStyle = '#000000';
	ctxl.fillText("1", x-txtOffset, y+txtOffset - b/2);
	ctxl.fillText("2", x-txtOffset - a/2, y+txtOffset + b/2);
	ctxl.fillText("3", x-txtOffset + a/2, y+txtOffset + b/2);

	// 2. 'down' triangle
	x = 400;
	
	ctxl.fillStyle = "#e8f0f8";
	ctxl.beginPath();
	ctxl.arc(x - a/2, y - b/2, radius, 0, 2 * Math.PI, false);
	ctxl.fill();
	
	ctxl.beginPath();
	ctxl.arc(x + a/2, y - b/2, radius, 0, 2 * Math.PI, false);
	ctxl.fill();
	
	ctxl.beginPath();
	ctxl.arc(x, y + b/2, radius, 0, 2 * Math.PI, false);
	ctxl.fill();
	
	ctxl.fillStyle = '#000000';
	ctxl.fillText("1", x-txtOffset - a/2, y+txtOffset - b/2);
	ctxl.fillText("2", x-txtOffset, y+txtOffset + b/2);
	ctxl.fillText("3", x-txtOffset + a/2, y+txtOffset - b/2);

	ctxl.fillStyle = '#333333';
	ctxl.font="18px Arial";
	ctxl.fillText("Actuator Numbering Schemes", 170, 200);  

}

function drawHex2(ctx, x, y, sideLen, number, drawSegment, drawSegNum, act1Position, actDelta1, actDelta2, actDelta3, drawActDelta,
		heat1, heat2, heat3, drawHeat, drawHeatCircles) {

	if (drawSegment) {
		ctx.beginPath();
		ctx.strokeStyle = '#888888';
    	ctx.moveTo(x-a,y)	
		ctx.lineTo(x-a/2,y-b)
    	ctx.lineTo(x+a/2,y-b)
    	ctx.lineTo(x+a,y)
    	ctx.lineTo(x+a/2,y+b)
    	ctx.lineTo(x-a/2,y+b)
		ctx.closePath();
		ctx.stroke();
	
		ctx.fillStyle = "#ffffff";
		ctx.fill();
	}
	
	if (drawHeat) {
	
		if (drawHeatCircles) {
			var radius = 26;
			var dx = 10;
			var dy = 14;
			
			if (act1Position < 5.0) {
				ctx.beginPath();
				ctx.arc(x, y - b/2, radius, 0, 2 * Math.PI, false);
				ctx.fillStyle = heat1;
				ctx.fill();
				
				ctx.beginPath();
				ctx.arc(x - a/2 + dx, y + b/2 - dy, radius, 0, 2 * Math.PI, false);
				ctx.fillStyle = heat2;
				ctx.fill();
				
				ctx.beginPath();
				ctx.arc(x + a/2 - dx, y + b/2 - dy, radius, 0, 2 * Math.PI, false);
				ctx.fillStyle = heat3;
				ctx.fill();
			
			} else {
				ctx.beginPath();
				ctx.arc(x - a/2 + dx, y - b/2 + dy, radius, 0, 2 * Math.PI, false);
				ctx.fillStyle = heat1;
				ctx.fill();
				
				ctx.beginPath();
				ctx.arc(x, y + b/2, radius, 0, 2 * Math.PI, false);
				ctx.fillStyle = heat2;
				ctx.fill();

				ctx.beginPath();
				ctx.arc(x + a/2 - dx, y - b/2 + dy, radius, 0, 2 * Math.PI, false);
				ctx.fillStyle = heat3;
				ctx.fill();
			}

		} else {
		
			var p1x = x+ 0.0;
			var p1y = y-b;
			var p2x = x + (a*3)/4;
			var p2y = y - b/2;
			var p3x = x + (a*3)/4;
			var p3y = y + b/2;
			var p4x = x + 0.0;
			var p4y = y + b;
			var p5x = x -(a*3)/4;
			var p5y = y + b/2;
			var p6x = x -(a*3)/4;
			var p6y = y - b/2;
		
			if (act1Position < 5.0) {
				ctx.strokeStyle = '#888888';
							
				ctx.beginPath();
				ctx.moveTo(x,y);
				ctx.lineTo(p6x, p6y);
				ctx.lineTo(x-a/2, y-b);
				ctx.lineTo(x+a/2,y-b);
				ctx.lineTo(p2x, p2y);
				ctx.closePath();
				ctx.fillStyle = heat1;
				ctx.fill();
				
				ctx.beginPath();
				ctx.moveTo(x,y);
				ctx.lineTo(p4x, p4y);
				ctx.lineTo(x-a/2,y+b)
		    	ctx.lineTo(x-a,y)
				ctx.lineTo(p6x, p6y);
				ctx.closePath();
				ctx.fillStyle = heat2;
				ctx.fill();

				ctx.beginPath();
				ctx.moveTo(x,y);
				ctx.lineTo(p2x, p2y);
				ctx.lineTo(x+a, y);
		    	ctx.lineTo(x+a/2,y+b)
				ctx.lineTo(p4x, p4y);
				ctx.closePath();
				ctx.fillStyle = heat3;
				ctx.fill();
				
			} else {
				
				ctx.strokeStyle = '#888888';
				
				ctx.beginPath();
				ctx.moveTo(x,y);
				ctx.lineTo(p5x, p5y);
				ctx.lineTo(x-a,y)
				ctx.lineTo(x-a/2,y-b)
				ctx.lineTo(p1x, p1y);
				ctx.closePath();
				ctx.fillStyle = heat1;
				ctx.fill();
	
				ctx.beginPath();
				ctx.moveTo(x,y);
				ctx.lineTo(p3x, p3y);
		    	ctx.lineTo(x+a/2,y+b)
		    	ctx.lineTo(x-a/2,y+b)
				ctx.lineTo(p5x, p5y);
				ctx.closePath();
				ctx.fillStyle = heat2;
				ctx.fill();
				
				ctx.beginPath();
				ctx.moveTo(x,y);
				ctx.lineTo(p1x, p1y);
		    	ctx.lineTo(x+a/2,y-b)
		    	ctx.lineTo(x+a,y)
				ctx.lineTo(p3x, p3y);
				ctx.closePath();
				ctx.fillStyle = heat3;
				ctx.fill();
			}
		}
	}
	
	var txtOffset = 5;
	
	if (drawSegNum) {
		ctx.fillStyle = '#8888ff';
		ctx.font="18px Arial";
		ctx.fillText(number, x-txtOffset, y+txtOffset);
	}
	
	if (drawActDelta) {
		ctx.fillStyle = '#000000';
		ctx.font="14px Arial";
		
		var dx = 12;
		var dy = 14;
		
		if (act1Position < 5.0) {
			ctx.fillText(actDelta1, x-txtOffset - 16, y+txtOffset - b/2);
			ctx.fillText(actDelta2, x-txtOffset - a/2 - 4 , y+txtOffset + b/2 - 14);
			ctx.fillText(actDelta3, x-txtOffset + a/2 - 22, y+txtOffset + b/2 - 14);
			
		} else {
			ctx.fillText(actDelta1, x-txtOffset - a/2 - 4, y+txtOffset - b/2 + 14);
			ctx.fillText(actDelta2, x-txtOffset - 10, y+txtOffset + b/2);
			ctx.fillText(actDelta3, x-txtOffset + a/2 - 24, y+txtOffset - b/2 + 14);
		}
	}
	
}


//]]>  
</script>   


	<p:dialog id="actDeltasDialog" header="Primary Mirror Actuator Deltas" widgetVar="actuatorDeltasDisplayDialog" closable="false"
	          width="1336">
		<h:form id="actDeltasForm">

			<h:inputHidden id="centDefXs" value="#{visualizationController.segCentersX}" />
			<h:inputHidden id="centDefYs" value="#{visualizationController.segCentersY}" />
			<h:inputHidden id="act1Pos" value="#{visualizationController.act1Pos}" />
			<h:inputHidden id="actuatorDeltas" value="#{visualizationController.actuatorDeltas}" />
			<h:inputHidden id="actDeltaHeats" value="#{visualizationController.actDeltaHeats}" />

			<!-- outer flex row: canvas on the left, controls on the right -->
			<h:panelGroup layout="block" style="display:flex; flex-direction:row; gap:30px; align-items:flex-start; width:100%; justify-content:space-between;">

				<canvas id="actDeltasCanvas" width="1000" height="1000"
				        style="width:776px; height:776px; flex-shrink:0;">
					Your browser does not support the HTML5 canvas tag.
				</canvas>

				<!-- right panel: vertical flex column, constrained to remaining space -->
				<h:panelGroup id="actDeltasRightPanel" layout="block" style="flex:0 0 auto; display:flex; flex-direction:column; gap:10px;">

					<p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder ui-panelgrid-blank" columnClasses="btmsFormLabelColumn, btmsFormInputColumn" style="white-space:nowrap;">

						<p:spacer height="15"/><p:spacer height="15"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CalcDesiredActCommandsResult','DesiredActDeltasRms')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.actuatorDeltasDisplayValues.desiredActDeltasRms}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<p:spacer height="30"/><p:spacer height="30"/>

						<h:outputLabel value="Show Segments" />
						<p:selectBooleanButton value="#{visualizationController.showSegments}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateActDeltaDisplayListener}" />
						</p:selectBooleanButton>

						<h:outputLabel value="Show Segment Numberings" />
						<p:selectBooleanButton value="#{visualizationController.showSegNums}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateActDeltaDisplayListener}" />
						</p:selectBooleanButton>

						<h:outputLabel value="Show Heat Display" />
						<h:panelGroup layout="block">
							<p:selectBooleanButton value="#{visualizationController.showHeat}" onLabel="On" offLabel="Off">
								<p:ajax update="@this" listener="#{visualizationController.updateActDeltaDisplayListener}" />
							</p:selectBooleanButton>
							<p:selectOneRadio id="console" value="#{visualizationController.showHeatCircles}" style="margin-top:10px;">
								<f:selectItem itemLabel="Areas" itemValue="false" />
								<f:selectItem itemLabel="Circles" itemValue="true" />
								<p:ajax update="@this" listener="#{visualizationController.updateActDeltaDisplayListener}" />
							</p:selectOneRadio>
						</h:panelGroup>

						<h:outputLabel value="Show Actuator Values" />
						<p:selectBooleanButton value="#{visualizationController.showActVals}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateActDeltaDisplayListener}" />
						</p:selectBooleanButton>

					</p:panelGrid>

					<!-- legend canvas below the controls -->
					<canvas id="legendCanvas" width="500" height="250"
					        style="width:350px; height:175px; margin-top:180px; margin-left:40px;">
						Your browser does not support the HTML5 canvas tag.
					</canvas>

				</h:panelGroup>

			</h:panelGroup>

			<br/>

			<h:panelGroup styleClass="dialogCommandGroup">
				<p:commandButton value="Abort" styleClass="dialogbutton" update=":growl :errorGrowl"
						action="#{asyncController.doCloseGraphicsDisplayAbort}" oncomplete="PF('actuatorDeltasDisplayDialog').hide()" rendered="#{sessionController.procedureExecuting}"/>
				<p:commandButton id="closeButton" value="Close" styleClass="dialogbutton" update=":growl :errorGrowl"
						action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="PF('actuatorDeltasDisplayDialog').hide()" />
			</h:panelGroup>

		</h:form>
	</p:dialog>


</ui:composition>
