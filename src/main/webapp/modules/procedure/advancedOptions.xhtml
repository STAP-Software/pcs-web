<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
		<p:dialog id="advancedDlg" header="Advanced Configuration Options" widgetVar="advancedDialog" >

			<h:form id="advancedForm">
			
				<p:panelGrid columns="1" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
			
			<p:fieldset legend="General">
			
				
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

					<p:spacer height="5px" />
					<p:spacer height="5px" />

					<h:outputLabel value="Filter" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.filter}"
						disabled="#{procedureController.procedure.procedureState gt 1}" converter="#{filterConverter}">
					<f:selectItem itemLabel="Select One" itemValue=""/> 
					<f:selectItems value="#{sessionController.instrument.camera.filterWheel.origFilterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
					<p:ajax update="refBeamField ccdGainField :procedureDetailForm:procedureDetailPanel" listener="#{procedureController.filterSelectListener}" />
					</p:selectOneMenu>
					
					<h:outputLabel value="Light Source" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.lightSource}"
						disabled="#{(procedureController.procedure.procedureState gt 1) or procedureController.procedure.procedureType.createRefMap}" >
					<f:selectItem itemLabel="Star" itemValue="1"/> 
					<f:selectItem itemLabel="Reference Beam" itemValue="2"/>
					<p:ajax update="advancedForm :procedureDetailForm:controlPanel:intTimes :procedureDetailForm:controlPanel:ccdGainNumbers" listener="#{procedureController.lightSourceSelectListener}" />
					</p:selectOneMenu>
					
					<h:outputLabel value="Reference Beam" rendered="#{procedureController.procedure.procedureConfigSet.procedureConfig.lightSource eq 2}" />
					<p:selectOneMenu id="refBeamField" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.referenceBeam}"
						rendered="#{procedureController.procedure.procedureConfigSet.procedureConfig.lightSource eq 2}" disabled="#{procedureController.procedure.procedureState gt 1}" converter="#{refBeamConverter}">
					<f:selectItems value="#{sessionController.instrument.camera.orderedReferenceBeamList}" var="refBeam" itemLabel="#{refBeam.refBeamNum}" itemValue="#{refBeam}" />
					</p:selectOneMenu>
					
					<h:outputLabel value="CCD Gain Number" />
					<p:selectOneMenu id="ccdGainField" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.ccdGainNumber}"
						disabled="#{(procedureController.procedure.procedureState gt 1)}" >
					<f:selectItem itemLabel="0" itemValue="0"/> 
					<f:selectItem itemLabel="1" itemValue="1"/>
					<f:selectItem itemLabel="2" itemValue="2"/> 
					<f:selectItem itemLabel="3" itemValue="3"/>
					</p:selectOneMenu>
					
					
					<h:outputLabel value="Remove Bad Pixels" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.removeBadPixels}" disabled="#{procedureController.procedure.procedureState gt 1}" />

					<p:spacer height="5px" />
					<p:spacer height="5px" />

				</p:panelGrid>
				
				</p:fieldset>
				
				 
				<p:fieldset legend="Find and Identify Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{not procedureController.procedure.procedureType.centerTelescope}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					<h:outputLabel value="Force Scale" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.fiConfig.forceScale}" disabled="#{procedureController.procedure.procedureState gt 1}" >
            			<p:ajax update="advancedForm" />
        			</p:selectBooleanCheckbox>
 
         			
        			<h:outputLabel value="Force Scale Source" rendered="#{procedureController.procedure.procedureConfigSet.fiConfig.forceScale}" />
        			
        			<p:panelGrid columns="3" id="forceScalePanelGroup" styleClass="noPadding" rendered="#{procedureController.procedure.procedureConfigSet.fiConfig.forceScale}" >
        			  
        			<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.fiConfig.forceScaleSource}" disabled="#{procedureController.procedure.procedureState gt 1}">
            			<f:selectItem itemLabel="Ref Map" itemValue="1" />
            			<f:selectItem itemLabel="User Value" itemValue="2" />
					<p:ajax update="forceScalePanelGroup" />
					</p:selectOneMenu>
					<p:spacer height="1" width="10" />
					<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.fiConfig.forceScaleValue}" 
						rendered="#{procedureController.procedure.procedureConfigSet.fiConfig.forceScaleSource eq 2}" disabled="#{procedureController.procedure.procedureState gt 1}" />
        			</p:panelGrid>
          			
					<h:outputLabel value="Force Rotation" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.fiConfig.forceRotation}" disabled="#{procedureController.procedure.procedureState gt 1}">
            			<p:ajax update="advancedForm" />
        			</p:selectBooleanCheckbox>

       				<h:outputLabel value="Force Rotation Source" rendered="#{procedureController.procedure.procedureConfigSet.fiConfig.forceRotation}" disabled="#{procedureController.procedure.procedureState gt 1}" />
        			
        			<p:panelGrid columns="3" id="forceRotationPanelGroup" styleClass="noPadding" rendered="#{procedureController.procedure.procedureConfigSet.fiConfig.forceRotation}" >
        			<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.fiConfig.forceRotationSource}" disabled="#{procedureController.procedure.procedureState gt 1}">
            			<f:selectItem itemLabel="Ref Map" itemValue="1" />
            			<f:selectItem itemLabel="User Value (deg)" itemValue="2" />
					<p:ajax update="forceRotationPanelGroup" />
					</p:selectOneMenu>
					<p:spacer height="1" width="10" />
					<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.fiConfig.forceRotationValue}" 
						rendered="#{procedureController.procedure.procedureConfigSet.fiConfig.forceRotationSource eq 2}" disabled="#{procedureController.procedure.procedureState gt 1}" />
        			</p:panelGrid>
 
 					<h:outputLabel value="Fraction of Boxes Filled Threshold" />
 					<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.fiConfig.fracFilledThresh}" disabled="#{procedureController.procedure.procedureState gt 1}" />
 					
 					<h:outputLabel value="Fourier Quality Threshold" />
 					<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.fiConfig.fourierQualityThresh}" disabled="#{procedureController.procedure.procedureState gt 1}" />
  
 
				</p:panelGrid>
				</p:fieldset>

				<p:fieldset legend="Centroid Offsets Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{not procedureController.procedure.procedureType.centerTelescope}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					
					<h:outputLabel value="Remove Scale" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.centroidOffsetsConfig.removeScale}" disabled="#{procedureController.procedure.procedureState gt 1}" />
 					<h:outputLabel value="Remove Rotation" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.centroidOffsetsConfig.removeRotation}" disabled="#{procedureController.procedure.procedureState gt 1}" />
  
				</p:panelGrid>
				</p:fieldset>

				<p:fieldset legend="Pupil Registration Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{procedureController.procedure.procedureType.pupilRegistration}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					
					<h:outputLabel value="Fractional Intensity Normalization Method" />
       				<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.pupilRegErrorConfig.fractionalIntensityCalcMethod}" disabled="#{procedureController.procedure.procedureState gt 1}">
             			<f:selectItem itemLabel="Use Peripheral Subimages (PCS)" itemValue="1" />
            			<f:selectItem itemLabel="Use Interior Subimages (APS)" itemValue="2" />
					</p:selectOneMenu>
  
				</p:panelGrid>
				</p:fieldset>

				<p:fieldset legend="Fine Screen Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{procedureController.procedure.procedureType.fineScreen}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					
					<h:outputLabel value="M2/M1 Calculation Method" />
       				<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.calcM2M1Config.calcMethod}" disabled="#{procedureController.procedure.procedureState gt 1}">
             			<f:selectItem itemLabel="Ray Trace" itemValue="1" />
            			<f:selectItem itemLabel="Zernikes" itemValue="2" />
					</p:selectOneMenu>
  
				</p:panelGrid>
				</p:fieldset>
				
				
				<p:fieldset legend="Coarse Phasing Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{procedureController.procedure.procedureType.coarsePhasing}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					
					<h:outputLabel value="Number of Phasing Steps" />
       				<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.phasingSteps}" disabled="#{procedureController.procedure.procedureState gt 1}" />
       								
       				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ProcedureConfig','PhasingStepSize')}" />				
					<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
       				<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.phasingStepSize}" disabled="#{procedureController.procedure.procedureState gt 1}" />
  
				</p:panelGrid>
				</p:fieldset>

				<p:fieldset legend="Narrowband Phasing Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{procedureController.procedure.procedureType.narrowBandPhasing}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					
					<h:outputLabel value="Edge Height Search Range for Filter Sequence" />
       				<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.nbFilterSeqConfig.edgeHeightSearchRange}" disabled="#{procedureController.procedure.procedureState gt 1}" />
       								  
				</p:panelGrid>
				</p:fieldset>

				<p:fieldset legend="SUFS Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{procedureController.procedure.procedureType.sufs}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					
					<h:outputLabel value="Ignore Jumped Subimage Threshold (pixels)" />
       				<p:inputText size="4" value="#{procedureController.procedure.procedureConfigSet.centroidOffsetsConfig.sufsIgnoreSubimageThreshold}" disabled="#{procedureController.procedure.procedureState gt 1}" />
       								  
				</p:panelGrid>
				</p:fieldset>


				</p:panelGrid>

				<p:commandButton id="saveButton" value="Save" icon="ui-icon-check" style="float:right" update=":growl :errorGrowl advancedForm :procedureDetailForm:controlPanel"
					action="#{procedureController.doSaveAdvancedOptions}" oncomplete="advancedDialog.hide();" disabled="#{procedureController.procedure.procedureState gt 1}" />
				<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update=":growl :errorGrowl"
					type="button" onclick="advancedDialog.hide();" />

			</h:form>
		</p:dialog>

</ui:composition>


</html>
