<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
		<p:dialog id="advancedDlg" header="Advanced Configuration Options" widgetVar="advancedDialog" >

			<h:form id="advancedForm">
			
				<p:panelGrid columns="1" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
			
			<p:fieldset legend="General">
			
				
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

					<p:spacer height="5px" />
					<p:spacer height="5px" />

					<h:outputLabel value="Filter" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfig.filter}"
						disabled="#{procedureController.procedure.procedureState gt 1}" converter="#{filterConverter}">
					<f:selectItem itemLabel="Select One" itemValue=""/> 
					<f:selectItems value="#{sessionController.instrument.camera.filterWheel.origFilterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
					<p:ajax update=":advancedForm :procedureDetailForm:procedureDetailPanel" listener="#{procedureController.doUpdateFilter}" />
					</p:selectOneMenu>
					
					<h:outputLabel value="Light Source" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfig.lightSource}"
						disabled="#{(procedureController.procedure.procedureState gt 1) or procedureController.procedure.procedureType.createRefMap}" >
					<f:selectItem itemLabel="Star" itemValue="1"/> 
					<f:selectItem itemLabel="Reference Beam" itemValue="2"/>
					<p:ajax update=":advancedDlg" oncomplete="advancedDialog.show();" />
					</p:selectOneMenu>
					
					<h:outputLabel value="Reference Beam" rendered="#{procedureController.procedure.procedureConfig.lightSource eq 2}" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfig.referenceBeam}"
						rendered="#{procedureController.procedure.procedureConfig.lightSource eq 2}" converter="#{refBeamConverter}">
					<f:selectItems value="#{sessionController.instrument.camera.orderedReferenceBeamList}" var="refBeam" itemLabel="#{refBeam.refBeamNum}" itemValue="#{refBeam}" />
					</p:selectOneMenu>

					<p:spacer height="5px" />
					<p:spacer height="5px" />

				</p:panelGrid>
				
				</p:fieldset>
				
				 
				<p:fieldset legend="Find and Identify Options" style="margin-top:5px; margin-bottom:5px" 
					rendered="#{not procedureController.procedure.procedureType.centerTelescope}">
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
					<h:outputLabel value="Force Scale" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.fiConfigActual.forceScale}">
            			<p:ajax update="advancedForm" />
        			</p:selectBooleanCheckbox>
 
         			
        			<h:outputLabel value="Force Scale Source" rendered="#{procedureController.procedure.fiConfigActual.forceScale}" />
        			
        			<p:panelGrid columns="3" id="forceScalePanelGroup" styleClass="noPadding" rendered="#{procedureController.procedure.fiConfigActual.forceScale}" >
        			  
        			<p:selectOneMenu value="#{procedureController.procedure.fiConfigActual.forceScaleSource}">
            			<f:selectItem itemLabel="Ref Map" itemValue="1" />
            			<f:selectItem itemLabel="User Value" itemValue="2" />
					<p:ajax update="forceScalePanelGroup" />
					</p:selectOneMenu>
					<p:spacer height="1" width="10" />
					<p:inputText size="4" value="#{procedureController.procedure.fiConfigActual.forceScaleValue}" 
						rendered="#{procedureController.procedure.fiConfigActual.forceScaleSource eq 2}"  />
        			</p:panelGrid>
          			
					<h:outputLabel value="Force Rotation" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.fiConfigActual.forceRotation}">
            			<p:ajax update="advancedForm" />
        			</p:selectBooleanCheckbox>

       				<h:outputLabel value="Force Rotation Source" rendered="#{procedureController.procedure.fiConfigActual.forceRotation}" />
        			
        			<p:panelGrid columns="3" id="forceRotationPanelGroup" styleClass="noPadding" rendered="#{procedureController.procedure.fiConfigActual.forceRotation}" >
        			<p:selectOneMenu value="#{procedureController.procedure.fiConfigActual.forceRotationSource}">
            			<f:selectItem itemLabel="Ref Map" itemValue="1" />
            			<f:selectItem itemLabel="User Value (deg)" itemValue="2" />
					<p:ajax update="forceRotationPanelGroup" />
					</p:selectOneMenu>
					<p:spacer height="1" width="10" />
					<p:inputText size="4" value="#{procedureController.procedure.fiConfigActual.forceRotationValue}" 
						rendered="#{procedureController.procedure.fiConfigActual.forceRotationSource eq 2}"  />
        			</p:panelGrid>
 
 					<h:outputLabel value="Fraction of Boxes Filled Threshold" />
 					<p:inputText size="4" value="#{procedureController.procedure.fiConfigActual.fracFilledThresh}" />
 					
 					<h:outputLabel value="Fourier Quality Threshold" />
 					<p:inputText size="4" value="#{procedureController.procedure.fiConfigActual.fourierQualityThresh}" />
  
 
				</p:panelGrid>
				</p:fieldset>
				 
				</p:panelGrid>

				<p:commandButton id="saveButton" value="Save" icon="ui-icon-check" style="float:right" update=":growl"
					action="#{procedureController.doSaveAdvancedOptions}" oncomplete="advancedDialog.hide();" />
				<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update=":growl"
					action="#{procedureController.doCancelSaveAdvancedOptions}" oncomplete="advancedDialog.hide();" />

			</h:form>
		</p:dialog>

</ui:composition>


</html>
