<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">

<script type="text/javascript">  
//<![CDATA[

var sideLen = 77
var hexRadius = (Math.sqrt(3.0)/2.0) * sideLen
           
var resizing = false;   

var avgPtCentOffScope = {drawSegments: true, drawSegNums: true};
           
function runDrawAvgPtOffsets() {

	var c = document.getElementById("avgPtOffsetsCanvas");
	var ctx = c.getContext("2d");

	ctx.translate(-25,-10);
	ctx.scale(0.61, 0.61);

	window.setTimeout("drawAvgPtCentroidOffsets(true,true)", 10);
	

	$(avgPtCentroidOffsetDisplayDialog.jqId).bind('resize', function(){
		if (!resizing) {
			resizing = true;
			window.setTimeout("avgPtCentroidOffsetsResizeHandler()", 1000);
		}
	})
	   
}

function avgPtCentroidOffsetsResizeHandler() {
	
	var baseScale = 0.61;
	var baseCanvasSize = 600.0;
	
	var d = document.getElementById("avgPtCentroidOffsetDialog"); 
	var availableWidth = d.offsetWidth - 300 - 100;
	var availableHeight = d.offsetHeight - 70;
	var available = Math.min(availableWidth, availableHeight);
	
	var scale = baseScale * available / baseCanvasSize;
	
	var c = document.getElementById("avgPtOffsetsCanvas");
	c.width=available;
	c.height=available;
	
	var ctx = c.getContext("2d");

	ctx.scale(scale, scale);

	//alert("resizing")
	drawAvgPtCentroidOffsets(avgPtCentOffScope.drawSegments, avgPtCentOffScope.drawSegNums);
	
	resizing = false;

}



function drawAvgPtCentroidOffsets(drawSegments, drawSegNums) {
    
	avgPtCentOffScope.drawSegNums = drawSegNums;
	avgPtCentOffScope.drawSegments = drawSegments;

	
	var c = document.getElementById("avgPtOffsetsCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,1000,1000);
	
	//alert("c = " + c)

	// display coordinates - hex centers
	var xField1 = document.getElementById('avgPtOffsetsForm:segCentDefXs').value;
 	var xHexCenterArray = xField1.split(','); 
 	
	var yField1 = document.getElementById('avgPtOffsetsForm:segCentDefYs').value;
 	var yHexCenterArray = yField1.split(','); 
 	
 	// display coordinates - ideal centroid positions
	var xField2 = document.getElementById('avgPtOffsetsForm:centDefXs').value;
 	var xCentroidArray = xField2.split(','); 
 	
	var yField2 = document.getElementById('avgPtOffsetsForm:centDefYs').value;
 	var yCentroidArray = yField2.split(','); 
   
 	// display coordiantes - centroid offsets
	var xField3 = document.getElementById('avgPtOffsetsForm:centroidOffsetXs').value;
 	var xOffsetArray = xField3.split(','); 
 	
	var yField3 = document.getElementById('avgPtOffsetsForm:centroidOffsetYs').value;
 	var yOffsetArray = yField3.split(','); 
   
	var offsetScale = parseFloat(document.getElementById('avgPtOffsetsForm:scaleSlider').value);
 	 
	// calculate max length of all offsets
	var maxLen = document.getElementById('avgPtOffsetsForm:maxOffset').value;

	
	// the max displayed length at 100% offset scale is sqrt(3)/2 * sideLen
	
	
	var scaleFactor = hexRadius / maxLen  // the max length will then be the length of the hexRadius
	
	//console.log("scaleFactor = " + scaleFactor + ", maxLen = " + maxLen)
	
	for (var i = 0; i < xHexCenterArray.length; i++) {
		
		var x = parseFloat(xHexCenterArray[i])
		var y = parseFloat(yHexCenterArray[i])
								
		drawHex(ctx, x, y, sideLen, i+1, drawSegments, drawSegNums)
	}
	
	for (var i = 0; i < xCentroidArray.length; i++) {
		
		var x = parseFloat(xCentroidArray[i])
		var y = parseFloat(yCentroidArray[i])
		
		var dx = x - (parseFloat(xOffsetArray[i]) * scaleFactor * offsetScale / 100.0)
		var dy = y + (parseFloat(yOffsetArray[i]) * scaleFactor * offsetScale / 100.0)
			
		//console.log("xOffsetArray[i] = " + xOffsetArray[i] + ", dx = " + dx);
		
		ctx.beginPath();
		ctx.strokeStyle = 'red';
	    ctx.moveTo(x, y);
	    ctx.lineTo(dx, dy);
	    ctx.stroke();
		
	    
		ctx.beginPath();
		ctx.strokeStyle = 'black';
		ctx.arc(x, y, 5, 0, 2*Math.PI);
		ctx.closePath();
		ctx.stroke();
		ctx.fillStyle = 'white';
	    ctx.fill();

	}
	
	// max len is the value assigned to a side in the key

	// add the key
	
	ctx.beginPath();
	ctx.strokeStyle = 'red';
    ctx.moveTo(850, 950);
    ctx.lineTo(850 + sideLen, 950);
    ctx.stroke();
   

	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();
    
	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850 + sideLen, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();   
    
	ctx.fillStyle = 'black';
	ctx.font="18px Arial";
	
	
	
	ctx.fillText((sideLen * 100.00 / (scaleFactor * offsetScale)).toFixed(2) + " pixels", 844, 940);
	
}

function drawHex(ctx, x, y, sideLen, number, drawSegment, drawSegNum) {
	// draw a hexgon of side sideLen centered on position x, y
	
	var a = sideLen
	var b = a * Math.sqrt(3) / 2;

	// 0 is the left side of hex, b + a/2 is the x center
	// 0 is the top of the hex, 
	
	
	//       (a/2, 0)
	//          ______________
	//         /
	//        /
	//       /
	//      /
	//     /
	//    (0,b)
	
	// the box is centered at a, b so we subtract these to get the center
	
	if (drawSegment) {
		ctx.beginPath();
		ctx.strokeStyle = '#888888';
    	ctx.moveTo(x-a,y)	
		ctx.lineTo(x-a/2,y-b)
    	ctx.lineTo(x+a/2,y-b)
    	ctx.lineTo(x+a,y)
    	ctx.lineTo(x+a/2,y+b)
    	ctx.lineTo(x-a/2,y+b)
		ctx.closePath();
		ctx.stroke();
	
		ctx.fillStyle = "#e8f0f8";
		ctx.fill();
	}
	
	if (drawSegNum) {
		ctx.fillStyle = '#888888';
		ctx.font="18px Arial";
		ctx.fillText(number, x-a + b/2, y + b/2);
	}
}


//]]>  
</script>

     		<h:inputHidden id="segCentDefXs" value="#{visualizationController.segCentDefXs}" />
			<h:inputHidden id="segCentDefYs" value="#{visualizationController.segCentDefYs}" />
			
 			<h:inputHidden id="maxOffset" value="#{visualizationController.maxAvgPtOffset}" />

    		<p:panelGrid columns="1" styleClass="pcsFormNoBorder" style="border:0px;max-width:330px" >			
 			<p:panelGrid id="cameraStatePanel" columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">


				<!-- TODO: ASK Mitch if we need these -->

				<h:outputLabel value="Rotation from Ref (rad)" />

				<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidStatsResult','EnclosedEnergy80')}" />

				<h:outputText value="#{visualizationController.avgPtCentroidOffsetsDisplayValues.avgPtCentroidStatsResult.enclosedEnergy80}" style="position:relative; top:2px" >
					<f:converter converterId="DynamicNumberConverter" />

				<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidStatsResult','MaxOffset')}" />

				<p:spacer width="1" height="120"/><p:spacer width="1" height="120"/>

     			<p:selectBooleanButton value="#{visualizationController.showSegNums}" onLabel="On" offLabel="Off" >

    		</h:form>
