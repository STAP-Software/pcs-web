<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

<script type="text/javascript">  
//<![CDATA[

var avgSufsSideLen = 100
var avgSufsHexRadius = (Math.sqrt(3.0)/2.0) * avgSufsSideLen
           
var resizing = false;   

function runDrawAvgSufsOffsets() {

	var c = document.getElementById("avgSufsOffsetsCanvas");
	var ctx = c.getContext("2d");

	ctx.translate(-25,-10);

	window.setTimeout("drawAvgSufsCentroidOffsets()", 10);
	
	$(PF('avgSufsCentroidOffsetDisplayDialog').jqId).bind('resize', function(){
		if (!resizing) {
			resizing = true;
			window.setTimeout("avgSufsCentroidOffsetsResizeHandler()", 100);
		}
	})
}

function avgSufsCentroidOffsetsResizeHandler() {

	var c = document.getElementById("avgSufsOffsetsCanvas");
	var rightPanel = document.getElementById("avgSufsOffsetsForm:avgSufsCentroidOffsetsRightPanel");
	var dlgWrapper = document.getElementById("avgSufsCentroidOffsetDialog").closest('.ui-dialog');

	c.style.width = "0px";
	c.style.height = "0px";

	var availableWidth = dlgWrapper.offsetWidth - rightPanel.offsetWidth - 30 - 48;
	var availableHeight = dlgWrapper.offsetHeight - 128;
	var available = Math.max(750, Math.min(availableWidth, availableHeight));

	c.width = available;
	c.height = available;
	c.style.width = available + "px";
	c.style.height = available + "px";

	var ctx = c.getContext("2d");
	var scale = available / 1000.0;
	ctx.scale(scale, scale);
	ctx.translate(-25, -10);

	drawAvgSufsCentroidOffsets();

	resizing = false;
}

function drawAvgSufsCentroidOffsets() {
    	
	var c = document.getElementById("avgSufsOffsetsCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,1000,1000);

	var xField2 = document.getElementById('avgSufsOffsetsForm:centDefXs').value;
 	var xCentroidArray = xField2.split(','); 
 	
	var yField2 = document.getElementById('avgSufsOffsetsForm:centDefYs').value;
 	var yCentroidArray = yField2.split(','); 
   
	var xField3 = document.getElementById('avgSufsOffsetsForm:centroidOffsetXs').value;
 	var xOffsetArray = xField3.split(','); 
 	
	var yField3 = document.getElementById('avgSufsOffsetsForm:centroidOffsetYs').value;
 	var yOffsetArray = yField3.split(','); 
   
	var field4 = document.getElementById('avgSufsOffsetsForm:goodSpots').value;
 	var goodSpotsArray = field4.split(','); 

	var offsetScale = parseFloat(document.getElementById('avgSufsOffsetsForm:scaleSlider').value);
 	 
	var maxLen = document.getElementById('avgSufsOffsetsForm:maxOffset').value;

	var segmentWidth = 1.0;

	var scaleFactor = avgSufsHexRadius / maxLen;
	
	for (var i = 0; i < xCentroidArray.length; i++) {
		
		var x = (parseFloat(-xCentroidArray[i]) + segmentWidth) * 500;
		var y = (parseFloat(yCentroidArray[i]) + segmentWidth) * 500;
		
		if (goodSpotsArray[i] == 0) {

			ctx.beginPath();
			ctx.strokeStyle = 'black';
			ctx.arc(x, y, 5, 0, 2*Math.PI);
			ctx.closePath();
			ctx.stroke();
			ctx.fillStyle = 'lightgrey';
		    ctx.fill();

		} else {

			var dx = x - (parseFloat(xOffsetArray[i]) * scaleFactor * offsetScale / 100.0);
			var dy = y + (parseFloat(yOffsetArray[i]) * scaleFactor * offsetScale / 100.0);
				
			ctx.beginPath();
			ctx.strokeStyle = 'red';
		    ctx.moveTo(x, y);
		    ctx.lineTo(dx, dy);
		    ctx.stroke();
			    
			ctx.beginPath();
			ctx.strokeStyle = 'black';
			ctx.arc(x, y, 5, 0, 2*Math.PI);
			ctx.closePath();
			ctx.stroke();
			ctx.fillStyle = 'white';
		    ctx.fill();
		}
	}
	
	// add the key
	ctx.beginPath();
	ctx.strokeStyle = 'red';
    ctx.moveTo(850, 950);
    ctx.lineTo(850 + avgSufsSideLen, 950);
    ctx.stroke();

	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();
    
	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850 + avgSufsSideLen, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();   
    
	ctx.fillStyle = 'black';
	ctx.font="18px Arial";
	ctx.fillText((avgSufsSideLen * 100.00 / (scaleFactor * offsetScale)).toFixed(2) + " pixels", 844, 940);
}


//]]>  
</script>   


	<p:dialog id="avgSufsCentroidOffsetDialog" header="SUFS Avg Centroid Offsets" widgetVar="avgSufsCentroidOffsetDisplayDialog" closable="false"
	          width="1235" height="924">
		<h:form id="avgSufsOffsetsForm">

			<h:inputHidden id="centroidOffsetXs" value="#{visualizationController.centroidOffsetXs}" />
			<h:inputHidden id="centroidOffsetYs" value="#{visualizationController.centroidOffsetYs}" />
			<h:inputHidden id="goodSpots" value="#{visualizationController.goodSpots}" />
			<h:inputHidden id="centDefXs" value="#{visualizationController.centDefXs}" />
			<h:inputHidden id="centDefYs" value="#{visualizationController.centDefYs}" />
			<h:inputHidden id="maxOffset" value="#{visualizationController.maxAvgSufsOffset}" />

			<!-- outer flex row: canvas on the left, controls on the right -->
			<h:panelGroup layout="block" style="display:flex; flex-direction:row; gap:30px; align-items:flex-start; width:100%; justify-content:space-between;">

				<canvas id="avgSufsOffsetsCanvas" width="1000" height="1000"
				        style="width:750px; height:750px; flex-shrink:0;">
					Your browser does not support the HTML5 canvas tag.
				</canvas>

				<!-- right panel: vertical flex column -->
				<h:panelGroup id="avgSufsCentroidOffsetsRightPanel" layout="block" style="flex:0 0 auto; display:flex; flex-direction:column; gap:10px;">

					<p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder ui-panelgrid-blank" columnClasses="btmsFormLabelColumn, btmsFormInputColumn" style="white-space:nowrap;">

						<p:spacer height="15"/><p:spacer height="15"/>

						<h:outputLabel value="SUFS Group Number" />
						<h:outputText value="#{procedureController.procedure.procedureConfigSet.procedureConfig.sufsGroup}" style="position:relative; top:2px" />

						<h:outputLabel value="Group Segment Number" />
						<h:outputText value="#{visualizationController.avgSufsGroupSegmentNumber+1}" style="position:relative; top:2px" />

						<h:outputLabel value="Mirror Segment Number" />
						<h:outputText value="#{constantsCache.sufsConstants.sufsGroupToMirror[procedureController.procedure.procedureConfigSet.procedureConfig.sufsGroup-1][visualizationController.avgSufsGroupSegmentNumber]}" style="position:relative; top:2px" />

						<p:spacer height="25"/><p:spacer height="25"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('SufsCentroidStatsResult','RmsOffset')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.avgSufsCentroidOffsetsDisplayValues.sufsCentroidStatsResult.rmsOffset[visualizationController.avgSufsGroupSegmentNumber]}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('SufsCentroidStatsResult','EnclosedEnergy80')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.avgSufsCentroidOffsetsDisplayValues.sufsCentroidStatsResult.enclosedEnergy80[visualizationController.avgSufsGroupSegmentNumber]}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('SufsCentroidStatsResult','MaxOffset')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.avgSufsCentroidOffsetsDisplayValues.sufsCentroidStatsResult.maxOffset[visualizationController.avgSufsGroupSegmentNumber]}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<h:outputLabel value="Subimage with Max Offset" />
						<h:outputText value="#{visualizationController.avgSufsCentroidOffsetsDisplayValues.sufsCentroidStatsResult.maxSpotNum[visualizationController.avgSufsGroupSegmentNumber]}" style="position:relative; top:2px" />

						<p:spacer height="15"/><p:spacer height="15"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('StartupComputationsResult','arcsecPerPixel')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<h:outputText value="#{procedureController.procedure.procedureOutput.startupComputationsResult.arcsecPerPixel}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<p:spacer height="10"/><p:spacer height="10"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('SufsSegmentZernikeStatsResult','ZernikeMeans')}" />
						<c:forEach var="zernikeMean" items="#{visualizationController.avgSufsCentroidOffsetsDisplayValues.sufsSegmentZernikeStatsResult.zernikeMeans[visualizationController.avgSufsGroupSegmentNumber]}" varStatus="loop" end="9">
							<c:set var="zernikeEom" value="#{visualizationController.avgSufsCentroidOffsetsDisplayValues.sufsSegmentZernikeStatsResult.zernikeEoms[visualizationController.avgSufsGroupSegmentNumber][loop.index]}"/>
							<h:outputLabel value="#{fieldMetaData.displayLabel} #{loop.index+1} Mean +- EOM (#{fieldMetaData.units}) " rendered="#{zernikeMean!=0.0 and (loop.index gt 2) and (loop.index lt 10)}"/>
							<h:panelGroup rendered="#{zernikeMean!=0.0 and (loop.index gt 2) and (loop.index lt 10)}">
								<h:outputText value="#{zernikeMean}">
									<f:converter converterId="DynamicNumberConverter" />
									<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
								</h:outputText>
								<h:outputText value=" +- " />
								<h:outputText value="#{zernikeEom}">
									<f:converter converterId="DynamicNumberConverter" />
									<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
								</h:outputText>
							</h:panelGroup>
						</c:forEach>

						<p:spacer height="10"/><p:spacer height="10"/>

					</p:panelGrid>

					<!-- slider below the grid -->
					<h:panelGroup layout="block" style="width:100%; padding-top:10px; padding-left:10px; padding-right:10px; box-sizing:border-box;">
						<h:outputText id="scaleOutput" value="Offset scale: #{visualizationController.offsetScale}%" />
						<br/>
						<p:spacer height="10"/>
						<h:inputHidden id="scaleSlider" value="#{visualizationController.offsetScale}" />
						<p:slider for="scaleSlider" display="scaleOutput" minValue="0" maxValue="300" displayTemplate="Offset scale: {value}%">
							<p:ajax event="slideEnd" listener="#{visualizationController.updateAvgSufsCentroidOffsetDisplayListener}" />
						</p:slider>
					</h:panelGroup>

				</h:panelGroup>

			</h:panelGroup>

			<br/>

			<h:panelGroup styleClass="dialogCommandGroup">
				<p:commandButton value="Abort" styleClass="dialogbutton" update=":growl :errorGrowl"
						action="#{asyncController.doCloseGraphicsDisplayAbort}" oncomplete="PF('avgSufsCentroidOffsetDisplayDialog').hide()" rendered="#{sessionController.procedureExecuting}"/>
				<p:commandButton id="closeButton" value="Close" styleClass="dialogbutton" update=":growl :errorGrowl"
						action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="PF('avgSufsCentroidOffsetDisplayDialog').hide()" />
				<p:commandButton id="nextButton" value="Next &gt;&gt;" styleClass="dialogbutton" update="avgSufsOffsetsForm :growl :errorGrowl"
						action="#{visualizationController.doAvgSufsCentroidOffsetsNext}" oncomplete="runDrawAvgSufsOffsets()" />
				<p:commandButton id="backButton" value="&lt;&lt; Back" styleClass="dialogbutton" update="avgSufsOffsetsForm :growl :errorGrowl"
						action="#{visualizationController.doAvgSufsCentroidOffsetsBack}" oncomplete="runDrawAvgSufsOffsets()" />
			</h:panelGroup>

		</h:form>
	</p:dialog>


</ui:composition>
