<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panelGrid id="cameraStatePanel" columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

		<h:outputLabel value="Pupil Mask" />
		<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />

		<h:outputLabel value="Filter" />
		<h:outputText value="#{procedureController.frameInstrument.camera.filterWheel.stateDisplayString}" style="position:relative; top:2px" />

		<h:outputLabel value="Ref. Beam" />
		<h:outputText value="#{procedureController.frameInstrument.camera.currentRefBeamDisplayString}" style="position:relative; top:2px" />

		<h:outputLabel value="Shutter" />
		<h:outputText value="#{procedureController.frameInstrument.camera.shutter.shutterDisplayString}" style="position:relative; top:2px" />

		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','TiltPlateX')}" />						
		<h:outputLabel value="Fine Tilt (x, y) (#{fieldMetaData.units})" />
		<h:panelGroup style="position:relative; top:3px">
			<h:outputText value="#{procedureController.frameInstrument.camera.fineTiltMirror.stateXDisplayString}" />
			<h:outputText value=", " />
			<h:outputText value="#{procedureController.frameInstrument.camera.fineTiltMirror.stateYDisplayString}" />
		</h:panelGroup>

		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','SteeringMirrorX')}" />				
		<h:outputLabel value="Coarse Tilt (x, y) (#{fieldMetaData.units})" />
		<h:panelGroup style="position:relative; top:3px">
			<h:outputText value="#{procedureController.frameInstrument.camera.coarseTiltMirror.stateXDisplayString}" />
			<h:outputText value=", " />
			<h:outputText value="#{procedureController.frameInstrument.camera.coarseTiltMirror.stateYDisplayString}" />
		</h:panelGroup>

		<h:outputLabel value="Two Position Mech" />
		<h:outputText value="#{procedureController.frameInstrument.camera.twoPosMechanism.displayString}" style="position:relative; top:2px" />

		<h:outputLabel value="CCD Power" />
		<h:outputText value="#{procedureController.frameInstrument.ccd.displayString}" style="position:relative; top:2px" />

		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','CcdTemp')}" />				
		<h:outputLabel value="CCD Temp (#{fieldMetaData.units})" />
		<h:outputText value="#{procedureController.frameInstrument.ccd.temperature}" style="position:relative; top:2px" >
			<f:converter converterId="DynamicNumberConverter" />
			<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
		</h:outputText>

		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BenchTemp')}" />				
		<h:outputLabel value="Instrument Temp (#{fieldMetaData.units})" />
		<h:outputText value="#{procedureController.frameInstrument.camera.instrumentTemperature}" style="position:relative; top:2px" >
			<f:converter converterId="DynamicNumberConverter" />
			<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
		</h:outputText>

		<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BoxTemp')}" />				
		<h:outputLabel value="Electronics Box Temp (#{fieldMetaData.units})" />
		<h:outputText value="#{procedureController.frameInstrument.camera.electronicsBoxTemperature}" style="position:relative; top:2px" >
			<f:converter converterId="DynamicNumberConverter" />
			<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
		</h:outputText>



	</p:panelGrid>



</ui:composition>
