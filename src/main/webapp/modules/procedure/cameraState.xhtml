<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:outputPanel id="cameraStatePanel" style="padding: 16px;">

    	<div class="label-input-grid" 
         	style="display: grid; grid-template-columns: max-content max-content;
                align-items: baseline; 
                row-gap: 24px; column-gap: 24px;">

			<h:outputLabel value="Overall Status" />
			<h:outputText value="#{procedureController.frameInstrument.camera.overallStatusDisplayString}" />

			<h:outputLabel value="Pupil Mask" />
			<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" />

			<h:outputLabel value="Filter" />
			<h:outputText value="#{procedureController.frameInstrument.camera.filterWheel.stateDisplayString}" />

			<h:outputLabel value="Ref. Beam" />
			<h:outputText value="#{procedureController.frameInstrument.camera.currentRefBeamDisplayString}" />


			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','TiltPlateX')}" />						
			<h:outputLabel value="Fine Pupil Adj (x, y) (#{fieldMetaData.units})" />
			<h:outputText value="#{procedureController.frameInstrument.camera.fineTiltMirror.stateXDisplayString}, #{procedureController.frameInstrument.camera.fineTiltMirror.stateYDisplayString}" />

			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','SteeringMirrorX')}" />				
			<h:outputLabel value="Coarse Pupil Adj (x, y) (#{fieldMetaData.units})" />
			<h:outputText value="#{procedureController.frameInstrument.camera.coarseTiltMirror.stateXDisplayString}, #{procedureController.frameInstrument.camera.coarseTiltMirror.stateYDisplayString}" />

			<h:outputLabel value="Two Position Mech" />
			<h:outputText value="#{procedureController.frameInstrument.camera.twoPosMechanism.displayString}" />

			<h:outputLabel value="CCD Power" />
			<h:outputText value="#{procedureController.frameInstrument.ccd.displayString}" />
			
			<h:outputLabel value="CCD Gain" />
			<h:outputText value="#{procedureController.frameInstrument.ccd.ccdGain.gainDisplay}" />

			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','CcdTemp')}" />				
			<h:outputLabel value="CCD Temp (L,R) (#{fieldMetaData.units})" />
			<h:panelGroup style="align-self:center">
				<h:outputText value="#{procedureController.frameInstrument.ccd.leftTemperature}" >
					<f:converter converterId="DynamicNumberConverter" />
					<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
				</h:outputText>
				<h:outputText value=", "  />
				<h:outputText value="#{procedureController.frameInstrument.ccd.rightTemperature}" >
					<f:converter converterId="DynamicNumberConverter" />
					<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
				</h:outputText>
			</h:panelGroup>

			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BenchTemp')}" />				
			<h:outputLabel value="Instrument Temp (#{fieldMetaData.units})" />
			<h:outputText value="#{procedureController.frameInstrument.camera.instrumentTemperature}" >
				<f:converter converterId="DynamicNumberConverter" />
				<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
			</h:outputText>

			<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','BoxTemp')}" />				
			<h:outputLabel value="Electronics Box Temp (#{fieldMetaData.units})" />
			<h:outputText value="#{procedureController.frameInstrument.camera.electronicsBoxTemperature}" >
				<f:converter converterId="DynamicNumberConverter" />
				<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
			</h:outputText>
		</div>

	</p:outputPanel>


</ui:composition>
