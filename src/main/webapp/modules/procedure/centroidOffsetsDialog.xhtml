<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

<script type="text/javascript">  
//<![CDATA[

var newSideLen = 67

var hexRadius = (Math.sqrt(3.0)/2.0) * newSideLen
           
var resizing = false;   

var centOffScope = {drawSegments: true, drawSegNums: true};


function runDrawOffsets() {

	var c = document.getElementById("offsetsCanvas");
	var ctx = c.getContext("2d");

	ctx.translate(-25, -10);

	window.setTimeout("drawCentroidOffsets(true,true)", 10);
	
	$(PF('centroidOffsetDisplayDialog').jqId).bind('resize', function(){
		if (!resizing) {
			resizing = true;
			window.setTimeout("centroidOffsetsResizeHandler()", 100);
		}
	})
}

function centroidOffsetsResizeHandler() {

	var c = document.getElementById("offsetsCanvas");
	var rightPanel = document.getElementById("offsetsForm:centroidOffsetsRightPanel");
	var dlgWrapper = document.getElementById("centroidOffsetDialog").closest('.ui-dialog');

	c.style.width = "0px";
	c.style.height = "0px";

	var availableWidth = dlgWrapper.offsetWidth - rightPanel.offsetWidth - 30 - 48;
	var availableHeight = dlgWrapper.offsetHeight - 128;
	var available = Math.max(750, Math.min(availableWidth, availableHeight));

	c.width = available;
	c.height = available;
	c.style.width = available + "px";
	c.style.height = available + "px";

	var ctx = c.getContext("2d");
	var scale = available / 1000.0;
	ctx.scale(scale, scale);
	ctx.translate(-25, -10);

	drawCentroidOffsets(centOffScope.drawSegments, centOffScope.drawSegNums);

	resizing = false;
}

function drawCentroidOffsets(drawSegments,drawSegNums) {
    
	centOffScope.drawSegNums = drawSegNums;
	centOffScope.drawSegments = drawSegments;
	
	var c = document.getElementById("offsetsCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,1000,1000);

	var xField1 = document.getElementById('offsetsForm:segCentDefXs').value;
 	var xHexCenterArray = xField1.split(','); 
 	
	var yField1 = document.getElementById('offsetsForm:segCentDefYs').value;
 	var yHexCenterArray = yField1.split(','); 
 	
	var xField2 = document.getElementById('offsetsForm:centDefXs').value;
 	var xCentroidArray = xField2.split(','); 
 	
	var yField2 = document.getElementById('offsetsForm:centDefYs').value;
 	var yCentroidArray = yField2.split(','); 
   
	var xField3 = document.getElementById('offsetsForm:centroidOffsetXs').value;
 	var xOffsetArray = xField3.split(','); 
 	
	var yField3 = document.getElementById('offsetsForm:centroidOffsetYs').value;
 	var yOffsetArray = yField3.split(','); 
   
	var field4 = document.getElementById('offsetsForm:goodSpots').value;
 	var goodSpotsArray = field4.split(','); 
   
	var offsetScale = parseFloat(document.getElementById('offsetsForm:scaleSlider').value);
 	 
	var maxLen = document.getElementById('offsetsForm:maxOffset').value;

	var scaleFactor = hexRadius / maxLen;
	
	for (var i = 0; i < xHexCenterArray.length; i++) {
		
		var x = parseFloat(xHexCenterArray[i]);
		var y = parseFloat(yHexCenterArray[i]);
				
		drawHex(ctx, x, y, newSideLen, i+1, drawSegments, drawSegNums);
	}
	
	for (var i = 0; i < xCentroidArray.length; i++) {
		
		var x = parseFloat(xCentroidArray[i]);
		var y = parseFloat(yCentroidArray[i]);
		
		if (goodSpotsArray[i] == 0) {

			ctx.beginPath();
			ctx.strokeStyle = 'black';
			ctx.arc(x, y, 5, 0, 2*Math.PI);
			ctx.closePath();
			ctx.stroke();
			ctx.fillStyle = 'lightgrey';
		    ctx.fill();

		} else {
			
			var dx = x - (parseFloat(xOffsetArray[i]) * scaleFactor * offsetScale / 100.0);
			var dy = y + (parseFloat(yOffsetArray[i]) * scaleFactor * offsetScale / 100.0);
				
			ctx.beginPath();
			ctx.strokeStyle = 'red';
		    ctx.moveTo(x, y);
		    ctx.lineTo(dx, dy);
		    ctx.stroke();
			    
			ctx.beginPath();
			ctx.strokeStyle = 'black';
			ctx.arc(x, y, 5, 0, 2*Math.PI);
			ctx.closePath();
			ctx.stroke();
			ctx.fillStyle = 'white';
		    ctx.fill();
		}
	}
	
	// add the key
	ctx.beginPath();
	ctx.strokeStyle = 'red';
    ctx.moveTo(850, 950);
    ctx.lineTo(850 + newSideLen, 950);
    ctx.stroke();

	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();
    
	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850 + newSideLen, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();   
    
	ctx.fillStyle = 'black';
	ctx.font="18px Arial";
	ctx.fillText((newSideLen * 100.00 / (scaleFactor * offsetScale)).toFixed(2) + " pixels", 844, 940);
}

function drawHex(ctx, x, y, newSideLen, number, drawSegment, drawSegNum) {
	
	var a = newSideLen;
	var b = a * Math.sqrt(3) / 2;

	if (drawSegment) {
		ctx.beginPath();
		ctx.strokeStyle = '#888888';
    	ctx.moveTo(x-a,y);
		ctx.lineTo(x-a/2,y-b);
    	ctx.lineTo(x+a/2,y-b);
    	ctx.lineTo(x+a,y);
    	ctx.lineTo(x+a/2,y+b);
    	ctx.lineTo(x-a/2,y+b);
		ctx.closePath();
		ctx.stroke();
	
		ctx.fillStyle = "#e8f0f8";
		ctx.fill();
	}
	
	if (drawSegNum) {
		ctx.fillStyle = '#888888';
		ctx.font="18px Arial";
		ctx.fillText(number, x-a + b/2, y + b/2);
	}
}


//]]>  
</script>   


	<p:dialog id="centroidOffsetDialog" header="Centroid Offsets" widgetVar="centroidOffsetDisplayDialog" closable="false"
	          width="1232">
		<h:form id="offsetsForm">

			<h:inputHidden id="centroidOffsetXs" value="#{visualizationController.centroidOffsetXs}" />
			<h:inputHidden id="centroidOffsetYs" value="#{visualizationController.centroidOffsetYs}" />
			<h:inputHidden id="goodSpots" value="#{visualizationController.goodSpots}" />
			<h:inputHidden id="centDefXs" value="#{visualizationController.centDefXs}" />
			<h:inputHidden id="centDefYs" value="#{visualizationController.centDefYs}" />
			<h:inputHidden id="segCentDefXs" value="#{visualizationController.segCentDefXs}" />
			<h:inputHidden id="segCentDefYs" value="#{visualizationController.segCentDefYs}" />
			<h:inputHidden id="maxOffset" value="#{visualizationController.maxOffset}" />

			<!-- outer flex row: canvas on the left, controls on the right -->
			<h:panelGroup layout="block" style="display:flex; flex-direction:row; gap:30px; align-items:flex-start; width:100%; justify-content:space-between;">

				<canvas id="offsetsCanvas" width="1000" height="1000"
				        style="width:750px; height:750px; flex-shrink:0;">
					Your browser does not support the HTML5 canvas tag.
				</canvas>

				<!-- right panel: vertical flex column -->
				<h:panelGroup id="centroidOffsetsRightPanel" layout="block" style="flex:0 0 auto; display:flex; flex-direction:column; gap:10px;">

					<p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder ui-panelgrid-blank" columnClasses="btmsFormLabelColumn, btmsFormInputColumn" style="white-space:nowrap;">

						<p:spacer height="15"/><p:spacer height="15"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidOffsetsResult','ImageTranslation')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units}) (x,y)" />
						<h:panelGroup>
							<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidOffsetsResult.imageTranslation.x}" style="position:relative; top:2px">
								<f:converter converterId="DynamicNumberConverter" />
								<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
							</h:outputText>
							<h:outputText value=", " />
							<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidOffsetsResult.imageTranslation.y}" style="position:relative; top:2px">
								<f:converter converterId="DynamicNumberConverter" />
								<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
							</h:outputText>
						</h:panelGroup>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidOffsetsResult','ImageRotation')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidOffsetsResult.imageRotation}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidOffsetsResult','ImageScale')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidOffsetsResult.imageScale}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<p:spacer height="15"/><p:spacer height="15"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidStatsResult','RmsOffset')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidStatsResult.rmsOffset}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidStatsResult','EnclosedEnergy80')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidStatsResult.enclosedEnergy80}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CentroidStatsResult','MaxOffset')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidStatsResult.maxOffset}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<h:outputLabel value="Segment with Max Offset" rendered="#{procedureController.procedure.procedureType.passiveTilt}"/>
						<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.centroidStatsResult.maxSpotNum}" style="position:relative; top:2px" rendered="#{procedureController.procedure.procedureType.passiveTilt}"/>

						<p:spacer height="10"/><p:spacer height="10"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('StartupComputationsResult','arcsecPerPixel')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<h:outputText value="#{procedureController.procedure.procedureOutput.startupComputationsResult.arcsecPerPixel}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<p:spacer height="30"/><p:spacer height="30"/>

						<h:outputLabel value="Show Segments" />
						<p:selectBooleanButton value="#{visualizationController.showSegments}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateCentroidOffsetDisplayListener}" />
						</p:selectBooleanButton>

						<p:spacer height="1"/><p:spacer height="1"/>

						<h:outputLabel value="Show Segment Numberings" />
						<p:selectBooleanButton value="#{visualizationController.showSegNums}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateCentroidOffsetDisplayListener}" />
						</p:selectBooleanButton>

					</p:panelGrid>

					<!-- slider below the grid -->
					<h:panelGroup layout="block" style="width:100%; padding-top:10px;">
						<h:outputText id="scaleOutput" value="Offset scale: #{visualizationController.offsetScale}%" />
						<br/>
						<p:spacer height="10"/>
						<h:inputHidden id="scaleSlider" value="#{visualizationController.offsetScale}" />
						<p:slider for="scaleSlider" display="scaleOutput" minValue="0" maxValue="300" displayTemplate="Offset scale: {value}%">
							<p:ajax event="slideEnd" listener="#{visualizationController.updateCentroidOffsetDisplayListener}" />
						</p:slider>
					</h:panelGroup>

				</h:panelGroup>

			</h:panelGroup>

			<br/>

			<h:panelGroup styleClass="dialogCommandGroup">
				<p:commandButton value="Abort" styleClass="dialogbutton" update=":growl :errorGrowl"
						action="#{asyncController.doCloseGraphicsDisplayAbort}" oncomplete="PF('centroidOffsetDisplayDialog').hide()" rendered="#{sessionController.procedureExecuting}"/>
				<p:commandButton id="closeButton" value="Close" styleClass="dialogbutton" update=":growl :errorGrowl"
						action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="PF('centroidOffsetDisplayDialog').hide()" />
			</h:panelGroup>

		</h:form>
	</p:dialog>


</ui:composition>
