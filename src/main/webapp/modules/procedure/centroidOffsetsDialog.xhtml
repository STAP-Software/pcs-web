<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<script type="text/javascript">  
//<![CDATA[


           
function runDrawOffsets() {

	var c = document.getElementById("offsetsCanvas");
	var ctx = c.getContext("2d");

	ctx.translate(-25,-10);
	ctx.scale(0.61, 0.61);

	window.setTimeout("drawCentroidOffsets(true,true)", 10);
}

function drawCentroidOffsets(drawSegments,drawSegNums) {
    
	var c = document.getElementById("offsetsCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,1000,1000);


	
	var xField = document.getElementById('offsetsForm:centDefXs').value;
 	var xArray = xField.split(','); 
 	
	var yField = document.getElementById('offsetsForm:centDefYs').value;
 	var yArray = yField.split(','); 
   
	
	for (var i = 0; i < xArray.length; i++) {
		
		var x = parseInt(xArray[i])
		var y = parseInt(yArray[i])
		
		drawHex(ctx, x, y, 77, i+1, drawSegments, drawSegNums)
		
			
		var dx = x + ((Math.random() * 2.0) - 1.0) * 30.0;
		var dy = y + ((Math.random() * 2.0) - 1.0) * 30.0;

		ctx.beginPath();
		ctx.strokeStyle = 'red';
	    ctx.moveTo(x, y);
	    ctx.lineTo(dx, dy);
	    ctx.stroke();
		
	    
		ctx.beginPath();
		ctx.strokeStyle = 'black';
		ctx.arc(x, y, 5, 0, 2*Math.PI);
		ctx.closePath();
		ctx.stroke();
		ctx.fillStyle = 'white';
	    ctx.fill();

	}
	
	// add the key
	
	ctx.beginPath();
	ctx.strokeStyle = 'red';
    ctx.moveTo(850, 950);
    ctx.lineTo(900, 950);
    ctx.stroke();
   

	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();
    
	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(900, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();   
    
	ctx.fillStyle = 'black';
	ctx.font="18px Arial";
	ctx.fillText("3 pixels", 844, 940);
	
}

function drawHex(ctx, x, y, sideLen, number, drawSegment, drawSegNum) {
	// draw a hexgon of side sideLen centered on position x, y
	
	var a = sideLen
	var b = a * Math.sqrt(3) / 2;

	// 0 is the left side of hex, b + a/2 is the x center
	// 0 is the top of the hex, 
	
	
	//       (a/2, 0)
	//          ______________
	//         /
	//        /
	//       /
	//      /
	//     /
	//    (0,b)
	
	// the box is centered at a, b so we subtract these to get the center
	
	if (drawSegment) {
		ctx.beginPath();
		ctx.strokeStyle = '#888888';
    	ctx.moveTo(x-a,y)	
		ctx.lineTo(x-a/2,y-b)
    	ctx.lineTo(x+a/2,y-b)
    	ctx.lineTo(x+a,y)
    	ctx.lineTo(x+a/2,y+b)
    	ctx.lineTo(x-a/2,y+b)
		ctx.closePath();
		ctx.stroke();
	
		ctx.fillStyle = "#e8f0f8";
		ctx.fill();
	}
	
	if (drawSegNum) {
		ctx.fillStyle = '#888888';
		ctx.font="18px Arial";
		ctx.fillText(number, x-a + b/2, y + b/2);
	}
}


//]]>  
</script>

     		<h:form id="offsetsForm">

			      		
    		<h:inputHidden id="centroidXs" value="#{procedureController.centroidXs}" />
			<h:inputHidden id="centroidYs" value="#{procedureController.centroidYs}" />

     		<h:inputHidden id="centDefXs" value="#{visualizationTools.centDefXs}" />
			<h:inputHidden id="centDefYs" value="#{visualizationTools.centDefYs}" />
    			
    		<p:panelGrid columns="2" styleClass="pcsFormNoBorder">
    		<canvas id="offsetsCanvas" width="600px" height="600px" style="border:0px solid #d3d3d3;"> Your browser does not support the HTML5 canvas tag.</canvas>
    		
			<p:panelGrid id="cameraStatePanel" columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

				<h:outputLabel value="Translation from Ref (x,y)" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="Rotation from Ref (rad)" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="Scale change from Ref" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				
				<p:spacer height="15"/><p:spacer height="15"/>
				<h:outputLabel value="Arcsec/pixel" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="Scale Error" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="80% Enclosed Energy" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="50% Enclosed Energy" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />

				<p:spacer height="15"/><p:spacer height="15"/>
				<h:outputLabel value="RMS Error [1-18]" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="RMS Error [18-36]" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="Total RMS Error" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />

				<p:spacer height="15"/><p:spacer height="15"/>
				<h:outputLabel value="Max Error (pixels)" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				<h:outputLabel value="Segment with Max Error" />
				<h:outputText value="#{procedureController.frameInstrument.camera.pupilWheel.stateDisplayString}" style="position:relative; top:2px" />
				
				<p:spacer height="40"/><p:spacer height="40"/>
				<h:outputLabel value="Show Segments" />
     			<p:selectBooleanButton value="#{visualizationTools.showSegments}" onLabel="On" offLabel="Off" >
    				<p:ajax update="@this" listener="#{visualizationTools.showSegmentListener}" />
    			</p:selectBooleanButton>
				<p:spacer height="1"/><p:spacer height="1"/>
				<h:outputLabel value="Show Segment Numberings" />
     			<p:selectBooleanButton value="#{visualizationTools.showSegNums}" onLabel="On" offLabel="Off" >
    				<p:ajax update="@this" listener="#{visualizationTools.showSegmentListener}" />
    			</p:selectBooleanButton>
    			
    		</p:panelGrid>
    		</p:panelGrid>
    		<br/>
			<p:commandButton id="closeButton" value="Close" style="float:right" update=":growl"
					action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="centroidOffsetDisplayDialog.hide()" />
    		</h:form>
		</p:dialog> 


</ui:composition>
