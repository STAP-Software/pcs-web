<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<script type="text/javascript">  
//<![CDATA[

var sideLen = 77
var hexRadius = (Math.sqrt(3.0)/2.0) * sideLen
           
function runDrawOffsets() {

	var c = document.getElementById("offsetsCanvas");
	var ctx = c.getContext("2d");

	ctx.translate(-25,-10);
	ctx.scale(0.61, 0.61);

	window.setTimeout("drawCentroidOffsets(true,true)", 10);
}

function drawCentroidOffsets(drawSegments,drawSegNums) {
    
	var c = document.getElementById("offsetsCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,1000,1000);


	// display coordinates
	var xField1 = document.getElementById('offsetsForm:centDefXs').value;
 	var xHexCenterArray = xField1.split(','); 
 	
	var yField1 = document.getElementById('offsetsForm:centDefYs').value;
 	var yHexCenterArray = yField1.split(','); 
   
	var xField2 = document.getElementById('offsetsForm:centroidOffsetXs').value;
 	var xOffsetArray = xField2.split(','); 
 	
	var yField2 = document.getElementById('offsetsForm:centroidOffsetYs').value;
 	var yOffsetArray = yField2.split(','); 
   
	var offsetScale = parseFloat(document.getElementById('offsetsForm:scaleSlider').value);
 	 
	// calculate max length of all offsets
	var maxLen = 0.0;
	for (var i = 0; i < xOffsetArray.length; i++) {
		
		var x = parseFloat(xOffsetArray[i])
		var y = parseFloat(yOffsetArray[i])

		var len = Math.sqrt(x*x + y*y)
				
		if (maxLen < len) maxLen = len
	}
	
	// the max displayed length at 100% offset scale is sqrt(3)/2 * sideLen
	
	
	var scaleFactor = hexRadius / maxLen  // the max length will then be the length of the hexRadius
	
	for (var i = 0; i < xHexCenterArray.length; i++) {
		
		var x = parseFloat(xHexCenterArray[i])
		var y = parseFloat(yHexCenterArray[i])
		
		var dx = x + (parseFloat(xOffsetArray[i]) * scaleFactor * offsetScale / 100.0)
		var dy = y + (parseFloat(yOffsetArray[i]) * scaleFactor * offsetScale / 100.0)
						
		drawHex(ctx, x, y, sideLen, i+1, drawSegments, drawSegNums)
		
		ctx.beginPath();
		ctx.strokeStyle = 'red';
	    ctx.moveTo(x, y);
	    ctx.lineTo(dx, dy);
	    ctx.stroke();
		
	    
		ctx.beginPath();
		ctx.strokeStyle = 'black';
		ctx.arc(x, y, 5, 0, 2*Math.PI);
		ctx.closePath();
		ctx.stroke();
		ctx.fillStyle = 'white';
	    ctx.fill();

	}
	
	// max len is the value assigned to a side in the key

	// add the key
	
	ctx.beginPath();
	ctx.strokeStyle = 'red';
    ctx.moveTo(850, 950);
    ctx.lineTo(850 + sideLen, 950);
    ctx.stroke();
   

	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();
    
	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850 + sideLen, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();   
    
	ctx.fillStyle = 'black';
	ctx.font="18px Arial";
	
	
	
	ctx.fillText((sideLen * 100.00 / (scaleFactor * offsetScale)).toFixed(2) + " pixels", 844, 940);
	
}

function drawHex(ctx, x, y, sideLen, number, drawSegment, drawSegNum) {
	// draw a hexgon of side sideLen centered on position x, y
	
	var a = sideLen
	var b = a * Math.sqrt(3) / 2;

	// 0 is the left side of hex, b + a/2 is the x center
	// 0 is the top of the hex, 
	
	
	//       (a/2, 0)
	//          ______________
	//         /
	//        /
	//       /
	//      /
	//     /
	//    (0,b)
	
	// the box is centered at a, b so we subtract these to get the center
	
	if (drawSegment) {
		ctx.beginPath();
		ctx.strokeStyle = '#888888';
    	ctx.moveTo(x-a,y)	
		ctx.lineTo(x-a/2,y-b)
    	ctx.lineTo(x+a/2,y-b)
    	ctx.lineTo(x+a,y)
    	ctx.lineTo(x+a/2,y+b)
    	ctx.lineTo(x-a/2,y+b)
		ctx.closePath();
		ctx.stroke();
	
		ctx.fillStyle = "#e8f0f8";
		ctx.fill();
	}
	
	if (drawSegNum) {
		ctx.fillStyle = '#888888';
		ctx.font="18px Arial";
		ctx.fillText(number, x-a + b/2, y + b/2);
	}
}


//]]>  
</script>   


		<p:dialog id="centroidOffsetDialog" header="Centroid Offsets" widgetVar="centroidOffsetDisplayDialog" closable="false" >  
     		<h:form id="offsetsForm">

			      		
    		<h:inputHidden id="centroidOffsetXs" value="#{visualizationController.centroidOffsetXs}" />
			<h:inputHidden id="centroidOffsetYs" value="#{visualizationController.centroidOffsetYs}" />

     		<h:inputHidden id="centDefXs" value="#{visualizationController.centDefXs}" />
			<h:inputHidden id="centDefYs" value="#{visualizationController.centDefYs}" />
    			
    		<p:panelGrid columns="2" styleClass="pcsFormNoBorder">
     		
     		<p:panelGrid id="canvasGrid" columns="1" styleClass="pcsFormNoBorder" style="border:0px" >
    		
    			<canvas id="offsetsCanvas" width="600px" height="600px" style="border:0px solid #d3d3d3;"> Your browser does not support the HTML5 canvas tag.</canvas>
    		
    		</p:panelGrid>
    		
    		<p:panelGrid columns="1" styleClass="pcsFormNoBorder" style="border:0px" >
			<p:panelGrid id="cameraStatePanel" columns="2" style="margin:0px;" styleClass="pcsFormNoBorder" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">


				<p:spacer height="30"/><p:spacer height="30"/>
				<h:outputLabel value="Translation from Ref (pixels) (x,y)" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.translationFromRefBeam.x}, #{visualizationController.centroidOffsetsDisplayValues.translationFromRefBeam.y}" style="position:relative; top:2px" />
				<h:outputLabel value="Rotation from Ref (rad)" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.rotationFromRefBeam}" style="position:relative; top:2px" />
				<h:outputLabel value="Scale change from Ref" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.scaleChangeFromRefBeam}" style="position:relative; top:2px" />
				
				<p:spacer height="15"/><p:spacer height="15"/>
				<h:outputLabel value="Scale Error (pixels)" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.scaleError}" style="position:relative; top:2px" />
				<h:outputLabel value="RMS Error (pixels)" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.rmsOffset}" style="position:relative; top:2px" />
				<h:outputLabel value="80% Enclosed Energy (pixels)" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.enclosedEnergy80}" style="position:relative; top:2px" />
				
				<h:outputLabel value="Max Centroid Offset (pixels)" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.maxOffset}" style="position:relative; top:2px" />
				<h:outputLabel value="Segment with Max Offset" />
				<h:outputText value="#{visualizationController.centroidOffsetsDisplayValues.maxSpotNum}" style="position:relative; top:2px" />
				
			
				<p:spacer height="15"/><p:spacer height="15"/>
				<h:outputLabel value="Arcsec/pixel" />
				<h:outputText value="#{procedureController.procedure.procedureConfigSet.procedureConfig.pupilMask.secPerPixel}" style="position:relative; top:2px" />
				
				<p:spacer height="120"/><p:spacer height="120"/>
				<h:outputLabel value="Show Segments" />
     			<p:selectBooleanButton value="#{visualizationController.showSegments}" onLabel="On" offLabel="Off" >
    				<p:ajax update="@this" listener="#{visualizationController.updateCentroidOffsetDisplayListener}" />
    			</p:selectBooleanButton>
				<p:spacer height="1"/><p:spacer height="1"/>
				<h:outputLabel value="Show Segment Numberings" />
     			<p:selectBooleanButton value="#{visualizationController.showSegNums}" onLabel="On" offLabel="Off" >
    				<p:ajax update="@this" listener="#{visualizationController.updateCentroidOffsetDisplayListener}" />
    			</p:selectBooleanButton>
    			
    			<p:spacer height="10"/><p:spacer height="10"/>
    			
    			
    		</p:panelGrid>
    		<p:panelGrid columns="1" style="margin-bottom: 10px; width:100%">
  
  				<h:outputText id="scaleOutput" value="Offset scale: #{visualizationController.offsetScale}%" />
        		<h:inputHidden id="scaleSlider" value="#{visualizationController.offsetScale}" />
        		<p:slider for="scaleSlider" display="scaleOutput" minValue="0" maxValue="300" displayTemplate="Offset scale: {value}%"> 
            		<p:ajax event="slideEnd" listener="#{visualizationController.updateCentroidOffsetDisplayListener}" />
        		</p:slider>
    		</p:panelGrid>
    		</p:panelGrid>    		
    		
    		
    		</p:panelGrid>
    		<br/>
			<p:commandButton id="closeButton" value="Close" style="float:right" update=":growl"
					action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="centroidOffsetDisplayDialog.hide()" />
    		</h:form>
		</p:dialog> 


</ui:composition>
