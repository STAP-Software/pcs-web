<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<script type="text/javascript">  
//<![CDATA[

function runDrawOffsets() {
	
	window.setTimeout("drawCentroidOffsets()", 10);
}

function drawCentroidOffsets(svg) {
    
	var c = document.getElementById("offsetsCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,c.width, c.height);
	
	var xField = document.getElementById('offsetsForm:centroidXs').value;
 	var xArray = xField.split(','); 
 	
	var yField = document.getElementById('offsetsForm:centroidYs').value;
 	var yArray = yField.split(','); 
   
	ctx.translate(-25,-10);
	ctx.scale(0.61, 0.61);

	for (var i = 0; i < xArray.length; i++) {
		
		ctx.beginPath();
		ctx.arc(xArray[i], yArray[i], 5, 0, 2*Math.PI);
		ctx.stroke();
		ctx.fillStyle = 'black';
	    ctx.fill();
				
		var dx = parseInt(xArray[i]) + ((Math.random() * 2.0) - 1.0) * 30.0;
		var dy = parseInt(yArray[i]) + ((Math.random() * 2.0) - 1.0) * 30.0;

		ctx.beginPath();
	    ctx.moveTo(xArray[i], yArray[i]);
	    ctx.lineTo(dx, dy);
	    ctx.stroke();
		
	}

	
}
//]]>  
</script>   


		<p:dialog id="centroidOffsetDialog" header="Visualization Display" widgetVar="centroidOffsetDisplayDialog" closable="false" >  
     		<h:form id="offsetsForm">

			      		
    		<h:inputHidden id="centroidXs" value="#{procedureController.centroidXs}" />
			<h:inputHidden id="centroidYs" value="#{procedureController.centroidYs}" />
    			
    		<canvas id="offsetsCanvas" width="600px" height="600px" style="border:0px solid #d3d3d3;"> Your browser does not support the HTML5 canvas tag.</canvas>
    		<br/>
    		
    		<p:commandButton id="saveButton" value="OK" style="float:right" update=":growl"
					action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="centroidOffsetDisplayDialog.hide()" />
			<p:commandButton id="closeButton" value="Cancel" style="float:right" update=":growl"
					action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="centroidOffsetDisplayDialog.hide()" />
    		</h:form>
		</p:dialog> 


</ui:composition>
