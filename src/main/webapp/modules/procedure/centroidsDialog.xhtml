<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<script type="text/javascript">  
//<![CDATA[

var resizing = false;  
    
    
function runDrawSpots() {
	
	var c = document.getElementById("spotCanvas");
	var ctx = c.getContext("2d");

 	ctx.translate(-35,-25);
 	ctx.scale(0.49, 0.49);
	
	window.setTimeout("drawSpots()", 10);
	
	$(centroidsDisplayDialog.jqId).bind('resize', function(){
		if (!resizing) {
			resizing = true;
			window.setTimeout("centroidsResizeHandler()", 1000);
		}
	})
}

function centroidsResizeHandler() {
	
	var baseScale = 0.49;
	var baseCanvasSize = 450.0;
	
	var d = document.getElementById("centroidsDialog"); 
	var availableWidth = d.offsetWidth - 80;
	var availableHeight = d.offsetHeight - 80;
	var available = Math.min(availableWidth, availableHeight);
	
	var changeFromBase = available / baseCanvasSize;
	
	var scale = baseScale * changeFromBase;
	
	var c = document.getElementById("spotCanvas");
	c.width=available;
	c.height=available;
	
	var ctx = c.getContext("2d");

 	ctx.translate(-35 * changeFromBase, -25 * changeFromBase);
	ctx.scale(scale, scale);

	alert("resizing")
	drawSpots();
	
	resizing = false;

}


function drawSpots() {
		
	var c = document.getElementById("spotCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,c.width, c.height);

    
	var xField = document.getElementById('spotsForm:centroidXs').value;
 	var xArray = xField.split(','); 
    
	var yField = document.getElementById('spotsForm:centroidYs').value;
 	var yArray = yField.split(','); 
    
 	
 	var fontSize;
 	if (xArray.length > 1000) {
 		fontSize = 16;
 	} else if (xArray.length > 200) {
 		fontSize = 20;
 	} else if (xArray.length > 100) {
 		fontSize = 24;
 	} else {
 		fontSize = 28;
 	}
 	
	ctx.font = fontSize + "px Arial";
 	ctx.fillStyle = "blue";
		
	for (i = 0; i < xArray.length; i++) {
		ctx.fillText("" + (i+1), xArray[i], yArray[i]);	
	}
}
//]]>  
</script>  



	<p:dialog id="centroidsDialog" header="Centroids Visualization Display" widgetVar="centroidsDisplayDialog" closable="false" position="right" >  
   		<h:form id="spotsForm">

   		<h:inputHidden id="centroidXs" value="#{visualizationController.centroidXs}" />
		<h:inputHidden id="centroidYs" value="#{visualizationController.centroidYs}" />
   			
   		<p:panelGrid id="canvasGrid" columns="1" styleClass="pcsFormNoBorder" style="border:0px" >
   		
   			
   		<canvas id="spotCanvas" width="450px" height="450px" style="border:0px solid #d3d3d3;"> Your browser does not support the HTML5 canvas tag.</canvas>
   		<br/>
 		<br/>   		
   		
   		<h:panelGroup rendered="#{not empty visualizationController.currentDisplay.message}" styleClass="dialogbutton">

		
    	<p:commandButton id="button2" value="#{visualizationController.currentDisplay.button2Text}" style="float:right" update=":growl :errorGrowl"
				action="#{asyncController.doCloseGraphicsDisplay2}" oncomplete="centroidsDisplayDialog.hide()" rendered="#{visualizationController.currentDisplay.buttonCount gt 1}" />
    	<p:commandButton id="button1" value="#{visualizationController.currentDisplay.button1Text}" style="float:right" update=":growl :errorGrowl"
				action="#{asyncController.doCloseGraphicsDisplay1}" oncomplete="centroidsDisplayDialog.hide()" />

    	<h:outputText escape="false" value="#{visualizationController.currentDisplay.message}" style="white-space:pre-wrap; text-align: right; position:relative; margin-right:30px; top:8px; color: #444444" />
    	
    	</h:panelGroup>
    	
 	   	<h:panelGroup rendered="#{empty visualizationController.currentDisplay.message}">
    	<p:commandButton id="button3" value="Close" styleClass="dialogbutton" update=":growl :errorGrowl"
				action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="centroidsDisplayDialog.hide()" />
    	
    	</h:panelGroup>
 				
		</p:panelGrid>
   		</h:form>
	</p:dialog> 


</ui:composition>
