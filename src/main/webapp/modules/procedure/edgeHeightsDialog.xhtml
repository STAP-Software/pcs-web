<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

<script type="text/javascript">  
//<![CDATA[

var sideLen = 77

var hexRadius = (Math.sqrt(3.0)/2.0) * sideLen
           
var resizing = false;   

var edgeHeightsScope = {drawSegments: true, drawSegNums: true, drawEdgeNums: true};


function runDrawEdgeHeights() {

	var c = document.getElementById("edgeHeightsCanvas");
	var ctx = c.getContext("2d");

	ctx.translate(-25,-10);
	//ctx.scale(0.61, 0.61);

	window.setTimeout("drawEdgeHeights(true,true,true)", 10);
	
	$(PF('edgeHeightsDisplayDialog').jqId).bind('resize', function(){
		if (!resizing) {
			resizing = true;
			window.setTimeout("edgeHeightsResizeHandler()", 100);
		}
	})
	
}

function edgeHeightsResizeHandler() {

    var c = document.getElementById("edgeHeightsCanvas");
    var rightPanel = document.getElementById("edgeHeightsForm:edgeHeightsRightPanel");
    var dlgWrapper = document.getElementById("edgeHeightsDialog").closest('.ui-dialog');

    c.style.width = "0px";
    c.style.height = "0px";

    var availableWidth = dlgWrapper.offsetWidth - rightPanel.offsetWidth - 30 - 48;
    var availableHeight = dlgWrapper.offsetHeight - 128;
    var available = Math.max(750, Math.min(availableWidth, availableHeight));

    console.log("dlgWrapper=" + dlgWrapper.offsetWidth + " rightPanel=" + rightPanel.offsetWidth + " availableWidth=" + availableWidth + " availableHeight=" + availableHeight);
    
    c.width = available;
    c.height = available;
    c.style.width = available + "px";
    c.style.height = available + "px";

    var ctx = c.getContext("2d");
    var scale = available / 1000.0;
    ctx.scale(scale, scale);
    ctx.translate(-25, -10);

    drawEdgeHeights(edgeHeightsScope.drawSegments, edgeHeightsScope.drawSegNums, edgeHeightsScope.drawEdgeNums);


    
    resizing = false;

}


function drawEdgeHeights(drawSegments,drawSegNums,drawEdgeNums) {
    
	edgeHeightsScope.drawSegNums = drawSegNums;
	edgeHeightsScope.drawSegments = drawSegments;
	edgeHeightsScope.drawEdgeNums = drawEdgeNums;
	
	var c = document.getElementById("edgeHeightsCanvas");
	var ctx = c.getContext("2d");
	ctx.clearRect(0,0,1000,1000);


	// display coordinates - hex centers
	var xField1 = document.getElementById('edgeHeightsForm:segCentDefXs').value;
 	var xHexCenterArray = xField1.split(','); 
 	
	var yField1 = document.getElementById('edgeHeightsForm:segCentDefYs').value;
 	var yHexCenterArray = yField1.split(','); 
 	
 	// display coordinates - ideal centroid positions
	var xField2 = document.getElementById('edgeHeightsForm:edgeXs').value;
 	var xEdgeArray = xField2.split(','); 
 	
	var yField2 = document.getElementById('edgeHeightsForm:edgeYs').value;
 	var yEdgeArray = yField2.split(','); 
   
 	// display coordinates - edge angles
 	var field3 = document.getElementById('edgeHeightsForm:edgeNormAngles').value;
 	var edgeNormAngles = field3.split(',');
 	
 	// edge heights
 	var field4 = document.getElementById('edgeHeightsForm:edgeHeights').value;
 	var edgeHeights = field4.split(',');
 	
 	var field5 = document.getElementById('edgeHeightsForm:useForAnalysis').value;
 	var useForAnalysis = field5.split(',');
 	
 	var field6 = document.getElementById('edgeHeightsForm:rowFlagOut').value;
 	var rowFlagOut = field6.split(',');
 	
	var offsetScale = parseFloat(document.getElementById('edgeHeightsForm:scaleSlider').value);
 	 
	// calculate max length of all offsets
	var maxLen = document.getElementById('edgeHeightsForm:maxError').value;
	
	// the max displayed length at 100% offset scale is sqrt(3)/2 * sideLen
	// the max length will then be the length of the hexRadius
	var scaleFactor = hexRadius / maxLen;  
	
	var centerX = 512;
	var centerY = 512;

	
	for (var i = 0; i < xHexCenterArray.length; i++) {
		
		var x = centerX + parseFloat(xHexCenterArray[i]) * sideLen
		var y = centerY - parseFloat(yHexCenterArray[i]) * sideLen
								
		drawHexCentered(ctx, x, y, sideLen, i+1, drawSegments, drawSegNums)
	}
	
	
	
	for (var i = 0; i < 84; i++) {
		
		var x = centerX + parseFloat(xEdgeArray[i]) * sideLen;
		var y = centerY - parseFloat(yEdgeArray[i]) * sideLen;
						
		// if useForAnalysis, rowFlagOut are 1, then draw a line, otherwise a circle
		
		if (useForAnalysis[i] == 0) {
			// draw a circle with no interior
			ctx.beginPath();
			ctx.strokeStyle = 'black';
			ctx.arc(x, y, 10, 0, 2*Math.PI);
			ctx.closePath();
			ctx.stroke();
			ctx.fillStyle = 'white';
		    ctx.fill();
		    
		} else if (rowFlagOut[i] == 0 ){
			// draw a circle with black interior
			ctx.beginPath();
			ctx.strokeStyle = 'black';
			ctx.arc(x, y, 10, 0, 2*Math.PI);
			ctx.closePath();
			ctx.stroke();
			ctx.fillStyle = 'black';
		    ctx.fill();

		} else {
			// draw the edge height line
		
			var edgeHeight = (parseFloat(edgeHeights[i]) * scaleFactor * offsetScale / 100.0)
			
			var edgeAngle = (parseFloat(edgeNormAngles[i])) * 2 * Math.PI / 360.0
			
			var dx = x + (Math.cos(edgeAngle) * edgeHeight)
			var dy = y - (Math.sin(edgeAngle) * edgeHeight)
					
			ctx.beginPath();
			ctx.strokeStyle = 'red';
		    ctx.moveTo(x, y);
		    ctx.lineTo(dx, dy);
		    ctx.stroke();
			
			ctx.beginPath();
			ctx.strokeStyle = 'black';
			ctx.arc(x, y, 5, 0, 2*Math.PI);
			ctx.closePath();
			ctx.stroke();
			ctx.fillStyle = 'white';
		    ctx.fill();
		    
		}
		
	    if (drawEdgeNums) {
	    	
			var yEdgeHeightTextOffset = 8;

			// text a little higher up when circle is larger
			if ((useForAnalysis[i] == 0) || (rowFlagOut[i] == 0 )) {
				yEdgeHeightTextOffset = 12;
			}
	    	
			ctx.fillStyle = '#888888';
			ctx.font="18px Arial";
			var offsetX = (i+1 < 10) ? x - 4 : x - 10;
			ctx.fillText(i+1, offsetX, y - yEdgeHeightTextOffset);		    	
	    }


	}
	
	// max len is the value assigned to a side in the key

	// add the key
	
	ctx.beginPath();
	ctx.strokeStyle = 'red';
    ctx.moveTo(850, 950);
    ctx.lineTo(850 + sideLen, 950);
    ctx.stroke();
   

	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();
    
	ctx.beginPath();
	ctx.strokeStyle = 'black';
	ctx.arc(850 + sideLen, 950, 5, 0, 2*Math.PI);
	ctx.closePath();
	ctx.stroke();
	ctx.fillStyle = 'white';
    ctx.fill();   
    
	ctx.fillStyle = 'black';
	ctx.font="18px Arial";
	
	ctx.fillText((sideLen * 100.00 / (scaleFactor * offsetScale)).toFixed(2) + " microns", 844, 940);
	
	
	// add the legend
	
	var cl = document.getElementById("edgeHeightsLegendCanvas");
	var ctxl = cl.getContext("2d");
	ctxl.setTransform(1,0,0,1,0,0);
	ctxl.clearRect(0,0,cl.width,cl.height);
	
	// draw a circle with white interior
	// draw a circle with white interior
	ctxl.beginPath();
	ctxl.strokeStyle = 'black';
	ctxl.arc(20, 20, 7, 0, 2*Math.PI);
	ctxl.closePath();
	ctxl.stroke();
	ctxl.fillStyle = 'white';
	ctxl.fill();

	// draw a circle with black interior
	ctxl.beginPath();
	ctxl.strokeStyle = 'black';
	ctxl.arc(20, 60, 7, 0, 2*Math.PI);
	ctxl.closePath();
	ctxl.stroke();
	ctxl.fillStyle = 'black';
	ctxl.fill();

	ctxl.fillStyle = 'grey';
	ctxl.font = "16px Arial";

	ctxl.fillText("Pre-excluded edges", 40, 25);
	ctxl.fillText("Measurement ignored", 40, 65);
	ctxl.fillText("Line points from edge to lower segment", 10, 110);	
}

function drawHexCentered(ctx, x, y, sideLen, number, drawSegment, drawSegNum) {
	// draw a hexgon of side sideLen centered on position x, y
	
	var a = sideLen
	var b = a * Math.sqrt(3) / 2;

	if (drawSegment) {
		ctx.beginPath();
		ctx.strokeStyle = '#888888';
    	ctx.moveTo(x-a,y)	
		ctx.lineTo(x-a/2,y-b)
    	ctx.lineTo(x+a/2,y-b)
    	ctx.lineTo(x+a,y)
    	ctx.lineTo(x+a/2,y+b)
    	ctx.lineTo(x-a/2,y+b)
		ctx.closePath();
		ctx.stroke();
	
		ctx.fillStyle = "#e8f0f8";
		ctx.fill();
	}
	
	if (drawSegNum) {
		ctx.fillStyle = '#888888';
		ctx.font="18px Arial";
		var offsetX = (number < 10) ? x - 5 : x - 10;
		ctx.fillText(number, offsetX, y + 10);
	}
}


//]]>  
</script>   



	<p:dialog id="edgeHeightsDialog" header="Measured Edge Heights" widgetVar="edgeHeightsDisplayDialog" closable="false"
	          width="1180">
		<h:form id="edgeHeightsForm">

			<h:inputHidden id="edgeHeights" value="#{visualizationController.edgeHeights}" />
			<h:inputHidden id="maxError" value="#{visualizationController.edgeHeightsDisplayValues.edgeErrorMax}" />
			<h:inputHidden id="useForAnalysis" value="#{visualizationController.useForAnalysis}" />
			<h:inputHidden id="rowFlagOut" value="#{visualizationController.rowFlagOut}" />
			<h:inputHidden id="edgeXs" value="#{visualizationController.edgeXs}" />
			<h:inputHidden id="edgeYs" value="#{visualizationController.edgeYs}" />
			<h:inputHidden id="edgeNormAngles" value="#{visualizationController.edgeNormAngles}" />
			<h:inputHidden id="segCentDefXs" value="#{visualizationController.segCentersX}" />
			<h:inputHidden id="segCentDefYs" value="#{visualizationController.segCentersY}" />
			<h:inputHidden id="maxOffset" value="#{visualizationController.maxOffset}" />

			<!-- outer flex row: canvas on the left, controls on the right -->
			<h:panelGroup layout="block" style="display:flex; flex-direction:row; gap:30px; align-items:flex-start; width:100%; justify-content:space-between;">

				<canvas id="edgeHeightsCanvas" width="1000" height="1000"
				        style="width:750px; height:750px; flex-shrink:0;">
					Your browser does not support the HTML5 canvas tag.
				</canvas>

				<!-- right panel: vertical flex column -->
				<h:panelGroup id="edgeHeightsRightPanel" layout="block" style="flex:0 0 auto; display:flex; flex-direction:column; gap:10px;">

					<!-- label/value pairs and toggles in a 2-column grid -->
					<p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder ui-panelgrid-blank" columnClasses="btmsFormLabelColumn, btmsFormInputColumn" style="white-space:nowrap;">

						<c:set var="procedureOutput" value="#{visualizationController.edgeHeightsDisplayValues}" />

						<p:spacer height="15"/><p:spacer height="15"/>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('PhasingStatsResult','GoodEdgeCount')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<h:outputText value="#{visualizationController.edgeHeightsDisplayValues.goodEdgeCount}" style="position:relative; top:2px" />

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('PhasingStatsResult','EdgeErrorMax')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (&#956;m)" />
						<h:outputText value="#{visualizationController.edgeHeightsDisplayValues.edgeErrorMax}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('PhasingStatsResult','EdgeErrorRss')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (&#956;m)" />
						<h:outputText value="#{visualizationController.edgeHeightsDisplayValues.edgeErrorRss}" style="position:relative; top:2px">
							<f:converter converterId="DynamicNumberConverter" />
							<f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
						</h:outputText>

						<p:spacer height="30"/><p:spacer height="30"/>

						<h:outputLabel value="Show Segments" />
						<p:selectBooleanButton value="#{visualizationController.showSegments}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateEdgeHeightsDisplayListener}" />
						</p:selectBooleanButton>

						<p:spacer height="1"/><p:spacer height="1"/>

						<h:outputLabel value="Show Segment Numberings" />
						<p:selectBooleanButton value="#{visualizationController.showSegNums}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateEdgeHeightsDisplayListener}" />
						</p:selectBooleanButton>

						<p:spacer height="1"/><p:spacer height="1"/>

						<h:outputLabel value="Show Edge Numberings" />
						<p:selectBooleanButton value="#{visualizationController.showEdgeNums}" onLabel="On" offLabel="Off">
							<p:ajax update="@this" listener="#{visualizationController.updateEdgeHeightsDisplayListener}" />
						</p:selectBooleanButton>

					</p:panelGrid>

					<!-- slider below the grid -->
					<h:panelGroup layout="block"  style="width:300px; padding-top:10px;">
						<h:outputText id="scaleOutput" value="Offset scale: #{visualizationController.offsetScale}%" />
						<br/>
						<p:spacer height="10"/>
						<h:inputHidden id="scaleSlider" value="#{visualizationController.offsetScale}" />
						<p:slider for="scaleSlider" display="scaleOutput" minValue="0" maxValue="300" displayTemplate="Offset scale: {value}%">
							<p:ajax event="slideEnd" listener="#{visualizationController.updateEdgeHeightsDisplayListener}" />
						</p:slider>
					</h:panelGroup>

					<!-- legend canvas below the slider -->
					<canvas id="edgeHeightsLegendCanvas" width="300" height="200"
					        style="width:300px; height:200px; margin-top: 40px">
					    Your browser does not support the HTML5 canvas tag.
					</canvas>
				</h:panelGroup>

			</h:panelGroup>

			<br/>

			<h:panelGroup styleClass="dialogCommandGroup">
				<p:commandButton value="Abort" styleClass="dialogbutton" update=":growl :errorGrowl"
				        action="#{asyncController.doCloseGraphicsDisplayAbort}" oncomplete="PF('edgeHeightsDisplayDialog').hide()" rendered="#{sessionController.procedureExecuting}"/>
				<p:commandButton id="closeButton" value="Close" styleClass="dialogbutton" update=":growl :errorGrowl"
				        action="#{asyncController.doCloseGraphicsDisplay}" oncomplete="PF('edgeHeightsDisplayDialog').hide()" />
			</h:panelGroup>

		</h:form>
	</p:dialog>


</ui:composition>
