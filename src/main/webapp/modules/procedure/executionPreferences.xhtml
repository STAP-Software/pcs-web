<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="executionPrefsDlg" header="Procedure Execution Preferences" widgetVar="executionPrefsDialog" modal="true" resizable="true" width="900" draggable="true"
          style="overflow-y:auto; max-height:1200px;">

		<h:form id="executionPrefsForm">

			<p:spacer height="10px" />

			<p:fieldset legend="Frame Preferences" toggleable="true" toggleSpeed="500">

				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

					<h:outputLabel value="Frame Scale and Rotation Removal" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.frameScaleRotationRemoval}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Always Remove" itemValue="1" />
						<f:selectItem itemLabel="Never Remove" itemValue="2" />
						<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />
					</p:selectOneMenu>

				</p:panelGrid>

			</p:fieldset>
			
			<p:spacer height="10px" />
			
			<p:fieldset legend="Procedure Display Preferences" rendered="#{not procedureController.procedure.procedureType.centerTelescope}" >

				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">


					<h:outputLabel value="Auto Display Centroids" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayCentroids}" disabled="#{procedureController.procedure.procedureState gt 1}" />
					<h:outputLabel value="Auto Display Centroid Offsets" rendered="#{procedureController.procedure.procedureType.passiveTilt or procedureController.procedure.procedureType.fineScreen or procedureController.procedure.procedureType.sufs}"/>
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayCentroidOffsets}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.passiveTilt or procedureController.procedure.procedureType.fineScreen or procedureController.procedure.procedureType.sufs}" />
					<h:outputLabel value="Auto Display Avg. Pseudo PT Centroid Offsets" rendered="#{procedureController.procedure.procedureType.fineScreen}"/>
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayAvgPtCentroidOffsets}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.fineScreen}" />
					<h:outputLabel value="Auto Display Avg. FS Centroid Offsets" rendered="#{procedureController.procedure.procedureType.fineScreen}"/>
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayAvgFsCentroidOffsets}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.fineScreen}"/>
					<h:outputLabel value="Auto Display Avg. SUFS Centroid Offsets" rendered="#{procedureController.procedure.procedureType.sufs}"/>
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayAvgSufsCentroidOffsets}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.sufs}"/>					
					<h:outputLabel value="Auto Display Actuator Deltas" rendered="#{procedureController.procedure.procedureType.passiveTilt or procedureController.procedure.procedureType.fineScreen or procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayActuatorDeltas}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.passiveTilt or procedureController.procedure.procedureType.fineScreen or procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}" />					
					<h:outputLabel value="Auto Display Edge Heights" rendered="#{procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayEdgeHeights}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}" />
					<h:outputLabel value="Auto Display Single Filter Edge Heights" rendered="#{procedureController.procedure.procedureType.narrowBandPhasing}" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplaySingleFilterEdgeHeights}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.narrowBandPhasing}" />
					<h:outputLabel value="Auto Display Residuals" rendered="#{procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplayResiduals}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}" />
					<h:outputLabel value="Display Subimage Intensity Warning" />
					<p:selectBooleanCheckbox value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoDisplaySubimageIntensityWarning}" disabled="#{procedureController.procedure.procedureState gt 1}" />

				</p:panelGrid>

			</p:fieldset>

			<p:spacer height="10px" />
			
			<p:fieldset legend="General Workflow Preferences" rendered="#{not procedureController.procedure.procedureType.centerTelescope}">

				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

					<h:outputLabel value="Auto Center Telescope" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoCenterTelescope}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Auto Move Telescope" itemValue="1" />
						<f:selectItem itemLabel="Never Move Telescope" itemValue="2" />
						<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />
					</p:selectOneMenu>

					<h:outputLabel value="Automatic Reference Beam Taking" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoTakeRefBeam}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Auto Take Ref Maps" itemValue="1" />
						<f:selectItem itemLabel="Never Take Ref Maps" itemValue="2" />
						<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />
					</p:selectOneMenu>
				</p:panelGrid>
			</p:fieldset>

			<p:spacer height="10px" />
					
			<p:fieldset legend="Pupil Registration Workflow Preferences" rendered="#{procedureController.procedure.procedureType.pupilRegistration or procedureController.procedure.procedureType.fineScreen or procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}">
				
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
				
					<h:outputLabel value="Auto Center Pupil" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoCenterPupil}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Auto Command" itemValue="1" />
						<f:selectItem itemLabel="Never Command" itemValue="2" />
						<f:selectItem itemLabel="Prompt User" itemValue="3" />
					</p:selectOneMenu>

					<h:outputLabel value="Center Pupil Mechanism" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoCenterPupilMechanism}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Coarse" itemValue="1" />
						<f:selectItem itemLabel="Fine" itemValue="2" />
						<f:selectItem itemLabel="Auto Determine" itemValue="3" />
						<f:selectItem itemLabel="Prompt User" itemValue="4" />
					</p:selectOneMenu>

				</p:panelGrid>
				
			</p:fieldset>

			<p:spacer height="10px" />

			<p:fieldset legend="SUFS Workflow Preferences" rendered="#{procedureController.procedure.procedureType.sufs}">

				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
				
					<h:outputLabel value="SUFS Auto Point Telescope to Segment/Group" />
					<p:selectOneMenu id="options" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoPointTelescopeSufsGroup}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Auto Point Telescope" itemValue="1" />
						<f:selectItem itemLabel="Never Auto Point Telescope" itemValue="2" />
						<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />
					</p:selectOneMenu>


				</p:panelGrid>

			</p:fieldset>



			<p:spacer height="10px" />
					
			<!-- TODO: add rendering for sufs -->
			<p:fieldset legend="M1 Command Workflow Preferences" rendered="#{procedureController.procedure.procedureType.passiveTilt or procedureController.procedure.procedureType.fineScreen or procedureController.procedure.procedureType.coarsePhasing or procedureController.procedure.procedureType.narrowBandPhasing}">
					
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
				
					<h:outputLabel value="Auto Command Primary" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoSendActuatorCmds}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Auto Command Primary" itemValue="1" />
						<f:selectItem itemLabel="Never Command Primary" itemValue="2" />
						<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />
					</p:selectOneMenu>

				</p:panelGrid>

			</p:fieldset>
			
			<p:spacer height="10px" />
			
			<p:fieldset legend="M2 Command Workflow Preferences" rendered="#{procedureController.procedure.procedureType.fineScreen}">
					
				<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
				
					<h:outputLabel value="Auto Command Secondary" />
					<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.autoSendActuatorCmds}" disabled="#{procedureController.procedure.procedureState gt 1}">
						<f:selectItem itemLabel="Auto Command Secondary" itemValue="1" />
						<f:selectItem itemLabel="Never Command Secondary" itemValue="2" />
						<f:selectItem itemLabel="Prompt User During Test" itemValue="3" />
					</p:selectOneMenu>

				</p:panelGrid>

			</p:fieldset>
			
			<p:spacer height="10px" />
			
			<br/>

			<p:commandButton id="saveButton" value="Save" icon="pi pi-check" style="float:right" update=":growl :errorGrowl" action="#{procedureController.doSaveAdvancedOptions}"
				oncomplete="executionPrefsDialog.hide();" disabled="#{procedureController.procedure.procedureState gt 1}" />
			<p:commandButton id="closeButton" value="Close" icon="pi pi-times" style="float:right" update=":growl :errorGrowl"
				action="#{procedureController.doCancelSaveAdvancedOptions}" oncomplete="executionPrefsDialog.hide();" />

		</h:form>
	</p:dialog>

</ui:composition>

</html>
