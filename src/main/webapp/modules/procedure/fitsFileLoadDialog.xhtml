<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="fitsFileLoadDlg"
              header="FITS File Loader"
              widgetVar="fitsFileLoadDialog"
              modal="true"
              width="550">

        <h:form id="fitsFileLoadForm">

            <div class="fitsIntro">
                <h:outputText value="Select ccd frames to execute a procedure with." /><br/>
                <h:outputText value="Selecting a single phasing frame will load all frames from that sequence." />
            </div>

            <div class="formRow">

                <div class="formLabel">
                    <h:outputLabel value="Select a File" />
                </div>

                <div class="formField">
                    <p:selectManyMenu id="fitsSelect"
                                      value="#{procedureController.selectedFitsFiles}"
                                      converter="#{pcsFitsFileConverter}"
                                      showCheckbox="true"
                                      style="width:350px;"
                                      panelStyle="width:350px;"
                                      scrollHeight="296"
                                      widgetVar="fitsSelectWidget">
                        <f:selectItems value="#{procedureController.availableFitsFiles}"
                                       var="fitsFile"
                                       itemLabel="#{fitsFile.fileName}"
                                       itemValue="#{fitsFile}" />
                    </p:selectManyMenu>
                </div>

            </div>

            <div class="dialogButtons">
                <p:commandButton id="saveButton"
                                 value="Load"
                                 icon="pi pi-upload"
                                 action="#{procedureController.doLoadFitsFile}"
                                 update=":growl :errorGrowl :advancedForm :procedureDetailForm:framePanel :procedureDetailForm:controlPanel"
                                 oncomplete="PF('fitsFileLoadDialog').hide();" />

                <p:commandButton id="closeButton"
                                 value="Close"
                                 icon="pi pi-times"
                                 action="#{procedureController.doCancelSaveAdvancedOptions}"
                                 oncomplete="PF('fitsFileLoadDialog').hide();" />
            </div>

        </h:form>
    </p:dialog>


</ui:composition>
</html>
