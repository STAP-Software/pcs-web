<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

<style>
    .btmsForm.ui-panelgrid,
    .btmsForm.ui-panelgrid .ui-panelgrid-cell,
    .btmsForm.ui-panelgrid tr,
    .btmsForm.ui-panelgrid td {
        border: none !important;
    }
</style>

<style>
    .btmsForm.ui-panelgrid td.btmsFormLabelCol {
        text-align: right;
        font-weight: bold;
    }
</style>

		<p:dialog id="iterationDlg" header="Add Iteration Set Option" widgetVar="iterationDialog" >

			<h:form id="iterationConfigForm">
		
				<p:spacer height="10px" />

				<p:fieldset legend="Create a Custom Iteration Set" >

					<p:panelGrid columns="6" styleClass="btmsForm" layout="tabular" columnClasses="btmsFormLabelCol,,,,,">

					<h:outputLabel value="Enable Iteration" />
					
					<h:panelGroup>
						<p:selectBooleanCheckbox value="#{iterationConfigController.elementEnable1}"> 
							<p:ajax update="iterationConfigForm" />
						</p:selectBooleanCheckbox>
					</h:panelGroup>

					<h:panelGroup>
						<p:selectBooleanCheckbox value="#{iterationConfigController.elementEnable2}"> 
							<p:ajax update="iterationConfigForm" />
						</p:selectBooleanCheckbox>
					</h:panelGroup>

					<h:panelGroup>
						<p:selectBooleanCheckbox value="#{iterationConfigController.elementEnable3}"> 
							<p:ajax update="iterationConfigForm" />
						</p:selectBooleanCheckbox>
					</h:panelGroup>

					<h:panelGroup>
						<p:selectBooleanCheckbox value="#{iterationConfigController.elementEnable4}"> 
							<p:ajax update="iterationConfigForm" />
						</p:selectBooleanCheckbox>
					</h:panelGroup>

					<p:spacer />

					<h:outputLabel value="Filter Values" />

					<p:selectOneMenu value="#{iterationConfigController.filter1}"
						disabled="#{not iterationConfigController.elementEnable1}" converter="#{filterConverter}">
					<f:selectItems value="#{iterationConfigController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.filter2}"
						disabled="#{not iterationConfigController.elementEnable2}" converter="#{filterConverter}">
					<f:selectItems value="#{iterationConfigController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.filter3}"
						disabled="#{not iterationConfigController.elementEnable3}" converter="#{filterConverter}">
					<f:selectItems value="#{iterationConfigController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.filter4}"
						disabled="#{not iterationConfigController.elementEnable4}" converter="#{filterConverter}">
					<f:selectItems value="#{iterationConfigController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>
					
					<p:spacer />


					<h:outputLabel value="Ref Beam Values (when light source is LED)" />

					<p:selectOneMenu value="#{iterationConfigController.refBeam1}"
						disabled="#{not iterationConfigController.elementEnable1}" converter="#{refBeamConverter}">
					<f:selectItems value="#{iterationConfigController.refBeamList}" var="refBeam" itemLabel="#{refBeam.refBeamNum}" itemValue="#{refBeam}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.refBeam2}"
						disabled="#{not iterationConfigController.elementEnable2}" converter="#{refBeamConverter}">
					<f:selectItems value="#{iterationConfigController.refBeamList}" var="refBeam" itemLabel="#{refBeam.refBeamNum}" itemValue="#{refBeam}" />
					<p:ajax update="@form" />
					</p:selectOneMenu> 

					<p:selectOneMenu value="#{iterationConfigController.refBeam3}"
						disabled="#{not iterationConfigController.elementEnable3}" converter="#{refBeamConverter}">
					<f:selectItems value="#{iterationConfigController.refBeamList}" var="refBeam" itemLabel="#{refBeam.refBeamNum}" itemValue="#{refBeam}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.refBeam4}"
						disabled="#{not iterationConfigController.elementEnable4}" converter="#{refBeamConverter}">
					<f:selectItems value="#{iterationConfigController.refBeamList}" var="refBeam" itemLabel="#{refBeam.refBeamNum}" itemValue="#{refBeam}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:spacer />

					<h:outputLabel value="Integration Times (Star)" />

					<p:inputText value="#{iterationConfigController.starIntTime1}" size="6" disabled="#{not iterationConfigController.elementEnable1}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					<p:inputText value="#{iterationConfigController.starIntTime2}" size="6" disabled="#{not iterationConfigController.elementEnable2}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					<p:inputText value="#{iterationConfigController.starIntTime3}" size="6" disabled="#{not iterationConfigController.elementEnable3}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					<p:inputText value="#{iterationConfigController.starIntTime4}" size="6" disabled="#{not iterationConfigController.elementEnable4}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					
					<p:spacer />
					
					<h:outputLabel value="Integration Times (LED)" />

					<p:inputText value="#{iterationConfigController.ledIntTime1}" size="6" disabled="#{not iterationConfigController.elementEnable1}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					<p:inputText value="#{iterationConfigController.ledIntTime2}" size="6" disabled="#{not iterationConfigController.elementEnable2}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					<p:inputText value="#{iterationConfigController.ledIntTime3}" size="6" disabled="#{not iterationConfigController.elementEnable3}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					<p:inputText value="#{iterationConfigController.ledIntTime4}" size="6" disabled="#{not iterationConfigController.elementEnable4}" converter="#{integrationTimeConverter}" >
					<p:ajax event="change" update="@this" />
					</p:inputText>
					
					<p:spacer />
					
					<h:outputLabel value="CCD Gain Values (Star)" />

					<p:selectOneMenu value="#{iterationConfigController.starGain1}"
						disabled="#{not iterationConfigController.elementEnable1}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.starGain2}"
						disabled="#{not iterationConfigController.elementEnable2}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.starGain3}"
						disabled="#{not iterationConfigController.elementEnable3}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.starGain4}"
						disabled="#{not iterationConfigController.elementEnable4}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>
					
					<p:spacer />
					
					
					<h:outputLabel value="CCD Gain Values (LED)" />

					<p:selectOneMenu value="#{iterationConfigController.ledGain1}"
						disabled="#{not iterationConfigController.elementEnable1}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.ledGain2}"
						disabled="#{not iterationConfigController.elementEnable2}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.ledGain3}"
						disabled="#{not iterationConfigController.elementEnable3}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{iterationConfigController.ledGain4}"
						disabled="#{not iterationConfigController.elementEnable4}" converter="#{ccdGainConverter}">
					<f:selectItems value="#{iterationConfigController.ccdGainList}" var="ccdGain" itemLabel="#{ccdGain.gainNumber}" itemValue="#{ccdGain}" />
					<p:ajax update="@form" />
					</p:selectOneMenu>
					
					<p:spacer />
					
				</p:panelGrid>
			</p:fieldset>


			<p:spacer height="10px" />

			
			<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px;">
				<p:commandButton style="float:right" value="Save" icon="pi pi-check" ajax="true" action="#{iterationConfigController.doSaveIterationSet}" oncomplete="PF('iterationDialog').hide();" update=":procedureDetailForm:controlPanel:loopOptions2 :growl :errorGrowl" />
				<p:commandButton id="closeButton" value="Close" icon="pi pi-times" style="float:right" update=":growl :errorGrowl" type="button" onclick="PF('iterationDialog').hide();" />
			</div>		

			
		</h:form>
	</p:dialog>

</ui:composition>


</html>
