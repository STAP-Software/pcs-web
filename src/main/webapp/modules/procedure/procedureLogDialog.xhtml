<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="procedureLogDlg" header="Procedure Report" widgetVar="procedureLogDialog">

		<h:form id="procedureLogForm">

		<p:tabView>
       	 	<p:tab title="Procedure Overview">
		
			<h:commandLink>
				<p:graphicImage value="../../images/excel.png" />
				<p:dataExporter type="xls" target="plogTable" fileName="plog" />
			</h:commandLink>
			<h:commandLink>
				<p:graphicImage value="../../images/csv.png" />
				<p:dataExporter type="csv" target="plogTable" fileName="plog" />
			</h:commandLink>


			<p:dataTable id="plogTable" var="plogValue" value="#{procedureController.procedure.procedureOutput.procedureOutputList}" style="margin:20px">
				<f:facet name="header">
        				Procedure Execution Values
    				</f:facet>

				<p:column headerText="Name">
					<h:outputText value="#{plogValue.procedureOutputField.displayLabel}" />
				</p:column>
				<p:column headerText="Value">
					<h:outputText value="#{plogValue.data}" />
				</p:column>
				
				<p:column headerText="Units">
					<h:outputText value="#{plogValue.procedureOutputField.units}" />
				</p:column>
				<p:column headerText="Description">
					<h:outputText value="#{plogValue.procedureOutputField.description}" />
				</p:column>

			</p:dataTable>
			
			</p:tab>
			<p:tab title="Procedure Iteration Data">
			
			
			<p:tabView value="#{procedureController.procedure.procedureOutput.procedureIterationOutputList}" var="pio">
			
				<p:tab title="Iteration #{pio.iteration + 1}">

					<h:commandLink>
						<p:graphicImage value="../../images/excel.png" />
						<p:dataExporter type="xls" target="iterTable" fileName="plog" />
					</h:commandLink>
					<h:commandLink>
						<p:graphicImage value="../../images/csv.png" />
						<p:dataExporter type="csv" target="iterTable" fileName="plog" />
					</h:commandLink>
				
					<p:dataTable id="iterTable" var="plogIterValue" value="#{pio.procedureIterationOutputList}" style="margin:20px">
						<f:facet name="header">
		        				Procedure Iteration Execution Values
		    				</f:facet>
		
						<p:column headerText="Name">
							<h:outputText value="#{plogIterValue.procedureOutputField.displayLabel}" />
						</p:column>
						<p:column headerText="Value">
							<h:outputText value="#{plogIterValue.data}" />
						</p:column>
						
						<p:column headerText="Units">
							<h:outputText value="#{plogIterValue.procedureOutputField.units}" />
						</p:column>
						<p:column headerText="Description">
							<h:outputText value="#{plogIterValue.procedureOutputField.description}" />
						</p:column>
		
					</p:dataTable>
				
					<p:dataList value="#{procedureController.procedure.procedureCcdFrameList}" var="procedureFrame" type="definition">
		        		<f:facet name="header">
		            		Associated Frames/Centroid Reports
		        		</f:facet>
		        		<p:spacer width="10px"/>
		
		       			<p:commandLink ajax="true" actionListener="#{procedureController.selectFrameLogListener(procedureFrame)}" update=":frameLogForm" oncomplete="frameLogDialog.show();" style="font-weight:normal;color:blue" >
							<h:outputText value="Frame #{procedureFrame.procedureFrameNumber + 1} Report"/>
						</p:commandLink>
		    		</p:dataList>
				
				
				</p:tab>
			</p:tabView>
			
			
			
			
			
			</p:tab>
			
			</p:tabView>
			

		</h:form>
	</p:dialog>

</ui:composition>

</html>
