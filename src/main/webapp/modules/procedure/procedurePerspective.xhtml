<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="pollerForm">
			<!-- keep the poller outside its update fixes it so that it stops correctly -->

		<h:form id="frameHiddenForm">

			</audio>
		
		</h:form>

			<p:panelGrid id="procedureDetailPanel" columns="3" styleClass="pcsExecutionPanel">

						<p:panelGrid columns="1" style="padding:0;margin:0;border:1px">

							<canvas id="frameCanvas" width="512px" height="512px" style="border:1px solid #d3d3d3;cursor:crosshair" > Your browser does not support the HTML5 canvas tag.</canvas>

<script>

//<![CDATA[
    		
  // prevent auto submit of form
  $(document).ready(function() {
	  $('input,select').keypress(function(event) { return event.keyCode != 13; }); 
});	

    var mousePos;
    var moving = false;
      
	function initCanvasEvents() {
		var canvas = document.getElementById("frameCanvas");
		canvas.addEventListener("mousedown", doMouseDown, false);
		canvas.addEventListener('mousemove', doMouseMove, false);

	}
	
	function removeCanvasEvents() {
		var canvas = document.getElementById("frameCanvas");
		canvas.removeEventListener("mousedown",doMouseDown);
		canvas.removeEventListener("mousemove",doMouseMove);
	}
	
	
	function doMouseDown(event) {  		
		
		var canvas = $('#frameCanvas');
		canvas_x = event.pageX - canvas.offset().left;
		canvas_y = event.pageY - canvas.offset().top;
		// call javascript function that is defined in <p:remote>
		handMark([{name: 'canvas_x', value: canvas_x}, {name: 'canvas_y', value: canvas_y}]);
	}

	
	function drawFrame() {
		window.setTimeout("drawFrame2(false)", 500);
	}
		
	function markFrame() {
		
		window.setTimeout("drawFrame2(true)", 500);
	}
	
	function drawFrame2(mark) {
		removeCanvasEvents();
		var c = document.getElementById("frameCanvas");

		var ctx = c.getContext("2d");
		
		var img = document.getElementById("procedureDetailForm:frameImage");
		
		ctx.drawImage(img,0,0,c.width,c.height);
		
		initCanvasEvents();
		
		if (mark)
			markFrame2(c, ctx, img);
		
		initCanvasEvents();
	}
		
	function markFrame2(c, ctx, img) {
		
		console.log("about to mark frame")
		
		var xField = document.getElementById('frameHiddenForm:centroidXs').value;
	 	var xArray = xField.split(','); 
		var yField = document.getElementById('frameHiddenForm:centroidYs').value;
	 	var yArray = yField.split(','); 
		var spotRad = document.getElementById('frameHiddenForm:spotRadius').value;
		var handMark = document.getElementById('frameHiddenForm:handMark').value;
		
		ctx.font = "12px Arial";
	 	ctx.fillStyle = "red";

		//console.log("about to loop: " + xField )

		
	 	if (xField != null && xField.length > 0) {
	 	
			for (var i = 0; i < xArray.length; i++) {
				
				if (xArray[i] != 0.0 && yArray[i] != 0.0) {

					//console.log("marking")

					ctx.beginPath();
					// divide by 2 when frame is displayed 512x512
					ctx.arc(xArray[i]/2,yArray[i]/2,spotRad/2,0,2*Math.PI);
					ctx.strokeStyle = '#ff0000';
					ctx.lineWidth = 2;
					ctx.stroke();
					if (handMark == "true") {
						ctx.fillText("" + (i+1), xArray[i]/2 - 14, yArray[i]/2 - 15);
					}
				}
			}
		}
		
	}
	
	function scrollStatusLog() {
		var objDiv = document.getElementById('procedureDetailForm:controlPanel:procedureEventLogPanel');
		objDiv.scrollTop = objDiv.scrollHeight;
	}
	
	function play_wake_up_sound() {
		document.getElementById('audiocontrol').play();
	}
	function stop_wake_up_sound() {
		document.getElementById('audiocontrol').pause();
		document.getElementById('audiocontrol').load();
	}
	
 	function displayFrameValue() {
 			
 		var pixelValue = document.getElementById('frameHiddenForm:pixelValue').value;
 		var message = '    Mouse position: (' + Math.floor(mousePos.x) + ', ' + Math.floor(mousePos.y) + '),  value = ' + pixelValue;
        var infoCanvas = document.getElementById("infoCanvas");
        writeMessage(infoCanvas, message);
 	}

	function doMouseMove(event) {
	
 		var canvas = document.getElementById("frameCanvas");
  		mousePos = getMousePos(canvas, event);

		if (!moving) {
			moving = true;
			window.setTimeout("mouseMoveHandler()", 300);
		}
   	}
		
	function mouseMoveHandler() {
		
 		// convert 512 to 1024
  		mousePos.x = mousePos.x * 2;
  		mousePos.y = mousePos.y * 2;
  		
 		// call javascript function that is defined in <p:remote>
 		frameValue([{name: 'mouse_x', value: mousePos.x}, {name: 'mouse_y', value: mousePos.y}]);

 		moving = false;
	}
	
	function writeMessage(infoCanvas, message) {
        var context = infoCanvas.getContext('2d');
        context.clearRect(0, 0, 300, 15);
        context.font = '10pt Arial';
        context.fillStyle = '#444444';
        context.fillText(message, 1, 12);
      }
	
      function getMousePos(canvas, evt) {
    	var canvas = document.getElementById("frameCanvas");
        var rect = canvas.getBoundingClientRect();
        return {
          x: evt.clientX - rect.left,
          y: evt.clientY - rect.top
        };
      }
	
    function saveCanvasPng() {
		var canvas = document.getElementById("frameCanvas");
		var button = document.getElementById("saveAsPngId");
	    var img = canvas.toDataURL("image/png");
	    button.href = img;
	    button.click();
      }

    
    drawFrame();
