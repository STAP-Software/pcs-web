<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="pollerForm">
			<!-- keep the poller outside its update fixes it so that it stops correctly -->
			<p:poll widgetVar="procedureExecutionPoller" autoStart="false"
				update=":growl :menuForm :advancedForm :executionPrefsForm" listener="#{asyncController.asyncListener}"
				stop="#{!asyncController.executionStatus}" oncomplete="scrollStatusLog()"/>
		</h:form>
		<h:form id="frameHiddenForm">
			<h:inputHidden id="centroidXs" value="#{procedureController.frameCentroidXs}" />
			<h:inputHidden id="centroidYs" value="#{procedureController.frameCentroidYs}" />
			<h:inputHidden id="spotRadius" value="#{procedureController.frameSearchRadius}" />
		</h:form>

		<h:form id="procedureDetailForm">
			
			<p:spacer height="10px" />


			<p:panelGrid id="procedureDetailPanel" columns="3" styleClass="pcsExecutionPanel">

				<p:accordionPanel id="controlPanel" multiple="true" activeIndex="0,1,2">

					<p:tab title="Procedure Configuration">

						<p:panelGrid id="configPanel" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">
				
							<p:row rendered="#{procedureController.renderPupilMaskSelect}">
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Mask" />
								</p:column>
								<p:column styleClass="btmsFormInputColumn">
									<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.pupilMask}" converter="#{pupilMaskConverter}" disabled="#{procedureController.procedure.procedureState gt 1}">
										<f:selectItem itemLabel="Select One" itemValue=""/> 
										<f:selectItems value="#{sessionController.instrument.camera.pupilWheel.origPupilMaskList}" var="mask" itemLabel="#{mask.maskName}" itemValue="#{mask}" />
										<p:ajax update=":advancedForm intTime" listener="#{procedureController.doUpdatePupilMask}" />
									</p:selectOneMenu>
								</p:column>
							</p:row>


							<p:row>
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Integration Time (sec)" />
								</p:column>
								<p:column styleClass="btmsFormInputColumn">
									<p:selectOneMenu id="intTime" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.integrationTime}" editable="true"
										disabled="#{procedureController.procedure.procedureState gt 1}" styleClass="intTime">
										<f:selectItems value="#{procedureController.procedure.procedureConfigSet.procedureConfig.integrationTimeList}" /> 
									</p:selectOneMenu>
								</p:column>
							</p:row>

							<p:row rendered="#{procedureController.renderNumTrials}">
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Number of Trials" />
								</p:column>   
								<p:column styleClass="btmsFormInputColumn">
									<p:inputMask mask="9?9" maxlength="2" placeHolder=" " value="#{procedureController.procedure.procedureConfigSet.procedureConfig.numberOfTrials}"
										size="2" disabled="#{procedureController.procedure.procedureState gt 1}" />
								</p:column>
							</p:row>

							<p:row rendered="#{sessionController.advancedViewMode}">
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Frame Source" />
								</p:column>
								<p:column styleClass="btmsFormInputColumn">
									<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.frameSource}"
										disabled="#{procedureController.procedure.procedureState gt 1}">
										<f:selectItem itemLabel="Select One" itemValue="" />
										<f:selectItem itemLabel="CCD" itemValue="1" />
										<f:selectItem itemLabel="File" itemValue="2" />
										<p:ajax update="configPanel startButton" listener="#{procedureController.frameSourceListener}" />
									</p:selectOneMenu>
									<p:spacer width="10px" />
									<p:commandButton id="openFitsFolder" icon="ui-icon-folder-open" type="button"
										rendered="#{procedureController.procedure.procedureConfigSet.procedureConfig.frameSource eq 2}" styleClass="thinPadding"
										onclick="fitsFileLoadDialog.show();" style="top:-5px" disabled="#{procedureController.procedure.procedureState gt 1}" />
								</p:column>
							</p:row>

						</p:panelGrid>
					</p:tab>


					<p:tab id="statusAndControlTab" title="Status and Control">

						<p:panelGrid id="statusAndControlPanel" columns="2" styleClass="btmsForm" columnClasses="peasFormLabelColumn, peasFormOutputColumn">
							<h:outputLabel value="Procedure Type" />
							<h:outputText value="#{procedureController.procedure.procedureType.procedureTypeName}" />
							<h:outputLabel value="Procedure #" />
							<h:panelGroup>
							<h:outputText value="#{procedureController.procedure.procedureNumber}" />
							<p:spacer height="1px" width="15px"/>
							<p:commandLink ajax="true" update=":procedureLogForm" oncomplete="procedureLogDialog.show();" style="font-weight:normal;color:blue"  rendered="#{procedureController.procedure.procedureState ge 3}">
								<h:outputText value="Procedure Log" />
							</p:commandLink>
							</h:panelGroup>
							<h:outputLabel value="Status" rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputText value="#{procedureController.procedure.procedureStateDisplayString}"
								rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputLabel value="Execution Start" rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputText value="#{procedureController.procedure.executionStartTime}"
								rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputLabel value="Execution End" rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputText value="#{procedureController.procedure.executionEndTime}"
								rendered="#{procedureController.procedure.procedureState ge 3}" />
						</p:panelGrid>

						<p:spacer height="10px" width="40px" />
						<h:panelGroup rendered="#{procedureController.procedure.procedureState lt 3}">
							<p:commandButton id="startButton" value="Start" icon="ui-icon-play" actionListener="#{procedureController.doExecuteProcedure}" styleClass="noupdate"
								onclick="startButton2.disable();" oncomplete="procedureExecutionPoller.start();" widgetVar="startButton2" update=":menuForm"
								disabled="#{asyncController.executionStatus or not procedureController.startEnabled}" />
							<p:spacer width="30px" />
							<p:commandButton value="Abort" icon="ui-icon-close" action="#{procedureController.doAbortProcedure}" /> 
							<br />
							<br />
							<p:progressBar widgetVar="pbAjax" value="#{asyncController.percentComplete}" labelTemplate="{value}%" styleClass="animated"
								displayOnly="true" />
							<!-- 
						<p:progressBar widgetVar="pbAjax" ajax="true" value="#{asyncController.percentComplete}" labelTemplate="{value}%" styleClass="animated">
							<p:ajax event="complete" listener="#{asyncController.onComplete}" update=":procedureDetailForm" />
						</p:progressBar>
						 -->
						 
						</h:panelGroup>
						<br/>
						<p:spacer height="1px" width="320px" />

					</p:tab>
					<p:tab title="Procedure Event Log">
						<p:scrollPanel id="procedureEventLogPanel" style="width:320px;height:206px" mode="native">
							<p:dataTable styleClass="eventLogTable" var="logEntry" value="#{statusLogController.procedureStatusLog.logEntryList}">

								<p:column headerText="Time">
									<h:outputText value="#{logEntry.createDate}" style="font-size: 10px">
										<f:convertDateTime pattern="hh:mm:ss" />
									</h:outputText>
								</p:column>
								<p:column headerText="Status" style="white-space:pre-wrap; ">
									<h:outputText escape="false" value="#{logEntry.status}" style="font-size: 10px; white-space:pre-wrap;" />
								</p:column>

							</p:dataTable>
						</p:scrollPanel>
					</p:tab>
				</p:accordionPanel>

				<h:panelGroup id="framePanel">
					<p:panelGrid columns="1" style="padding:0;margin:0" styleClass="btmsForm noupdate"
						rendered="#{procedureController.procedure.procedureState eq 1}">

						<p:panelGrid columns="1" style="padding:0;margin:0">

							<p:spacer width="512" height="212" />
							<br />

							<p:panelGrid columns="1" style="padding:0; margin:auto; width: 200px; text-align:center">
								<h:outputText value="Loaded Frames from File:" rendered="#{not empty procedureController.selectedFitsFiles}" />
								<h:outputText style="text-align:center" value="No CCD Images" rendered="#{empty procedureController.selectedFitsFiles}" />
								<ul>
									<ui:repeat value="#{procedureController.selectedFitsFiles}" var="fitsFile">
										<li><h:outputText value="#{fitsFile.fileName}" /></li>
									</ui:repeat>
								</ul>
							</p:panelGrid>
						</p:panelGrid>

					</p:panelGrid>

					<p:panelGrid columns="1" style="padding:0;margin:0" styleClass="btmsForm noupdate"
						rendered="#{procedureController.procedure.procedureState eq 2}">
						<f:facet name="header">
							<h:outputText id="fitsFilename" value="#{procedureController.procedure.latestProcedureCcdFrame.ccdFrame.fitsFilename}" />
						</f:facet>

						<p:graphicImage id="frameImage"  value="#{procedureController.graphicImage}" height="512px" width="512px" style="position: absolute;left:-10000px" />
					
					<canvas id="frameCanvas" width="512px" height="512px" style="border:1px solid #d3d3d3;" >
Your browser does not support the HTML5 canvas tag.</canvas>

						<p:panelGrid styleClass="pcsFormNoBorder" columnClasses="peasFormLabelColumn, peasFormOutputColumn">

							<p:row>
								<p:column styleClass="peasFormLabelColumn" style="width:35%">
									<h:outputLabel value="Search Radius (pixels):" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:15%">
									<h:outputText value="8" />
								</p:column>
								<p:column styleClass="peasFormLabelColumn" style="width:15%">
									<h:outputLabel value="SNR:" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:35%">
									<h:outputText value="10.8" />
								</p:column>
							</p:row>
						</p:panelGrid>

						<f:facet name="footer">
							<p:commandButton style="float:right" value="Reset" icon="ui-icon-refresh" ajax="true"
								action="#{procedureController.doResetMarking}" update="framePanel :frameHiddenForm" disabled="#{not asyncController.frameMarkActionPending}" oncomplete="markFrame();"/>
							<p:commandButton style="float:right" value="Apply Marking" icon="ui-icon-check" ajax="true"
								action="#{procedureController.doApplyMarking}" update=":growl framePanel :frameHiddenForm" disabled="#{not asyncController.frameMarkActionPending}" oncomplete="markFrame();"/>
						</f:facet>
					</p:panelGrid>

					<p:panelGrid columns="1" style="padding:0;margin:0" styleClass="btmsForm noupdate"
						rendered="#{procedureController.procedure.procedureState ge 3}">

						<!--  show this when procedure is done -->
						<!-- 
						<p:carousel id="frameCarousel" value="#{procedureController.procedure.procedureCcdFrameList}" var="procedureCcdFrame" rows="1" >

							<p:panelGrid columns="1" style="padding:0;margin:0">
								<f:facet name="header">
									<h:outputText value="#{procedureCcdFrame.ccdFrame.fitsFilename}" />
								</f:facet>

								<p:graphicImage value="#{procedureController.graphicImage}" height="512px" width="512px">
									<f:param name="frameIndex" value="#{procedureCcdFrame.procedureFrameNumber}" />
								</p:graphicImage>
							</p:panelGrid>
														
						</p:carousel>
						 -->
						<p:panelGrid columns="1" style="padding:0;margin:0;border:1px">
							<f:facet name="header">
								<h:panelGroup>
								<h:outputText value="Frame # " style="float:left;position:relative;top:7px;margin-right:10px"/>
								<p:selectOneButton value="#{procedureController.selectedFrameNumber}" style="float:left">
									<f:selectItems value="#{procedureController.procedure.procedureCcdFrameList}" var="procedureCcdFrame"
                       					itemLabel="#{procedureCcdFrame.procedureFrameNumber + 1}" itemValue="#{procedureCcdFrame.procedureFrameNumber}" />
            						<p:ajax listener="#{procedureController.frameSelectListener}" update="framePanel miscPanel"/>
        						</p:selectOneButton>
        						</h:panelGroup>
							</f:facet>
							
							<p:panelGrid columns="1" style="padding:0;margin:0;border:1px">
								<f:facet name="header">
									<h:outputText value="#{procedureController.selectedFrame.ccdFrame.fitsFilename}" />
								</f:facet>
								<p:graphicImage value="#{procedureController.graphicImage}" height="512px" width="512px" />
							</p:panelGrid>
						</p:panelGrid>
						
						

						<p:panelGrid styleClass="pcsFormNoBorder" columnClasses="peasFormLabelColumn, peasFormOutputColumn">

							<p:row>
								<p:column styleClass="peasFormLabelColumn" style="width:35%">
									<h:outputLabel value="Search Radius (pixels):" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:15%">
									<h:outputText value="8" />
								</p:column>
								<p:column styleClass="peasFormLabelColumn" style="width:15%">
									<h:outputLabel value="SNR:" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:35%">
									<h:outputText value="10.8" />
								</p:column>
							</p:row>
						</p:panelGrid>

					</p:panelGrid>
				</h:panelGroup>


 				<p:accordionPanel id="miscPanel" multiple="true" activeIndex="0,1">

					<p:tab title="Procedure Context">

						<p:panelGrid id="configPanel" columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

							<h:outputLabel value="Test #" />
							<p:inputText size="4" value="#{procedureController.procedure.testNumber}" />

							<h:outputLabel value="ACS Snap # After" />
							<p:inputText size="4" value="#{procedureController.procedure.acsSnapNumberAfter}" />

							<h:outputLabel value="Comments" />
							<p:inputTextarea value="#{procedureController.procedure.comments}" rows="1" cols="30" />

							<f:facet name="footer">
								<p:commandButton style="float:right" value="Save" icon="ui-icon-check" ajax="false" action="#{procedureController.doSaveContext}" />
								<p:commandButton style="float:right" value="Reset" icon="ui-icon-refresh"  update="configPanel" process="@this" >
									<p:resetInput target="configPanel" />
								</p:commandButton>
							</f:facet>
						</p:panelGrid>
					</p:tab>
					
					<p:tab title="Phasing Camera State" rendered="#{not procedureController.procedure.archivedProcedure}" >
						<ui:include src="../diagnostic/cameraStatusBlock.xhtml" />
					</p:tab>
					<p:tab title="Phasing Camera State for Current Frame" rendered="#{procedureController.procedure.archivedProcedure}" >
						<ui:include src="cameraState.xhtml" />
					</p:tab>
 
				</p:accordionPanel>

			</p:panelGrid>
			<p:remoteCommand name="handMark" action="#{procedureController.doHandMark}" update=":frameHiddenForm" oncomplete="markFrame();" />
		</h:form>

		<ui:include src="advancedOptions.xhtml" />
		<ui:include src="procedureLogDialog.xhtml" />
		<ui:include src="executionPreferences.xhtml" />
		<ui:include src="fitsFileLoadDialog.xhtml" />

<script>

//<![CDATA[
    		
  // prevent auto submit of form
  $(document).ready(function() {
	  $('input,select').keypress(function(event) { return event.keyCode != 13; }); 
});	

	function initCanvasEvents() {
		var canvas = document.getElementById("frameCanvas");
		canvas.addEventListener("mousedown", doMouseDown, false);
	}
	
	function doMouseDown(event) {  		
		
		var canvas = $('#frameCanvas');
		canvas_x = event.pageX - canvas.offset().left;
		canvas_y = event.pageY - canvas.offset().top;
		// call javascript function that is defined in <p:remote>
		handMark([{name: 'canvas_x', value: canvas_x}, {name: 'canvas_y', value: canvas_y}]);
	}

	
	function drawFrame() {
		window.setTimeout("drawFrame2(false)", 100);
	}
		
	function markFrame() {
		
		window.setTimeout("drawFrame2(true)", 100);
	}
	
	function drawFrame2(mark) {
		var c = document.getElementById("frameCanvas");
		var ctx = c.getContext("2d");
		
		var img = document.getElementById("procedureDetailForm:frameImage");
		
		ctx.drawImage(img,0,0,c.width,c.height);
		
		initCanvasEvents();
		
		if (mark)
			markFrame2(c, ctx, img);
	}
		
	function markFrame2(c, ctx, img) {
				
		var xField = document.getElementById('frameHiddenForm:centroidXs').value;
	 	var xArray = xField.split(','); 
		var yField = document.getElementById('frameHiddenForm:centroidYs').value;
	 	var yArray = yField.split(','); 
		var spotRad = document.getElementById('frameHiddenForm:spotRadius').value;
		
	 	if (xField != null && xField.length > 0) {
	 	
			for (var i = 0; i < xArray.length; i++) {
				ctx.beginPath();
				// divide by 2 when frame is displayed 512x512
				ctx.arc(xArray[i]/2,yArray[i]/2,spotRad,0,2*Math.PI);
				ctx.strokeStyle = '#ffffaa';
				ctx.lineWidth = 2;
				ctx.stroke();
			}
		}
		initCanvasEvents();
	}
	
	function scrollStatusLog() {
		var objDiv = document.getElementById('procedureDetailForm:controlPanel:procedureEventLogPanel');
		objDiv.scrollTop = objDiv.scrollHeight;
	}
	//]]>
	
</script>
	</ui:define>
</ui:composition>
</html>
