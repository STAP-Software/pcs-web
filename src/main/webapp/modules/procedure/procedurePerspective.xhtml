<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="pollerForm">
			<!-- keep the poller outside its update fixes it so that it stops correctly -->
			<p:poll widgetVar="procedureExecutionPoller" autoStart="false"
				update=":procedureDetailForm :growl :menuForm :advancedForm :executionPrefsForm" listener="#{asyncController.asyncListener}"
				stop="#{!asyncController.executionStatus}" />
		</h:form>

		<h:form id="procedureDetailForm">


			<p:spacer height="10px" />


			<p:panelGrid id="procedureDetailPanel" columns="3" styleClass="pcsExecutionPanel">

				<p:accordionPanel id="controlPanel" multiple="true" activeIndex="0,1,2">

					<p:tab title="Procedure Configuration">

						<p:panelGrid id="configPanel" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

							<p:row>
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Filter" />
								</p:column>
								<p:column styleClass="btmsFormInputColumn">
									<p:selectOneMenu value="#{procedureController.procedure.procedureConfig.filter}"
										disabled="#{procedureController.procedure.procedureState gt 1}">
										<f:selectItem itemLabel="Select One" itemValue="" />
										<f:selectItem itemLabel="611 nm" itemValue="611" />
										<f:selectItem itemLabel="618 nm" itemValue="618" />
										<f:selectItem itemLabel="651 nm" itemValue="651" />
										<f:selectItem itemLabel="852 nm" itemValue="852" />
										<f:selectItem itemLabel="870 nm" itemValue="870" />
										<f:selectItem itemLabel="891 nm" itemValue="891" />
									</p:selectOneMenu>
								</p:column>
							</p:row>

							<p:row>
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Integration Time" />
								</p:column>
								<p:column styleClass="btmsFormInputColumn">
									<p:selectOneMenu value="#{procedureController.procedure.procedureConfig.integrationTime}"
										disabled="#{procedureController.procedure.procedureState gt 1}">
										<f:selectItem itemLabel="Select One" itemValue="" />
										<f:selectItem itemLabel="20.00 sec" itemValue="20.00" />
										<f:selectItem itemLabel="30.00 sec" itemValue="30.00" />
										<f:selectItem itemLabel="40.00 sec" itemValue="40.00" />
										<f:selectItem itemLabel="50.00 sec" itemValue="50.00" />
									</p:selectOneMenu>
								</p:column>
							</p:row>

							<p:row>
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Number of Trials" />
								</p:column>
								<p:column styleClass="btmsFormInputColumn">
									<p:inputMask mask="9?9" maxlength="2" placeHolder=" " value="#{procedureController.procedure.procedureConfig.numberOfTrials}"
										size="2" disabled="#{procedureController.procedure.procedureState gt 1}" />
								</p:column>
							</p:row>

							<p:row>
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Frame Source" />
								</p:column>
								<p:column styleClass="btmsFormInputColumn">
									<p:selectOneMenu value="#{procedureController.procedure.procedureConfig.frameSource}"
										disabled="#{procedureController.procedure.procedureState gt 1}">
										<f:selectItem itemLabel="Select One" itemValue="" />
										<f:selectItem itemLabel="CCD" itemValue="1" />
										<f:selectItem itemLabel="File" itemValue="2" />
										<p:ajax update="configPanel" listener="#{procedureController.frameSourceListener}" />
									</p:selectOneMenu>
									<p:spacer width="10px" />
									<p:commandButton id="openFitsFolder" icon="ui-icon-folder-open" type="button"
										rendered="#{procedureController.procedure.procedureConfig.frameSource eq 2}" styleClass="thinPadding"
										onclick="fitsFileLoadDialog.show();" style="top:-5px" disabled="#{procedureController.procedure.procedureState gt 1}" />
								</p:column>
							</p:row>

						</p:panelGrid>
					</p:tab>


					<p:tab id="statusAndControlTab" title="Status and Control">

						<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="peasFormLabelColumn, peasFormOutputColumn">
							<h:outputLabel value="Procedure Type" />
							<h:outputText value="Passive Tilt" />
							<h:outputLabel value="Procedure #" />
							<h:outputText value="#{procedureController.procedure.procedureNumber}" />
							<h:outputLabel value="Status" rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputText value="#{procedureController.procedure.procedureStateDisplayString}"
								rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputLabel value="Execution Start" rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputText value="#{procedureController.procedure.executionStartTime}"
								rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputLabel value="Execution End" rendered="#{procedureController.procedure.procedureState ge 3}" />
							<h:outputText value="#{procedureController.procedure.executionEndTime}"
								rendered="#{procedureController.procedure.procedureState ge 3}" />
						</p:panelGrid>

						<p:spacer height="10px" width="40px" />
						<h:panelGroup rendered="#{procedureController.procedure.procedureState lt 3}">
							<p:commandButton value="Start" icon="ui-icon-play" actionListener="#{procedureController.doExecuteProcedure}" styleClass="noupdate"
								onclick="startButton2.disable();" oncomplete="procedureExecutionPoller.start();" widgetVar="startButton2" update=":menuForm"
								disabled="#{asyncController.executionStatus}" />
							<p:spacer width="30px" />
							<p:commandButton value="Abort" icon="ui-icon-close" actionListener="#{asyncController.doAbortProcedure}"
								oncomplete="pbAjax.cancel();startButton2.enable();" />
							<br />
							<br />
							<p:progressBar widgetVar="pbAjax" value="#{asyncController.percentComplete}" labelTemplate="{value}%" styleClass="animated"
								displayOnly="true" />
							<!-- 
						<p:progressBar widgetVar="pbAjax" ajax="true" value="#{asyncController.percentComplete}" labelTemplate="{value}%" styleClass="animated">
							<p:ajax event="complete" listener="#{asyncController.onComplete}" update=":procedureDetailForm" />
						</p:progressBar>
						 -->
						</h:panelGroup>

					</p:tab>
					<p:tab title="Procedure Event Log">
						<p:scrollPanel style="width:100%;height:206px" mode="native">
							<p:dataTable id="sessionTable" var="logEntry" value="#{statusLogController.procedureStatusLog.logEntryList}">

								<p:column headerText="Time">
									<h:outputText value="#{logEntry.createDate}" style="font-size: 10px">
										<f:convertDateTime pattern="hh:mm:ss" />
									</h:outputText>
								</p:column>
								<p:column headerText="Status">
									<h:outputText value="#{logEntry.status}" style="font-size: 10px" />
								</p:column>

							</p:dataTable>
						</p:scrollPanel>
					</p:tab>
				</p:accordionPanel>

				<h:panelGroup id="framePanel">
					<p:panelGrid columns="1" style="padding:0;margin:0" styleClass="btmsForm noupdate"
						rendered="#{procedureController.procedure.procedureState eq 1}">


						<p:panelGrid columns="1" style="padding:0;margin:0">

							<p:spacer width="512" height="212" />
							<br />

							<p:panelGrid columns="1" style="padding:0; margin:auto; width: 200px; text-align:center">
								<h:outputText value="Loaded Frames from File:" rendered="#{not empty procedureController.selectedFitsFiles}" />
								<h:outputText style="text-align:center" value="No CCD Images" rendered="#{empty procedureController.selectedFitsFiles}" />
								<ul>
									<ui:repeat value="#{procedureController.selectedFitsFiles}" var="fitsFile">
										<li><h:outputText value="#{fitsFile.fileName}" /></li>
									</ui:repeat>
								</ul>
							</p:panelGrid>
						</p:panelGrid>

					</p:panelGrid>

					<p:panelGrid columns="1" style="padding:0;margin:0" styleClass="btmsForm noupdate"
						rendered="#{procedureController.procedure.procedureState eq 2}">
						<f:facet name="header">
							<h:outputText id="fitsFilename" value="#{procedureController.procedure.latestProcedureCcdFrame.ccdFrame.fitsFilename}" />
						</f:facet>


						<p:graphicImage value="#{procedureController.graphicImage}" height="512px" width="512px" />

						<p:panelGrid styleClass="pcsFormNoBorder" columnClasses="peasFormLabelColumn, peasFormOutputColumn">

							<p:row>
								<p:column styleClass="peasFormLabelColumn" style="width:35%">
									<h:outputLabel value="Search Radius (pixels):" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:15%">
									<h:outputText value="8" />
								</p:column>
								<p:column styleClass="peasFormLabelColumn" style="width:15%">
									<h:outputLabel value="SNR:" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:35%">
									<h:outputText value="10.8" />
								</p:column>
							</p:row>
						</p:panelGrid>

						<f:facet name="footer">
							<p:commandButton style="float:right" value="Done" icon="ui-icon-close" ajax="false" action="#{ccdManualController.doCancel}" />
							<p:commandButton style="float:right" value="Reset" icon="ui-icon-refresh" ajax="true"
								action="#{globalConfigController.doCancelSaveSetup}" />
							<p:commandButton style="float:right" value="Apply Marking" icon="ui-icon-check" ajax="true"
								action="#{ccdManualController.doSendCommand}" update=":growl" />
						</f:facet>
					</p:panelGrid>

					<p:panelGrid columns="1" style="padding:0;margin:0" styleClass="btmsForm noupdate"
						rendered="#{procedureController.procedure.procedureState ge 3}">

						<!--  show this when procedure is done -->
						<p:carousel id="frameCarousel" value="#{procedureController.procedure.procedureCcdFrameList}" var="procedureCcdFrame" rows="1">

							<p:panelGrid columns="1" style="padding:0;margin:0">
								<f:facet name="header">
									<h:outputText value="#{procedureCcdFrame.ccdFrame.fitsFilename}" />
								</f:facet>

								<p:graphicImage value="#{procedureController.graphicImage}" height="512px" width="512px">
									<f:param name="frameIndex" value="#{procedureCcdFrame.procedureFrameNumber}" />
								</p:graphicImage>
							</p:panelGrid>
						</p:carousel>

						<p:panelGrid styleClass="pcsFormNoBorder" columnClasses="peasFormLabelColumn, peasFormOutputColumn">

							<p:row>
								<p:column styleClass="peasFormLabelColumn" style="width:35%">
									<h:outputLabel value="Search Radius (pixels):" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:15%">
									<h:outputText value="8" />
								</p:column>
								<p:column styleClass="peasFormLabelColumn" style="width:15%">
									<h:outputLabel value="SNR:" />
								</p:column>
								<p:column styleClass="peasFormOutputColumn" style="width:35%">
									<h:outputText value="10.8" />
								</p:column>
							</p:row>
						</p:panelGrid>

					</p:panelGrid>
				</h:panelGroup>

				<p:accordionPanel multiple="true" activeIndex="0,1">

					<p:tab title="Procedure Context">

						<p:panelGrid id="configPanel" columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

							<h:outputLabel value="Test #" />
							<p:inputText size="4" value="#{procedureController.procedure.testNumber}" />

							<h:outputLabel value="ACS Snap # After" />
							<p:inputText size="4" value="#{procedureController.procedure.acsSnapNumberAfter}" />

							<h:outputLabel value="Star Name" />
							<p:inputText size="20" value="#{procedureController.procedure.starName}" />

							<h:outputLabel value="Star Sp Type" />
							<p:inputText size="4" value="#{procedureController.procedure.starSpType}" />

							<h:outputLabel value="Star Vmag" />
							<p:inputText size="4" value="#{procedureController.procedure.starVmag}" />

							<h:outputLabel value="Comments" />
							<p:inputTextarea value="#{procedureController.procedure.comments}" rows="1" cols="30" />

							<f:facet name="footer">
								<p:commandButton style="float:right" value="Save" icon="ui-icon-check" ajax="false" action="#{ccdManualController.doCancel}" />
								<p:commandButton style="float:right" value="Reset" icon="ui-icon-refresh" ajax="true"
									action="#{globalConfigController.doCancelSaveSetup}" />
							</f:facet>
						</p:panelGrid>
					</p:tab>



					<p:tab title="Visualization Displays">
						<p:panelGrid columns="1" styleClass="btmsForm">


						  	<p:tree value="#{procedureController.visualizationDisplayRoot}" var="node" dynamic="true" cache="false" selectionMode="single" selection="#{treeBean.selectedNode}"
								id="tree" expanded="true">

								<p:treeNode type="folder">
									<h:outputText value="#{node}"  />
								</p:treeNode>
								<p:treeNode type="link">
									<p:commandLink value="#{node}" onclick="displayDialog.show();" />
								</p:treeNode>
							</p:tree>


							<p:commandLink value="Download Procedure Report" />

						</p:panelGrid>
					</p:tab>
					<p:tab title="Phasing Camera State">
						<p:panelGrid columns="2" styleClass="btmsForm" columnClasses="peasFormLabelColumn, peasFormOutputColumn">

							<h:outputLabel value="Coarse Mirror Offset" />
							<h:outputText value="" />
							<h:outputLabel value="x (&#181;m)" />
							<h:outputText value="5.0" />
							<h:outputLabel value="y (&#181;m)" />
							<h:outputText value="-12.3" />
							<h:outputLabel value="Fine Mirror Offset" />
							<h:outputText value="" />
							<h:outputLabel value="x (&#181;m)" />
							<h:outputText value="32.1" />
							<h:outputLabel value="y (&#181;m)" />
							<h:outputText value="-16.0" />
							<h:outputLabel value="Filter Wheel Position" />
							<h:outputText value="611 nm" />
							<h:outputLabel value="Pupil Mask Wheel Position" />
							<h:outputText value="036" />
							<h:outputLabel value="CCD Temperature" />
							<h:outputText value="-60.2 C" />
						</p:panelGrid>
					</p:tab>
				</p:accordionPanel>

			</p:panelGrid>

		</h:form>

		<ui:include src="advancedOptions.xhtml" />
		<ui:include src="executionPreferences.xhtml" />
		<ui:include src="fitsFileLoadDialog.xhtml" />

	</ui:define>
</ui:composition>
</html>
