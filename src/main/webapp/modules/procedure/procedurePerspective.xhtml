<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui"  xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">
	
		<h:form>
			  
			<p:poll interval="2" update=":procedureDetailForm:controlPanel:startButton :procedureDetailForm:controlPanel:cameraNotReady  :procedureDetailForm:miscPanel:cameraStatusPanel" />
			
		</h:form>  
		
		<h:form id="pollerForm">
			<!-- keep the poller outside its update fixes it so that it stops correctly -->
			<!-- p:poll widgetVar="procedureExecutionPoller" autoStart="false" interval="2"
				update="@none" listener="#{asyncController.asyncListener}"
				 oncomplete="scrollStatusLog()"  /> -->
				 
				 <!-- stop="#{asyncController.onCompletePerformed}" update=":growl :errorGrowl :menuForm :advancedForm :executionPrefsForm :procedureDetailForm:procedureEventLogPanel:procedureEventLogTable" -->
				
			<p:poll interval="2" listener="#{asyncController.asyncListener}" update=":growl :errorGrowl :menuForm :advancedForm :executionPrefsForm" 
				widgetVar="procedureExecutionPoller" autoStart="false" oncomplete="scrollStatusLog()" />
			
		</h:form>
		<h:form id="frameHiddenForm">
			<h:inputHidden id="centroidXs" value="#{procedureController.frameCentroidXs}" />
			<h:inputHidden id="centroidYs" value="#{procedureController.frameCentroidYs}" />
			<h:inputHidden id="spotRadius" value="#{procedureController.frameSearchRadius}" />
			<h:inputHidden id="handMark" value="#{procedureController.frameMarkingMode}" />
			<h:inputHidden id="markedDisplayMode" value="#{procedureController.markedDisplayMode}" />
			<h:inputHidden id="pixelValue" value="#{procedureController.pixelValue}" />
			<h:inputHidden id="blankImage" value="#{procedureController.blankImage}" />
			<h:inputHidden id="mirrorConfig" value="#{procedureController.mirrorConfigString}" />
		</h:form>

		<h:form id="audioForm">
		
			<audio id="audiocontrol">
	  			<source src="../../resources/sounds/wake_up.ogg" type="audio/ogg" />
			</audio>
		
		</h:form>

		<h:form id="procedureDetailForm">
		
			
			<p:spacer height="10px" />


			<p:panelGrid id="procedureDetailPanel" columns="3" styleClass="pcsExecutionPanel">

				<p:accordionPanel id="controlPanel" multiple="true" activeIndex="0,1,2">

					<p:tab title="Procedure Configuration">
					
						<p:outputPanel id="configPanel" style="padding: 16px;">
		        		
			            	<div class="label-input-grid" 
			                 	style="display: grid; grid-template-columns: max-content max-content;
			                        align-items: baseline; 
			                        row-gap: 24px; column-gap: 24px;">
				
								<h:outputLabel value="Mask" rendered="#{procedureController.renderPupilMaskSelect}"/>

								<p:selectOneMenu id="pupilMaskSelect" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.pupilMask}" 
									converter="#{pupilMaskConverter}" disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.renderPupilMaskSelect}">
									<f:selectItem itemLabel="Select One" itemValue=""/> 
									<f:selectItems value="#{procedureController.pupilMaskSelectList}" var="mask" itemLabel="#{mask.maskName}" itemValue="#{mask}" />
									<p:ajax update=":advancedForm intTime controlPanel startButton" listener="#{procedureController.pupilMaskSelectListener}" />
								</p:selectOneMenu>


								<h:outputLabel value="Register Pupil For" rendered="#{procedureController.renderRegisterForSelect}"/>

								<p:selectOneMenu id="registerPupilForSelect" value="#{procedureController.registerPupilFor}" converter="#{procedureTypeConverter}" 
									disabled="#{procedureController.procedure.procedureState gt 1}" rendered="#{procedureController.renderRegisterForSelect}">
									<f:selectItem itemLabel="Select One" itemValue=""/> 
									<f:selectItems value="#{procedureController.procedureTypeForSelectList}" var="procedureType" itemLabel="#{procedureType.procedureTypeName}" itemValue="#{procedureType}" />
									<p:ajax update=":advancedForm intTime controlPanel startButton" listener="#{procedureController.registerPupilForSelectListener}" />
								</p:selectOneMenu>


								<h:outputLabel value="Coarse Phasing Option" rendered="#{procedureController.procedure.procedureType.coarsePhasing or (procedureController.procedure.procedureType.pupilRegistration and 
									procedureController.registerPupilFor.procedureTypeId == 3)}"/>

								<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.coarsePhasingOption}" disabled="#{procedureController.procedure.procedureState gt 1}"
									rendered="#{procedureController.procedure.procedureType.coarsePhasing or (procedureController.procedure.procedureType.pupilRegistration and procedureController.registerPupilFor.procedureTypeId == 3)}">
									<f:selectItem itemLabel="Select One" itemValue="0"/> 
									<f:selectItem itemLabel="Phasing 30" itemValue="30" />
									<f:selectItem itemLabel="Phasing 100" itemValue="100" />
									<f:selectItem itemLabel="Phasing 300" itemValue="300" />
									<f:selectItem itemLabel="Phasing 1000" itemValue="1000" />
									<p:ajax update=":advancedForm intTime startButton" listener="#{procedureController.coarsePhasingOptionSelectListener}" />
								</p:selectOneMenu>



  
								<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ProcedureConfig','IntegrationTime')}" />				
								<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" rendered="#{not procedureController.procedure.procedureType.narrowBandPhasing}"/>

								<h:panelGroup rendered="#{not procedureController.procedure.procedureType.narrowBandPhasing}">
								<p:selectOneMenu id="intTime" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.integrationTime}"  
									editable="true"
									disabled="#{procedureController.procedure.procedureState gt 1}" styleClass="intTime">
									<f:selectItems value="#{procedureController.procedure.procedureConfigSet.procedureConfig.integrationTimeList}" /> 
								</p:selectOneMenu>
								<h:message for="intTime" style="color:red" showSummary="true" showDetail="true" />
								</h:panelGroup>


								<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ProcedureConfig','IntegrationTime')}" />				
								<h:outputLabel value="#{fieldMetaData.displayLabel}s (#{fieldMetaData.units})" rendered="#{procedureController.procedure.procedureType.narrowBandPhasing}"/>

								<h:panelGroup rendered="#{procedureController.procedure.procedureType.narrowBandPhasing}">
								<p:inputText id="intTimes" size="15"
								value="#{procedureController.procedure.procedureConfigSet.iterationListConfig.integrationTimeList}" 
								disabled="#{procedureController.procedure.procedureState gt 1 or procedureController.procedure.procedureConfigSet.procedureConfig.frameFromFile}"/> 
								<h:message for="intTimes" style="color:red" showSummary="true" showDetail="true" />
								</h:panelGroup>
							

								<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ProcedureConfig','CcdGain')}" />				
								<h:outputLabel value="#{fieldMetaData.displayLabel}s (#{fieldMetaData.units})" rendered="#{procedureController.procedure.procedureType.narrowBandPhasing and sessionController.engineeringView}"/>

								<h:panelGroup rendered="#{procedureController.procedure.procedureType.narrowBandPhasing and sessionController.engineeringView}">
								<p:inputText id="ccdGainNumbers" size="15" 
									type="search"
								value="#{procedureController.procedure.procedureConfigSet.iterationListConfig.ccdGainList}" 
								disabled="#{procedureController.procedure.procedureState gt 1 or procedureController.procedure.procedureConfigSet.procedureConfig.frameFromFile}"/> 
								<h:message for="ccdGainNumbers" style="color:red" showSummary="true" showDetail="true" />
								</h:panelGroup>

 

								<h:outputLabel value="Number of Trials" rendered="#{procedureController.renderNumTrials}"/>
						
								<p:selectOneMenu id="iterationCount" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.numberOfTrials}"
									editable="true"
									disabled="#{procedureController.procedure.procedureState gt 1}" 
									rendered="#{procedureController.renderNumTrials}"
									style="width: 4em">
									<f:selectItems value="#{procedureController.procedure.procedureConfigSet.procedureConfig.numTrialsList}" />
								</p:selectOneMenu>

 
							<!-- 
							<p:row rendered="#{procedureController.procedure.procedureType.narrowBandPhasing and procedureController.procedure.procedureConfigSet.procedureConfig.lightSource eq 2}">
								<p:column styleClass="btmsFormLabelColumn">
									<h:outputLabel value="Filter(Ref Beam) Set" />
								</p:column>   
								<p:column styleClass="btmsFormInputColumn" style="white-space: nowrap">	
									<p:selectOneMenu id="loopOptions1" value="#{procedureController.procedure.procedureConfigSet.iterationListConfig}" converter="#{iterationListConfigConverter}"
										disabled="#{procedureController.procedure.procedureState gt 1 or procedureController.procedure.procedureConfigSet.procedureConfig.frameFromFile}" >
										<f:selectItems value="#{procedureController.iterationListConfigOptions}" var="option" itemLabel="#{option.iterationValueList.fullDisplayString}" itemValue="#{option}" />
										<p:ajax update="startButton intTimes ccdGainNumbers" listener="#{procedureController.iterationListChangeListener}" />  
									</p:selectOneMenu>
									<p:spacer width="10px" />
									<p:commandButton icon="ui-icon-plus" styleClass="thinPadding" style="top:-5px" immediate="true" action="#{iterationConfigController.doResetIterationSet}" oncomplete="iterationDialog.show();" update=":iterationConfigForm" />
								</p:column>
							</p:row>
							-->
							 

								<h:outputLabel value="Filter Set" rendered="#{procedureController.procedure.procedureType.narrowBandPhasing}"/>
	
								<h:panelGroup rendered="#{procedureController.procedure.procedureType.narrowBandPhasing}"
									layout="block" style="display: inline-flex; align-items: center; gap: 10px;">
									<p:selectOneMenu id="loopOptions2" value="#{procedureController.procedure.procedureConfigSet.iterationListConfig}" converter="#{iterationListConfigConverter}"
										disabled="#{procedureController.procedure.procedureState gt 1 or procedureController.procedure.procedureConfigSet.procedureConfig.frameFromFile}" >
										<f:selectItems value="#{procedureController.iterationListConfigOptions}" var="option" itemLabel="#{option.iterationValueList.displayString}" itemValue="#{option}" />
										<p:ajax update="startButton intTimes ccdGainNumbers" listener="#{procedureController.iterationListChangeListener}" />  
									</p:selectOneMenu>
									<p:spacer width="10px" />
									<p:commandButton icon="pi pi-plus" styleClass="thinPadding" style="top:-5px" immediate="true" action="#{iterationConfigController.doResetIterationSet}" oncomplete="PF('iterationDialog').show();" update=":iterationConfigForm" />
								</h:panelGroup>
	
	
								<h:outputLabel value="Segment Group Number" rendered="#{procedureController.renderSufsGroup}"/>
	
								<p:selectOneMenu id="groupNum" value="#{procedureController.procedure.procedureConfigSet.procedureConfig.sufsGroup}"
								disabled="#{procedureController.procedure.procedureState gt 1}" 
								rendered="#{procedureController.renderSufsGroup}"
								style="width: calc(100% + 1.5em)">
									<f:selectItems value="#{procedureController.sufsGroupSelectList}" />
									<p:ajax update="sufsOffsetXGroup sufsOffsetYGroup startButton intTime :advancedForm" listener="#{procedureController.sufsGroupChangeListener}" />
								</p:selectOneMenu>
										
	
	
								<h:outputLabel value="SUFS X Coarse Offset (&#181;m)" rendered="#{procedureController.procedure.procedureType.sufs}"/>
	
								<h:panelGroup id="sufsOffsetXGroup" rendered="#{procedureController.procedure.procedureType.sufs}"
								    layout="block" style="display: inline-flex; align-items: center; gap: 10px;">
									<p:inputText id="sufsOffsetX" maxlength="5"  
										value="#{procedureController.procedure.procedureConfigSet.sufsCoarseOffsetsConfig.coarseMirrorOffsetCurrentX}"
										size="3" disabled="#{procedureController.procedure.procedureState gt 1}" />
									<h:outputText value="&#160;(Default:&#160;#{procedureController.procedure.procedureConfigSet.sufsCoarseOffsetsConfig.coarseMirrorOffsetDefaultX})" />
								</h:panelGroup>

								<h:outputLabel value="SUFS Y Coarse Offset (&#181;m)" rendered="#{procedureController.procedure.procedureType.sufs}"/>

								<h:panelGroup id="sufsOffsetYGroup" rendered="#{procedureController.procedure.procedureType.sufs}"
									layout="block" style="display: inline-flex; align-items: center; gap: 10px;">
									<p:inputText id="sufsOffsetY" maxlength="5"  
										value="#{procedureController.procedure.procedureConfigSet.sufsCoarseOffsetsConfig.coarseMirrorOffsetCurrentY}"
										size="3" disabled="#{procedureController.procedure.procedureState gt 1}" />
									<h:outputText value="&#160;(Default:&#160;#{procedureController.procedure.procedureConfigSet.sufsCoarseOffsetsConfig.coarseMirrorOffsetDefaultY})" />
								</h:panelGroup>
											

								<h:outputLabel value="Frame Source" rendered="#{sessionController.engineeringView}"/>
	
								<h:panelGroup id="frameSourceGroup" layout="block" style="display: inline-flex; align-items: center; gap: 10px;"
    								rendered="#{sessionController.engineeringView}">
									<p:selectOneMenu value="#{procedureController.procedure.procedureConfigSet.procedureConfig.frameSource}"
										disabled="#{procedureController.procedure.procedureState gt 1}">
										<f:selectItem itemLabel="Select One" itemValue="" />
										<f:selectItem itemLabel="CCD" itemValue="1" />
										<f:selectItem itemLabel="File" itemValue="2" />
										<p:ajax update="frameSourceGroup startButton" listener="#{procedureController.frameSourceListener}" />
									</p:selectOneMenu>
									<p:commandButton id="openFitsFolder"
						                 icon="pi pi-folder-open"
						                 type="button"
						                 styleClass="thinPadding"
						                 disabled="#{procedureController.procedure.procedureState gt 1}"
						                 rendered="#{procedureController.procedure.procedureConfigSet.procedureConfig.frameSource eq 2}"
						                 onclick="PF('fitsFileLoadDialog').show();" />
								</h:panelGroup>
							
							</div>
						
						</p:outputPanel>

					</p:tab>


					<p:tab id="statusAndControlTab" title="Status and Control">

						<p:outputPanel id="statusAndControlPanel" style="padding: 16px;">
		        		
			            	<div class="label-input-grid" 
			                 	style="display: grid; grid-template-columns: max-content max-content;
			                        align-items: baseline; 
			                        row-gap: 24px; column-gap: 24px;">

								<h:outputLabel value="Procedure Type" />
								<h:outputText value="#{procedureController.procedure.procedureType.procedureTypeName}" />
								<h:outputLabel value="Procedure #" />
								<h:panelGroup layout="block" style="display: flex; align-items: center; gap: 15px;">
								
								    <h:outputText value="#{procedureController.procedure.procedureNumber}" />
								
								    <h:panelGroup rendered="#{procedureController.procedure.procedureState eq 2 and procedureExecutionState.currentIteration gt 0}"
								        style="display: flex; align-items: center; gap: 15px;">
								        <h:outputLabel value="Iteration" />
								        <h:outputText value="#{procedureExecutionState.currentIteration}" />
								    </h:panelGroup>
								
								    <p:commandLink ajax="true"
								        action="#{procedureController.doShowProcedureLog}"
								        style="font-weight: normal; color: blue;"
								        rendered="#{procedureController.procedure.procedureState ge 3}">
								        <h:outputText value="Procedure Log" />
								    </p:commandLink>
								
								</h:panelGroup>
								<h:outputLabel value="Status" rendered="#{procedureController.procedure.procedureState ge 3}" />
								<h:outputText value="#{procedureController.procedure.procedureStateDisplayString}" rendered="#{procedureController.procedure.procedureState eq 3}" />
								<h:outputText value="#{procedureController.procedure.procedureStateDisplayString}" style="color:red" rendered="#{procedureController.procedure.procedureState eq 4}" />
	
								<h:outputLabel value="Execution Start" rendered="#{procedureController.procedure.procedureState ge 3}" />
								<h:panelGroup rendered="#{procedureController.procedure.procedureState ge 3}" >
								<h:outputText value="#{procedureController.procedure.executionStartTime}" >
										<f:convertDateTime pattern="hh:mm:ss " />
									</h:outputText>
									<h:outputText value=" UTC"/>
								</h:panelGroup>
								
								<h:outputLabel value="Execution End" rendered="#{procedureController.procedure.procedureState ge 3}" />
								<h:panelGroup rendered="#{procedureController.procedure.procedureState ge 3}" >
								<h:outputText value="#{procedureController.procedure.executionEndTime}" >
										<f:convertDateTime pattern="hh:mm:ss " />
									</h:outputText>
									<h:outputText value=" UTC"/>
								</h:panelGroup>
									
								<h:outputLabel value="Ref Map Used" rendered="#{procedureController.procedure.procedureState eq 3}" />
								<h:outputText value="#{procedureController.refMapFilename}" rendered="#{procedureController.procedure.procedureState eq 3}" />
								
								<h:outputLabel value="ACS Snap # After" rendered="#{procedureController.procedure.procedureState eq 3}" />
								<h:outputText size="4" value="#{procedureController.procedure.procedureOutput.m1SnapNumberAfterDisplayText}" rendered="#{procedureController.procedure.procedureState eq 3}" />
							
							</div>
							
						</p:outputPanel>

						<h:panelGroup rendered="#{procedureController.procedure.procedureState lt 3}"
						    layout="block"
						    style="margin-top: 10px; padding: 0 20px;">
						
						    <div style="display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 10px;">
						        <p:commandButton id="startButton"
						            icon="pi pi-play"
						            value="Start"
						            action="#{procedureController.doExecuteProcedure}"
						            update=":menuForm :errorGrowl"
						            widgetVar="startButton2"
						            onclick="startButton2.disable();"
						            disabled="#{asyncController.executionStatus or not procedureController.startEnabled}" />
						
						        <p:commandButton value="Abort"
						            icon="ui-icon-close"
						            action="#{procedureController.doAbortProcedure}"
						            disabled="#{not asyncController.executionStatus or asyncController.abortRequested}" />
						    </div>
						
						    <h:panelGroup id="cameraNotReady" layout="block" style="text-align: center;">
						        <h:panelGroup layout="block" styleClass="redText" rendered="#{procedureController.cameraNotReady}">
						            <h:outputText value="Camera not ready" styleClass="redText" />
						        </h:panelGroup>
						    </h:panelGroup>
						
						    <div style="margin-top: 30px; width: 100%;">
						        <p:progressBar widgetVar="pbAjax"
						            value="#{asyncController.percentComplete}"
						            labelTemplate="{value}%"
						            styleClass="animated"
						            displayOnly="true" />
						    </div>
						
						</h:panelGroup>

					</p:tab>
					
					
					
					
					<p:tab title="Procedure Event Log">				

						<p:dataTable id="procedureEventLog" widgetVar="statusLogTable" styleClass="pcsTable ui-datatable-striped"
				                     var="logEntry" 
				                     value="#{statusLogController.procedureStatusLog.logEntryList}" 
				                     lazy="false" 
				                     style="width:100%; border-collapse: collapse;"
				                     scrollable="true"  scrollHeight="206" stripedRows="true">
				
				            <p:column headerText="Time" style="width:70px;">
				           		<f:facet name="header">
				                	<h:outputText value="Time" style="font-size: 14px; font-weight: bold"/>
				                </f:facet>
				            

				                <h:outputText value="#{logEntry.createDate}" style="font-size: 14px;">
				                    <f:convertDateTime pattern="hh:mm:ss" />
				                </h:outputText>
				            </p:column>
				            <p:column headerText="Status" style="white-space:pre-wrap;">
				           		<f:facet name="header">
				                	<h:outputText value="Status" style="font-size: 14px; font-weight: bold"/>
				                </f:facet>
				                
				                <h:outputText escape="false" value="#{logEntry.status}" style="font-size: 14px; white-space:pre-wrap;" />
				            
				            </p:column>
				
				        </p:dataTable>

				
					</p:tab>
				</p:accordionPanel>

				<h:panelGroup id="framePanel">
				
					<h:panelGroup layout="block" style="text-align: center; width: 100%; display: flex; align-items: center; justify-content: center; height: 600px"
						rendered="#{procedureController.procedure.procedureState eq 1}">
					
						<p:outputPanel layout="block" style="padding:12px;margin:12px; display: inline-block; text-align: left; width: fit-content;" >
								
									<h:outputText value="Loaded Frames from File:" rendered="#{not empty procedureController.selectedFitsFiles}" />
	
									<h:outputText style="text-align:center" value="No CCD Images" rendered="#{empty procedureController.selectedFitsFiles}" />
									<ul>
										<ui:repeat value="#{procedureController.selectedFitsFiles}" var="fitsFile">
											<li style="margin-bottom: 4px"><h:outputText value="#{fitsFile.fileName}" /></li>
										</ui:repeat>
									</ul>
	
						</p:outputPanel>
					</h:panelGroup>

					<p:outputPanel layout="block" style="padding:0;margin:0" styleClass="btmsForm noupdate"
						rendered="#{procedureController.procedure.procedureState ge 2}">
						
						<h:panelGroup layout="block" style="display: flex; flex-direction: row; gap: 8px; margin-bottom: 12px">
					
							<h:panelGroup rendered="#{procedureController.procedure.procedureState ge 3}" >
							<h:outputText value="Frame # " style="float:left;position:relative;top:7px;margin-right:10px" rendered="#{not empty procedureController.procedure.procedureCcdFrameList}"/>
							<p:selectOneButton value="#{procedureController.selectedFrameNumber}" style="float:left">
								<f:selectItems value="#{procedureController.procedure.procedureCcdFrameList}" var="procedureCcdFrame"
                      					itemLabel="#{procedureCcdFrame.procedureFrameNumber + 1}" itemValue="#{procedureCcdFrame.procedureFrameNumber}" />
           						<p:ajax listener="#{procedureController.frameSelectListener}" update="framePanel miscPanel" oncomplete="markFrame();" />
       						</p:selectOneButton>
       						</h:panelGroup>
						</h:panelGroup>
						
						
						<h:panelGroup layout="block" style="padding-bottom:4px;margin-bottom:4px;border:1px solid #ccc">
							
						    <h:panelGroup layout="block" style="text-align:center; font-size:1.1em; font-weight:bold; padding-bottom:4px; margin-bottom:4px;">
						        <h:outputText value="#{procedureController.selectedFrame.ccdFrame.fitsFilename}" />
						    </h:panelGroup>
							
							<p:menubar id="frameMenu">

								<p:submenu label="File" icon="ui-icon-disk"> 
									<!-- TODO update loadPanel -->
									<p:menuitem value="Save Current Displayed Image As ..." disabled="#{sessionController.procedureExecuting}" update=":growl :errorGrowl" onclick="saveCanvasPng();" />
								</p:submenu>
								<p:submenu id="displayModeMenu" label="Display Mode" icon="ui-icon-image">
									<p:menuitem value="Show Marking" update="frameMenu :frameHiddenForm" action="#{procedureController.doSetMarkedDisplayMode(true)}" icon="pi pi-check" rendered="#{procedureController.markedDisplayMode}" />
									<p:menuitem value="Show Marking" update="frameMenu :frameHiddenForm" action="#{procedureController.doSetMarkedDisplayMode(true)}" rendered="#{not procedureController.markedDisplayMode}"  />
									<p:menuitem value="Do Not Show Marking" update="frameMenu :frameHiddenForm" action="#{procedureController.doSetMarkedDisplayMode(false)}" icon="pi pi-check" rendered="#{not procedureController.markedDisplayMode}"  />				  
									<p:menuitem value="Do Not Show Marking" update="frameMenu :frameHiddenForm" action="#{procedureController.doSetMarkedDisplayMode(false)}" rendered="#{procedureController.markedDisplayMode}"   />				  
								</p:submenu>				
		
							</p:menubar>
								
							
						
							<p:graphicImage id="frameImage"  value="#{procedureController.graphicImage}" height="512px" width="512px" style="position: absolute;left:-10000px" cache="false" />
					
													
							<h:panelGroup layout="block" style="text-align:center">
							    <canvas id="frameCanvas" width="512px" height="512px" style="border:1px solid #d3d3d3;cursor:crosshair">
							        Your browser does not support the HTML5 canvas tag.
							    </canvas>
							
						
						
								<h:panelGroup layout="block" style="width:512px; margin-left: auto; margin-right: auto; margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
		
									<canvas id="infoCanvas" width="400" height="15" style="width: 400px; height: 15px;"></canvas>
		
									
									<h:panelGroup style="display: flex; flex-direction: row; gap: 8px; margin-bottom: 12px">
										<h:outputLabel id="peakIntensityLabel" value="Median Peak Intensity (counts, e-):  " rendered="#{not empty procedureController.selectedFrame}"/>
									
										<h:outputText value="#{procedureController.selectedFrame.centroidMap.medianPeakIntensity}" rendered="#{not empty procedureController.selectedFrame}" >
											<f:convertNumber type="number"  minFractionDigits="1" pattern="#0.0"/>
										</h:outputText>
										<h:outputText value=", " rendered="#{not empty procedureController.selectedFrame}" />
										<h:outputText value="#{procedureController.selectedFrame.medianPeakIntensityAdu}" rendered="#{not empty procedureController.selectedFrame}" >
											<f:convertNumber type="number"  minFractionDigits="1" pattern="#0.0"/>
										</h:outputText>
									</h:panelGroup>
		
								</h:panelGroup>
							
							</h:panelGroup>
							
							

							<h:panelGroup layout="block" style="display: flex; flex-direction: row; gap: 8px; margin-bottom: 12px; margin-top: 12px;">

<script>

//<![CDATA[
    		
	
	var canvasFont = '16px Arial, Helvetica, "Noto Sans", sans-serif';
	
	
  // prevent auto submit of form
  $(document).ready(function() {
	  $('input,select').keypress(function(event) { return event.keyCode != 13; }); 
	  
	    var infoCanvas = document.getElementById("infoCanvas");
	    if (infoCanvas) {
	        infoCanvas.width = infoCanvas.offsetWidth;
	    }
	    
	    var label = document.querySelector("[id$='peakIntensityLabel']");
	    if (label) {
	        var style = window.getComputedStyle(label);
	        canvasFont = style.fontSize + ' ' + style.fontFamily;
	    }

	  
});	
  

    var mousePos;
    var moving = false;
      
	function initCanvasEvents() {
		var canvas = document.getElementById("frameCanvas");
		if (!canvas) return;
		canvas.addEventListener("mousedown", doMouseDown, false);
		canvas.addEventListener('mousemove', doMouseMove, false);

	}
	
	function removeCanvasEvents() {
		var canvas = document.getElementById("frameCanvas");
		if (!canvas) return;
		canvas.removeEventListener("mousedown",doMouseDown);
		canvas.removeEventListener("mousemove",doMouseMove);
	}
	
	
	function doMouseDown(event) {  		
		
		var canvas = $('#frameCanvas');
		canvas_x = event.pageX - canvas.offset().left;
		canvas_y = event.pageY - canvas.offset().top;
		// call javascript function that is defined in <p:remote>
		handMark([{name: 'canvas_x', value: canvas_x}, {name: 'canvas_y', value: canvas_y}]);
	}

	
	function drawFrame() {
		window.setTimeout("drawFrame2(false)", 500);
	}
		
	function markFrame() {
		
		window.setTimeout("drawFrame2(true)", 500);
	}
	
	function drawFrame2_orig(mark) {
		removeCanvasEvents();
		var c = document.getElementById("frameCanvas");
		
		if (!c) return; // not present in this mode (e.g. procedure setup mode)

		var ctx = c.getContext("2d");
		
		var img = document.getElementById("procedureDetailForm:frameImage");
		
		console.log("ready to draw:: " + img);
		
		ctx.clearRect(0,0,c.width,c.height);
		
		ctx.drawImage(img,0,0,c.width,c.height);
		
		initCanvasEvents();
		
		var blankImage = document.getElementById('frameHiddenForm:blankImage').value;
		
		if (blankImage == "true") {
		
			ctx.font = "12px Arial";
		 	ctx.fillStyle = "black";
		 	ctx.fillText("Frame not used in analysis, overwritten by subsequent frame", 100, 250);
			
		} else if (mark) {
			markFrame2(c, ctx, img);
		}
		
		initCanvasEvents();
	}
	
	function drawFrame2(mark) {
	    removeCanvasEvents();
	    var c = document.getElementById("frameCanvas");
	    
	    if (!c) return; // not present in this mode (e.g. procedure setup mode)
	    
	    var ctx = c.getContext("2d");
	    
	    var img = document.getElementById("procedureDetailForm:frameImage");
	    var originalSrc = img.src;
	    
	    console.log("img.src = " + originalSrc);
	    
	    img.onload = function() {
	        ctx.clearRect(0, 0, c.width, c.height);
	        ctx.drawImage(img, 0, 0, c.width, c.height);
	        
	        var blankImage = document.getElementById('frameHiddenForm:blankImage').value;
	        if (blankImage == "true") {
	            ctx.font = "12px Arial";
	            ctx.fillStyle = "black";
	            ctx.fillText("Frame not used in analysis, overwritten by subsequent frame", 100, 250);
	        } else if (mark) {
	            markFrame2(c, ctx, img);
	        }
	        
	        initCanvasEvents();
	    };
	    
	    // Force re-fetch by clearing src then restoring original
	    img.src = "";
	    img.src = originalSrc;
	}
	
	
	function markFrame2(c, ctx, img) {
		
		console.log("about to mark frame")
		
		var xField = document.getElementById('frameHiddenForm:centroidXs').value;
	 	var xArray = xField.split(','); 
		var yField = document.getElementById('frameHiddenForm:centroidYs').value;
	 	var yArray = yField.split(','); 
		var spotRad = document.getElementById('frameHiddenForm:spotRadius').value;
		var handMark = document.getElementById('frameHiddenForm:handMark').value;
		var sField = document.getElementById('frameHiddenForm:mirrorConfig').value;
		var presentSegments = sField.split(',');
		
		ctx.font = "12px Arial";
	 	ctx.fillStyle = "red";

		//console.log("about to loop: " + xField )

		
	 	if (xField != null && xField.length > 0) {
	 	
			for (var i = 0; i < xArray.length; i++) {
				
				var segmentNum = presentSegments[i];
				
				if (xArray[i] != 0.0 && yArray[i] != 0.0) {

					//console.log("marking")

					ctx.beginPath();
					// divide by 2 when frame is displayed 512x512
					ctx.arc(xArray[i]/2,yArray[i]/2,spotRad/2,0,2*Math.PI);
					ctx.strokeStyle = '#ff0000';
					ctx.lineWidth = 2;
					ctx.stroke();
					if (handMark == "true" && xArray.length < 50) {
						ctx.fillText("" + (segmentNum), xArray[i]/2 - 14, yArray[i]/2 - 15);
					}
				}
			}
		}
		
	}
	


    function scrollStatusLog() {
        var dtWidget = PF('statusLogTable');
        if (dtWidget) {
            var scrollBody = dtWidget.jq.find('.ui-datatable-scrollable-body');
            if (scrollBody.length) {
                scrollBody.scrollTop(scrollBody[0].scrollHeight);
            }
        }
    }
	
	function play_wake_up_sound() {
		document.getElementById('audiocontrol').play();
	}
	function stop_wake_up_sound() {
		document.getElementById('audiocontrol').pause();
		document.getElementById('audiocontrol').load();
	}
	
	var sentPos;

	function displayFrameValue() {
	    var pixelValue = document.getElementById('frameHiddenForm:pixelValue').value;
	    var message = 'pos: (' + Math.floor(sentPos.x) + ', ' + Math.floor(sentPos.y) + '),  val = ' + pixelValue;
	    writeMessage(document.getElementById("infoCanvas"), message);
	    moving = false;
	}

	function doMouseMove(event) {
	    mousePos = getMousePos(document.getElementById("frameCanvas"), event);
	    if (!moving) {
	        moving = true;
	        // convert 512 to 1024
	        sentPos = {x: mousePos.x * 2, y: mousePos.y * 2};
	        frameValue([{name: 'mouse_x', value: sentPos.x}, {name: 'mouse_y', value: sentPos.y}]);
	    }
	}
	
	function writeMessage(infoCanvas, message) {
        var context = infoCanvas.getContext('2d');
        context.clearRect(0, 0, 300, 15);
        context.font = canvasFont;
        context.fillStyle = '#444444';
        context.fillText(message, 1, 12);
      }
	
      function getMousePos(canvas, evt) {
    	var canvas = document.getElementById("frameCanvas");
        var rect = canvas.getBoundingClientRect();
        return {
          x: evt.clientX - rect.left,
          y: evt.clientY - rect.top
        };
      }
	
    function saveCanvasPng() {
		var canvas = document.getElementById("frameCanvas");
		var button = document.getElementById("saveAsPngId");
	    var img = canvas.toDataURL("image/png");
	    button.href = img;
	    button.click();
      }

    
    window.onload = function() {
        markFrame();
    };

    
	//]]>
	
</script>
