<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">
  
		<p:dialog id="promptDialog" header="#{procedureController.currentPrompt.header}" widgetVar="userPromptDialog" closable="false">  
    		<h:form id="promptDialogForm">
    		<div style="margin: 20px">
    		<br/>
    		<h:outputText escape="false" value="#{procedureController.currentPrompt.message}" style="white-space:pre-wrap" />
    		<br/>
    		<br/>
    		</div>  
    		    		

    		 
   			<p:commandButton id="abortButton" value="Abort Procedure" styleClass="dialogbutton" update=":growl :errorGrowl"
					action="#{asyncController.doCloseUserPromptAbort}" oncomplete="userPromptDialog.hide();" rendered="#{!procedureController.currentPrompt.containsAbort and !procedureController.currentPrompt.supressAbort}"/>
    		<p:commandButton id="button3" value="#{procedureController.currentPrompt.button3Text}" styleClass="dialogbutton" update=":growl :errorGrowl"
					action="#{asyncController.doCloseUserPrompt3}" oncomplete="userPromptDialog.hide();" rendered="#{procedureController.currentPrompt.buttonCount gt 2}" />   	   		  
			<p:commandButton id="button2" value="#{procedureController.currentPrompt.button2Text}" styleClass="dialogbutton" update=":growl :errorGrowl"
					action="#{asyncController.doCloseUserPrompt2}" oncomplete="userPromptDialog.hide();" rendered="#{procedureController.currentPrompt.buttonCount gt 1}" />
    		<p:commandButton id="button1" value="#{procedureController.currentPrompt.button1Text}" styleClass="dialogbutton" update=":growl :errorGrowl"
					action="#{asyncController.doCloseUserPrompt1}" oncomplete="userPromptDialog.hide();" />

			</h:form>
		</p:dialog> 


</ui:composition>
