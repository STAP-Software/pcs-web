<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	 xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="procedureListForm" style="margin:30px">

			<p:accordionPanel id="sessionPanel" multiple="true" activeIndex="0,1">
		
			    <p:tab title="Session Detail">
			
					<div style="display: inline-flex; flex-direction: column; gap: 10px;">
					
					    <div style="display: grid; grid-template-columns: max-content 1fr;
					                align-items: baseline; row-gap: 10px; column-gap: 16px;">
					
					        <p:outputLabel for="observers" value="Observers"
					                       style="text-align: right; font-weight: bold;"/>
					        <p:inputTextarea id="observers" value="#{sessionController.session.observers}"
					                     rows="1" cols="30"/>
					
					        <p:outputLabel for="description" value="Description"
					                       style="text-align: right; font-weight: bold; align-self: start; padding-top: 4px;"/>
					        <p:inputTextarea id="description" value="#{sessionController.session.description}"
					                         rows="4" cols="100" />
					
					    </div>
					
					    <div style="display: flex; justify-content: flex-end;">
					        <p:commandButton value="Close" action="#{sessionController.doCancelSaveSession}"
					                         icon="pi pi-cancel"
					                         styleClass="ui-button-secondary mr-2" immediate="true" update="@form :growl :errorGrowl"/>
					        <p:commandButton value="Save" action="#{sessionController.doSaveSession}"
					                         icon="pi pi-check"
					                         ajax="true" update="@form :growl :errorGrowl"/>
					    </div>
					
					</div>
			    </p:tab>


				<p:tab title="Procedures">

					<h:commandLink>
						<p:graphicImage value="../../images/excel.png" />
						<p:dataExporter type="xls" target="sessionTableExport"
							fileName="session" />
					</h:commandLink>
					<h:commandLink>
						<p:graphicImage value="../../images/csv.png" />
						<p:dataExporter type="csv" target="sessionTableExport"
							fileName="session" />
					</h:commandLink>
					
					<p:spacer width="20px" />
					
					<h:panelGroup rendered="#{sessionController.engineeringView}">
						<h:outputLabel value="Show Non-Operational Procedures: " style="position:relative; top:-10px;"/>
						<p:selectBooleanCheckbox value="#{sessionController.includeTestData}" style="position:relative;top:-6px;margin-left:2px" >
						<p:ajax listener="#{sessionController.operationalViewChangeListener}" update="sessionTable"/>
						</p:selectBooleanCheckbox>
					</h:panelGroup>

					<p:dataTable id="sessionTable" var="procedure"
						value="#{sessionController.session.procedureList}" rowKey="#{procedure.procedureId}" stripedRows="true">
						<f:facet name="header">
							<h:outputText value="Session Summary: " />
							<h:outputText value="&#160;&#160;&#160;&#160;" />
							<h:outputText
								value="#{sessionController.session.telescope.telescopeName}" />
							<h:outputText value="&#160;&#160;&#160;&#160;" />
							<h:outputText
								value="#{sessionController.session.sessionDate}">
								<f:convertDateTime pattern="MM/dd/yyyy" timezone="UTC" />
							</h:outputText>
						</f:facet>

						<p:column style="width:2%">
							<p:rowToggler />
						</p:column>
						<p:column>
							<p:commandLink value="" 
								style="float:left"
								action="#{procedureController.doViewProcedure}">
								<i class="pi pi-search"></i>
								<f:setPropertyActionListener
									target="#{procedureController.procedure}" value="#{procedure}" />
							</p:commandLink>
						</p:column>
						<p:column headerText="Procedure Number" sortBy="#{procedure}" sortFunction="#{sessionController.procedureSortFunction}" style="width:5%">
							<h:outputText value="#{procedure.procedureNumber}" />
						</p:column>
						<p:column headerText="Test Number" style="width:5%">
							<h:outputText value="#{procedure.testNumber}" />
						</p:column>
						<p:column headerText="Procedure Type" sortBy="#{procedure.procedureType.procedureTypeName}" style="width:10%">
							<h:outputText value="#{procedure.procedureType.procedureTypeName}" />
							<h:outputText value=" #{procedure.procedureConfigSet.procedureConfig.coarsePhasingOption}" rendered="#{procedure.procedureType.coarsePhasing}" />
							<h:outputText value=" (Group #{procedure.procedureConfigSet.procedureConfig.sufsGroup})" rendered="#{procedure.procedureType.sufs}" />
						</p:column>
						<!-- 
						<p:column headerText="Frames">
							<h:outputText
								value="#{fn:length(procedure.procedureCcdFrameList)}" />
						</p:column>
						 -->
						<p:column headerText="Start Time" style="width:8%">
							<h:outputText value="#{procedure.executionStartTime}" >
								<f:convertDateTime type="date" pattern="HH:mm:ss" timezone="UTC" />
							</h:outputText>
							<p:spacer width="6px"/>
							<h:outputText value="UTC"/>
						</p:column>
						
						<p:column headerText="Status">
							<h:outputText value="#{procedure.procedureStateDisplayString}" rendered="#{procedure.procedureState eq 3}"  />
							<h:outputText value="#{procedure.procedureStateDisplayString}" style="color:red" rendered="#{procedure.procedureState eq 4}"  />
						</p:column>
						
						<p:column headerText="Trials">
							<h:outputText value="#{procedure.procedureConfigSet.procedureConfig.numberOfTrials}" />
						</p:column>
						
						<p:column headerText="M1 Snap Number After">
							<h:outputText
								value="#{procedure.procedureOutput.m1SnapNumberAfterDisplayText}" />
						</p:column>
						
						<p:column headerText="Comments" style="width:30%">
							<h:outputText value="#{procedure.comments}" />
						</p:column>

 
<p:rowExpansion>
    <div style="display:flex; flex-direction:row; flex-wrap:wrap; align-items:flex-start; gap:20px; margin:5px;">

        <!-- General -->
        <h:panelGroup layout="block" style="flex:0 0 auto; width:400px; border:1px solid #ccc; border-radius:4px;">
            <div style="background:#2c5f8a; color:white; text-align:center; font-weight:bold; padding:8px; border-radius:4px 4px 0 0;">
                General
            </div>
            <div style="padding:10px;">
                <p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder"  style="width:100%; table-layout:auto;"
                    columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

                    <c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ProcedureConfig','IntegrationTime')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.procedureConfigSet.procedureConfig.integrationTime}" style="position:relative; top:4px"
                        rendered="#{not procedure.procedureType.narrowBandPhasing}">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>
                    <h:outputText value="#{procedure.procedureConfigSet.iterationListConfig.integrationTimeList}" style="position:relative; top:4px"
                        rendered="#{procedure.procedureType.narrowBandPhasing}" />

                    <c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CcdFrame','TelescopeEl')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.latestProcedureCcdFrame.ccdFrame.telescopeEl}" style="position:relative; top:4px">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>

                    <c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Procedure','StarName')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel}" />
                    <h:outputText value="#{procedure.starNameFormatted}" style="position:relative; top:2px" />

                    <c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Procedure','StarVmag')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel}" />
                    <h:outputText value="#{procedure.starVmagFormatted}" style="position:relative; top:2px" />

                    <c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Procedure','StarSpType')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel}" />
                    <h:outputText value="#{procedure.starSpTypeFormatted}" style="position:relative; top:2px" />

                    <c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','SteeringMirror')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:panelGroup style="position:relative; top:4px">
                        <h:outputText value="#{procedure.latestProcedureCcdFrame.ccdFrame.cameraState.steeringMirrorX}" />
                        <h:outputText value=", " />
                        <h:outputText value="#{procedure.latestProcedureCcdFrame.ccdFrame.cameraState.steeringMirrorY}" />
                    </h:panelGroup>

                    <c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('CameraState','TiltPlate')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:panelGroup style="position:relative; top:4px">
                        <h:outputText value="#{procedure.latestProcedureCcdFrame.ccdFrame.cameraState.tiltPlateX}" />
                        <h:outputText value=", " />
                        <h:outputText value="#{procedure.latestProcedureCcdFrame.ccdFrame.cameraState.tiltPlateY}" />
                    </h:panelGroup>

                </p:panelGrid>
            </div>
        </h:panelGroup>

        <!-- Passive Tilt -->
        <h:panelGroup layout="block" rendered="#{procedure.procedureType.passiveTilt}"
            style="flex:0 0 auto; width:400px; border:1px solid #ccc; border-radius:4px;">
            <div style="background:#2c5f8a; color:white; text-align:center; font-weight:bold; padding:8px; border-radius:4px 4px 0 0;">
                #{procedure.procedureType.procedureTypeName}
            </div>
            <div style="padding:10px;">
                <p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder"  style="width:100%; table-layout:auto;"
                    columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

                    <h:outputLabel value="M1 Cmds RMS (nm)" />
                    <h:outputText value="#{procedure.passiveTiltProcedureOutput.calcDesiredActCommandsResult.desiredActDeltasRms}" style="position:relative; top:2px">
                        <f:convertNumber pattern="#0.0" />
                    </h:outputText>

                    <h:outputLabel value="M1 Commands Sent" />
                    <h:outputText value="#{procedure.passiveTiltProcedureOutput.procedureDecisionLog.m1CmdsSent}" style="position:relative; top:2px"/>

                </p:panelGrid>
            </div>
        </h:panelGroup>

        <!-- Fine Screen -->
        <h:panelGroup layout="block" rendered="#{procedure.procedureType.fineScreen}"
            style="flex:0 0 auto; width:440px; border:1px solid #ccc; border-radius:4px;">
            <div style="background:#2c5f8a; color:white; text-align:center; font-weight:bold; padding:8px; border-radius:4px 4px 0 0;">
                #{procedure.procedureType.procedureTypeName}
            </div>
            <div style="padding:10px;">
                <p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder"  style="width:100%; table-layout:auto;"
                    columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

                    <c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CalcM2PttErrorsMeanEomResult','MeanM2TipTiltErrorArcsec')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} X (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.calcM2PttErrorsMeanEomResult.meanM2TipTiltErrorArcsec.x}" style="position:relative; top:2px">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>

                    <h:outputLabel value="#{fieldMetaData.displayLabel} Y (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.calcM2PttErrorsMeanEomResult.meanM2TipTiltErrorArcsec.y}" style="position:relative; top:2px">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>

                    <c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('CalcM2PttErrorsMeanEomResult','MeanM2PistonErrorUm')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.calcM2PttErrorsMeanEomResult.meanM2PistonErrorUm}" style="position:relative; top:2px">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>

                    <h:outputLabel value="Secondary Commands Sent" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.procedureDecisionLog.m2CmdsSent}" style="position:relative; top:2px"/>

                    <c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('M2FocusAndTilts','TelescopeFocus')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.m2FocusAndTilts.telescopeFocus}" style="position:relative; top:2px">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>

                    <c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('M2FocusAndTilts','M2ThetaX')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.m2FocusAndTilts.m2ThetaX}" style="position:relative; top:2px">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>

                    <c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('M2FocusAndTilts','M2ThetaY')}" />
                    <h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.m2FocusAndTilts.m2ThetaY}" style="position:relative; top:2px">
                        <f:converter converterId="DynamicNumberConverter" />
                        <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                    </h:outputText>

                    <h:outputLabel value="M1 Cmds RMS (nm)" />
                    <h:panelGroup>
                        <h:outputText value="#{procedure.fineScreenProcedureOutput.calcDesiredActCommandsResult.desiredActDeltasRms}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                        <h:outputText value=" +- " style="position:relative; top:2px"/>
                        <h:outputText value="#{procedure.fineScreenProcedureOutput.calcDesiredActDeltasRmsEomResult.desiredActDeltasRmsEom}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                    </h:panelGroup>

                    <h:outputLabel value="M1 Cmds RMS - Focus Mode Only (nm)" />
                    <h:panelGroup>
                        <h:outputText value="#{procedure.fineScreenProcedureOutput.calcDesiredActCommandsResult.desiredActDeltasFmRms}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                        <h:outputText value=" +- " style="position:relative; top:2px"/>
                        <h:outputText value="#{procedure.fineScreenProcedureOutput.calcDesiredActDeltasRmsEomResult.desiredActDeltasFmRmsEom}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                    </h:panelGroup>

                    <h:outputLabel value="M1 Cmds RMS - No Focus Mode (nm)" />
                    <h:panelGroup>
                        <h:outputText value="#{procedure.fineScreenProcedureOutput.calcDesiredActCommandsResult.desiredActDeltasNoFmRms}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                        <h:outputText value=" +- " style="position:relative; top:2px"/>
                        <h:outputText value="#{procedure.fineScreenProcedureOutput.calcDesiredActDeltasRmsEomResult.desiredActDeltasNoFmRmsEom}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                    </h:panelGroup>

                    <h:outputLabel value="M1 Commands Sent" />
                    <h:outputText value="#{procedure.fineScreenProcedureOutput.procedureDecisionLog.m1CmdsSent}" style="position:relative; top:2px"/>

                </p:panelGrid>
            </div>
        </h:panelGroup>

        <!-- Coarse Phasing -->
        <h:panelGroup layout="block" rendered="#{procedure.procedureType.coarsePhasing}"
            style="flex:0 0 auto; width:400px; border:1px solid #ccc; border-radius:4px;">
            <div style="background:#2c5f8a; color:white; text-align:center; font-weight:bold; padding:8px; border-radius:4px 4px 0 0;">
                #{procedure.procedureType.procedureTypeName}
            </div>
            <div style="padding:10px;">
                <p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder"  style="width:100%; table-layout:auto;"
                    columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

                    <h:outputLabel value="Segment Piston RMS (microns)" />
                    <h:outputText value="#{procedure.coarsePhasingProcedureOutput.bbAnalyzeSequenceResult.segmentPistonRms}" style="position:relative; top:2px">
                        <f:convertNumber pattern="#0.000" />
                    </h:outputText>

                    <h:outputLabel value="RSS Residual Edge Heights (microns)" />
                    <h:outputText value="#{procedure.coarsePhasingProcedureOutput.phasingStatsResult.residualEdgeErrorRss}" style="position:relative; top:2px">
                        <f:convertNumber pattern="#0.000" />
                    </h:outputText>

                    <h:outputLabel value="Number of Phasing Edges" />
                    <h:outputText value="#{procedure.coarsePhasingProcedureOutput.phasingStatsResult.goodEdgeCount}" style="position:relative; top:2px"/>

                    <h:outputLabel value="M1 Commands Sent" />
                    <h:outputText value="#{procedure.coarsePhasingProcedureOutput.procedureDecisionLog.m1CmdsSent}" style="position:relative; top:2px"/>

                </p:panelGrid>
            </div>
        </h:panelGroup>

        <!-- Narrow Band Phasing -->
        <h:panelGroup layout="block" rendered="#{procedure.procedureType.narrowBandPhasing}"
            style="flex:0 0 auto; width:300px; border:1px solid #ccc; border-radius:4px;">
            <div style="background:#2c5f8a; color:white; text-align:center; font-weight:bold; padding:8px; border-radius:4px 4px 0 0;">
                #{procedure.procedureType.procedureTypeName}
            </div>
            <div style="padding:10px;">
                <p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder"  style="width:100%; table-layout:auto;"
                    columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

                    <h:outputLabel value="Segment Piston RMS (microns)" />
                    <h:outputText value="#{procedure.narrowBandPhasingProcedureOutput.nbActuatorsResult.segmentPistonRms}" style="position:relative; top:2px">
                        <f:convertNumber pattern="#0.000" />
                    </h:outputText>

                    <h:outputLabel value="RSS Residual Edge Heights (microns)" />
                    <h:outputText value="#{procedure.narrowBandPhasingProcedureOutput.phasingStatsResult.residualEdgeErrorRss}" style="position:relative; top:2px">
                        <f:convertNumber pattern="#0.000" />
                    </h:outputText>

                    <h:outputLabel value="Number of Phasing Edges" />
                    <h:outputText value="#{procedure.narrowBandPhasingProcedureOutput.phasingStatsResult.goodEdgeCount}" style="position:relative; top:2px"/>

                    <h:outputLabel value="M1 Commands Sent" />
                    <h:outputText value="#{procedure.narrowBandPhasingProcedureOutput.procedureDecisionLog.m1CmdsSent}" style="position:relative; top:2px"/>

                </p:panelGrid>
            </div>
        </h:panelGroup>

        <!-- Sufs -->
        <h:panelGroup layout="block" rendered="#{procedure.procedureType.sufs}"
            style="flex:0 0 auto; width:580px; border:1px solid #ccc; border-radius:4px;">
            <div style="background:#2c5f8a; color:white; text-align:center; font-weight:bold; padding:8px; border-radius:4px 4px 0 0;">
                #{procedure.procedureType.procedureTypeName}
            </div>
            <div style="padding:10px;">

                <p:panelGrid columns="2" layout="tabular" styleClass="pcsFormNoBorder"  style="width:100%; table-layout:auto;"
                    columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

                    <h:outputLabel value="Coarse Offsets (x,y) (microns)" />
                    <h:panelGroup>
                        <h:outputText value="#{procedure.procedureConfigSet.sufsCoarseOffsetsConfig.coarseMirrorOffsetCurrentX}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                        <h:outputText value=",  " />
                        <h:outputText value="#{procedure.procedureConfigSet.sufsCoarseOffsetsConfig.coarseMirrorOffsetCurrentY}" style="position:relative; top:2px">
                            <f:convertNumber pattern="#0.0" />
                        </h:outputText>
                    </h:panelGroup>

                </p:panelGrid>

                <p:dataTable id="segmentStatsTable" var="segmentStats" rowIndexVar="rowIndex" lazy="false" tableStyle="table-layout:fixed; width:100%;"
                    value="#{procedure.sufsProcedureOutput.sufsSegmentZernikeStatsResult.sufsZernikeStatsResult}">

                    <p:column headerText="SP" style="width:8%; text-align:center;">
                        <h:outputText value="#{constantsCache.sufsConstants.sufsGroupToMirror[procedure.procedureConfigSet.procedureConfig.sufsGroup-1][rowIndex]}" />
                    </p:column>

                    <c:set var="fieldMetaData" value="#{metaDataController.findProcedureOutputField('SufsSegmentZernikeStatsResult','ZernikeMeans')}" />
                    <p:column headerText="Zernike 4 Mean +- EOM (#{fieldMetaData.units})" style="width:30.67%; text-align:right;">
                        <h:outputText value="#{segmentStats.zernikeMeans[3]}">
                            <f:converter converterId="DynamicNumberConverter" />
                            <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                        </h:outputText>
                        <h:outputText value=" +- " />
                        <h:outputText value="#{segmentStats.zernikeEoms[3]}">
                            <f:converter converterId="DynamicNumberConverter" />
                            <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Zernike 5 Mean +- EOM (#{fieldMetaData.units})" style="width:30.67%; text-align:right;">
                        <h:outputText value="#{segmentStats.zernikeMeans[4]}">
                            <f:converter converterId="DynamicNumberConverter" />
                            <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                        </h:outputText>
                        <h:outputText value=" +- " />
                        <h:outputText value="#{segmentStats.zernikeEoms[4]}">
                            <f:converter converterId="DynamicNumberConverter" />
                            <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Zernike 6 Mean +- EOM (#{fieldMetaData.units})" style="width:30.67%; text-align:right;">
                        <h:outputText value="#{segmentStats.zernikeMeans[5]}">
                            <f:converter converterId="DynamicNumberConverter" />
                            <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                        </h:outputText>
                        <h:outputText value=" +- " />
                        <h:outputText value="#{segmentStats.zernikeEoms[5]}">
                            <f:converter converterId="DynamicNumberConverter" />
                            <f:attribute name="pattern" value="#{fieldMetaData.displayFormat}"/>
                        </h:outputText>
                    </p:column>

                </p:dataTable>

            </div>
        </h:panelGroup>

    </div>
</p:rowExpansion>



					</p:dataTable>

			<p:dataTable id="sessionTableExport" var="procedure"
				value="#{sessionController.session.procedureList}" style="display:none">

						<p:column headerText="Procedure Number" sortBy="#{procedure}" sortFunction="#{sessionController.procedureSortFunction}" style="width:5%">
							<h:outputText value="#{procedure.procedureNumber}" />
						</p:column>
						<p:column headerText="Test Number" style="width:10%">
							<h:outputText value="#{procedure.testNumber}" />
						</p:column>
						<p:column headerText="Procedure Type" sortBy="#{procedure.procedureType.procedureTypeName}">
							<h:outputText value="#{procedure.procedureType.procedureTypeName}" />
							<h:outputText value=" #{procedure.procedureConfigSet.procedureConfig.coarsePhasingOption}" rendered="#{procedure.procedureType.coarsePhasing}" />
