<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="procedureListForm" style="margin:30px">

			<p:accordionPanel id="sessionPanel" multiple="true" activeIndex="0,1">

				<p:tab title="Session Detail">

					<p:panelGrid columns="2" styleClass="btmsForm">
						<p:panelGrid columns="2" styleClass="btmsForm"
							columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

							<h:outputLabel value="Observers" />
							<p:inputTextarea value="#{sessionController.session.observers}"
								rows="1" cols="30" />
							<h:outputLabel value="Description" />
							<p:inputTextarea value="#{sessionController.session.description}"
								rows="5" cols="100" />

						</p:panelGrid>

						<f:facet name="footer">
							<p:commandButton id="saveButton" value="Save" ajax="true"
								icon="ui-icon-check" style="float:right" update="@form :growl :errorGrowl"
								action="#{sessionController.doSaveSession}" />
							<p:commandButton id="closeButton" value="Close"
								icon="ui-icon-cancel" style="float:right" update="@form :growl :errorGrowl"
								action="#{sessionController.doCancelSaveSession}" />
						</f:facet>
					</p:panelGrid>
				</p:tab>

				<p:tab title="Procedures">

					<h:commandLink>
						<p:graphicImage value="../../images/excel.png" />
						<p:dataExporter type="xls" target="sessionTableExport"
							fileName="session" />
					</h:commandLink>
					<h:commandLink>
						<p:graphicImage value="../../images/csv.png" />
						<p:dataExporter type="csv" target="sessionTableExport"
							fileName="session" />
					</h:commandLink>

					<p:dataTable id="sessionTable" var="procedure"
						value="#{sessionController.session.procedureList}">
						<f:facet name="header">
							<h:outputText value="Session Summary: " />
							<h:outputText value="&#160;&#160;&#160;&#160;" />
							<h:outputText
								value="#{sessionController.session.telescope.telescopeName}" />
							<h:outputText value="&#160;&#160;&#160;&#160;" />
							<h:outputText
								value="#{sessionController.session.sessionDate}">
								<f:convertDateTime pattern="MM/dd/yyyy" timezone="UTC" />
							</h:outputText>
						</f:facet>

						<p:column style="width:2%">
							<p:rowToggler />
						</p:column>
						<p:column>
							<p:commandLink value="" styleClass="ui-icon ui-icon-search"
								style="float:left"
								action="#{procedureController.doViewProcedure}">
								<f:setPropertyActionListener
									target="#{procedureController.procedure}" value="#{procedure}" />
							</p:commandLink>
						</p:column>
						<p:column headerText="Procedure Number" sortBy="#{procedure}" sortFunction="#{sessionController.procedureSortFunction}" style="width:5%">
							<h:outputText value="#{procedure.procedureNumber}" />
						</p:column>
						<p:column headerText="Test Number" style="width:10%">
							<h:outputText value="#{procedure.testNumber}" />
						</p:column>
						<p:column headerText="Procedure Type" sortBy="#{procedure.procedureType.procedureTypeName}">
							<h:outputText
								value="#{procedure.procedureType.procedureTypeName}" />
						</p:column>
						<p:column headerText="Frames">
							<h:outputText
								value="#{fn:length(procedure.procedureCcdFrameList)}" />
						</p:column>
						<p:column headerText="Start Time" style="width:10%">
							<h:outputText value="#{procedure.executionStartTime}" >
								<f:convertDateTime type="date" pattern="HH:mm:ss" timezone="UTC" />
							</h:outputText>
							<p:spacer width="6px"/>
							<h:outputText value="UTC"/>
						</p:column>
						<p:column headerText="M1 Snap Number After">
							<h:outputText
								value="#{procedure.procedureOutput.m1SnapNumberAfterDisplayText}" />
						</p:column>
						
						<p:column headerText="Comments" style="width:30%">
							<h:outputText value="#{procedure.comments}" />
						</p:column>

						<p:rowExpansion>
							<p:panelGrid columns="3" style="margin:5px; width:800px"
								styleClass="pcsFormNoBorder alignTop">

								<p:panelGrid columns="2"
									styleClass="pcsFormNoBorder" style="width:250px"
									columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

									<f:facet name="header">
                    					General 
                					</f:facet>

									<h:outputLabel value="Integration Time (sec)" />
									<h:outputText value="15.00" />
	
									<h:outputLabel value="Telescope Elevation (deg)" />
									<h:outputText value="66.25" />
									
									<h:outputLabel value="Star Name" />
									<h:outputText value="#{procedure.starName}" />
									
									<h:outputLabel value="Coarse Mirror (x, y) (um)" />
									<h:panelGroup>
									<h:outputText value="264" /><h:outputText value=", " /><h:outputText value="264" />
									</h:panelGroup>
									
									<h:outputLabel value="Fine Mirror (x, y) (um)" />
									<h:panelGroup>
									<h:outputText value="264" /><h:outputText value=", " /><h:outputText value="264" />
									</h:panelGroup>
								
								</p:panelGrid>
								
								<p:panelGrid columns="2"
									styleClass="pcsFormNoBorder" style="width:220px"
									columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

									<f:facet name="header">
                    					M1, M2 
                					</f:facet>

									<h:outputLabel value="M1 Cmds RMS (nm)" />
									<h:outputText value="nan" />
	
									<h:outputLabel value="Secondary Theta X (deg)" />
									<h:outputText value="0.56" />
	
									<h:outputLabel value="Secondary Theta Y (deg)" />
									<h:outputText value="3.2" />
	
									<h:outputLabel value="Secondary Focus (units??)" />
									<h:outputText value="6.65" />

								</p:panelGrid>

								<p:panelGrid columns="2" 
									styleClass="pcsFormNoBorder" style="width:300px"
									columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

									<f:facet name="header">
                    					Phasing 
                					</f:facet>
	
									<h:outputLabel value="Phasing Piston RMS (units??)" />
									<h:outputText value="6.36" />
	
									<h:outputLabel value="Phasing Residuals (units??)" />
									<h:outputText value="8.88" />
	
									<h:outputLabel value="Number of Phasing Edges" />
									<h:outputText value="83" />
	
									<h:outputLabel value="RMS of M1 commands FM only (units??)" />
									<h:outputText value="0" />
	
									<h:outputLabel value="RMS of M1 commands no FM (units??)" />
									<h:outputText value="0" />

							</p:panelGrid>
							</p:panelGrid>

						</p:rowExpansion>


					</p:dataTable>

			<p:dataTable id="sessionTableExport" var="procedure"
				value="#{sessionController.session.procedureList}" style="display:none">

				<p:column>
				<f:facet name="header"><h:outputText value="Procedure Number" /></f:facet>
					<h:outputText value="#{procedure.procedureNumber}" />
				</p:column>
				<p:column>
				<f:facet name="header"><h:outputText value="Test Number" /></f:facet>
					<h:outputText value="1" />
				</p:column>
				<p:column>
				<f:facet name="header"><h:outputText value="Procedure Type" /></f:facet>
					<h:outputText value="#{procedure.procedureType.procedureTypeName}" />
				</p:column>
				<p:column>
				<f:facet name="header"><h:outputText value="Started" /></f:facet>
					<h:outputText value="#{procedure.executionStartTime}" />
				</p:column>
				<p:column>
				<f:facet name="header"><h:outputText value="Comments" /></f:facet>
					<h:outputText value="Procedure specific comments" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Integration Time (sec)" /></f:facet>
					<h:outputText value="15.00" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="FWHM (pix)" /></f:facet>
					<h:outputText value="2.90" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Theta80 (pix)" /></f:facet>
					<h:outputText value="6.36" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Centroid RMS (pix)" /></f:facet>
					<h:outputText value="1.74" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Act Cmd RMS (nm)" /></f:facet>
					<h:outputText value="nan" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Equiv. Focus Mode (nm)" /></f:facet>
					<h:outputText value="0.0" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Coarse Mirror X (um)" /></f:facet>
					<h:outputText value="264" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Coarse Mirror Y (um)" /></f:facet>
					<h:outputText value="-1" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Telescope Elevation (deg)" /></f:facet>
					<h:outputText value="66.25" />
				</p:column>
				
				<p:column>
				<f:facet name="header"><h:outputText value="ACS commands sent" /></f:facet>
					<h:outputText value="No" />
				</p:column>
				
				<p:column>
				<f:facet name="header"><h:outputText value="Number of Frames" /></f:facet>
					<h:outputText value="1" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="ACS Snap # After" /></f:facet>
					<h:outputText value="0" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Star Name" /></f:facet>
					<h:outputText value="#{procedure.starName}" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Star Sp Type" /></f:facet>
					<h:outputText value="#{procedure.starSpType}" />
				</p:column>

				<p:column>
				<f:facet name="header"><h:outputText value="Star Vmag" /></f:facet>
					<h:outputText value="#{procedure.starVmag}" />
				</p:column>



			</p:dataTable>

				</p:tab>
			</p:accordionPanel>
			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
