<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">


<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="sessionListForm" >
		
			<div style="margin:30px;" >
			
			<div>
			<h:outputLabel value="View the "/>&#160;<p:inputText value="#{sessionController.searchQuantity}" size="2" />&#160;<h:outputLabel value="most recent sessions prior to "/> &#160;&#160;<p:calendar size="6" id="popup" value="#{sessionController.searchDate}" />&#160;&#160; <p:commandButton value="Search" action="#{sessionController.doSearchSessionList}" />
			</div>
			<br/>
			
			<p:dataTable id="sessionTable" var="nightSession" value="#{sessionController.sessionList}">				
			    <f:facet name="header">
					Session List for #{sessionController.telescope.telescopeName}
				</f:facet>
				
				<p:column>
					<p:commandLink value="" styleClass="ui-icon ui-icon-search"
						style="float:left"
						ajax="true"
						action="#{sessionController.doViewSession}" onstart="waitDialog.show();" oncomplete="waitDialog.hide();" >
						<f:setPropertyActionListener target="#{sessionController.session}" value="#{nightSession}" />
					
					</p:commandLink>
				</p:column>
				<p:column headerText="Session Date">
					<h:outputText value="#{nightSession.sessionDate}" >
						<f:convertDateTime pattern="MM/dd/yyyy " timezone="UTC" />
					</h:outputText>
				</p:column>
				<p:column headerText="Description">
					<h:outputText value="#{nightSession.description}" />
				</p:column>
				<p:column headerText="Observers">
					<h:outputText value="#{nightSession.observers}" />
				</p:column>
				 
			</p:dataTable>

			<br />
			</div>
		</h:form>
		
	</ui:define>
</ui:composition>
</html>
