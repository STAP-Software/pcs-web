<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">


<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="sessionListForm" >
		
			<div style="margin:30px;" >
			
			<p:toolbar style="margin-bottom: 8px;">
	            <p:toolbarGroup align="left">
	                <h:outputLabel value="Show the most recent" style="margin-right: 6px;"/>
	                <p:inputText value="#{sessionController.searchQuantity}" size="2" style="margin-right: 6px;"/>
	                <h:outputLabel value="sessions prior to" style="margin-right: 6px;"/>
	                <p:calendar size="8" id="popup" value="#{sessionController.searchDate}" 
	                            timeZone="UTC" style="margin-right: 8px;"/>
	                <p:commandButton value="Search" icon="pi pi-search"
	                                 action="#{sessionController.doSearchSessionList}"
	                                 update="sessionTable"
	                                 style="padding: 2px 8px; font-size: 0.85rem"/>
	            </p:toolbarGroup>

	        </p:toolbar>
	        			
			<p:dataTable id="sessionTable" 
             var="nightSession" 
             value="#{sessionController.sessionList}"
             stripedRows="true">				
			    <f:facet name="header">
					Session List for #{sessionController.telescope.telescopeName}
				</f:facet>
				
				<p:column style="width:40px; text-align:center;">
				
				    <p:commandLink
				        action="#{sessionController.doViewSession}"
				        process="@this"
				        update="@form"
				        style="text-decoration:none; color:inherit;">
				
				        <i class="pi pi-search"></i>
				
				        <f:setPropertyActionListener
				            target="#{sessionController.session}"
				            value="#{nightSession}" />
				    </p:commandLink>
				
				</p:column>
				<p:column style="width:100px" headerText="Session Date">
					<h:outputText value="#{nightSession.sessionDate}" >
						<f:convertDateTime pattern="MM/dd/yyyy " timezone="UTC" />
					</h:outputText>
				</p:column>
				<p:column headerText="Description">
					<h:outputText value="#{nightSession.description}" />
				</p:column>
				<p:column headerText="Observers">
					<h:outputText value="#{nightSession.observers}" />
				</p:column>
				 
			</p:dataTable>

			<br />
			</div>
		</h:form>
		
	</ui:define>
</ui:composition>
</html>
