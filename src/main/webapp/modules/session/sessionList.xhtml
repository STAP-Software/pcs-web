<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="sessionListForm" style="margin:30px">
		
			<p:dataTable id="sessionTable" var="currentSession" value="#{sessionController.sessionList}">				
			    <f:facet name="header">
					Session List for #{sessionController.telescope.telescopeName}
				</f:facet>
				
				<p:column headerText="Date"
					style="width:14em">
					<h:outputText value="#{currentSession.sessionDate}" />
				</p:column>
				<p:column headerText="Observers"
					style="width:14em">
					<h:outputText value="#{currentSession.sessionId}" />
				</p:column>
				 
			</p:dataTable>

			<br />
			
		</h:form>
		
	</ui:define>
</ui:composition>
</html>
