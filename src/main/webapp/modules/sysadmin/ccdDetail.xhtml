<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="ccdForm" style="margin:30px">

			<p:tabView id="ccdDetailTabView" >

				<p:tab title="Ccd Detail">

					<p:panelGrid columns="2" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

						<h:outputLabel value="CCD Name" />
						<p:inputText value="#{ccdDefController.ccd.ccdName}" />


						<h:outputLabel value="CCD Description" />
						<p:inputTextarea value="#{ccdDefController.ccd.ccdDescription}" rows="2" cols="70" />


						<f:facet name="footer">
							<p:commandButton id="saveButton" value="Save" ajax="true" icon="ui-icon-check" style="float:right" update="@form :growl"
								action="#{ccdDefController.doSaveCcd}" />
							<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update="@form :growl"
								action="#{ccdDefController.doCancelSaveCcd}" />
						</f:facet>
					</p:panelGrid>

				</p:tab>

				<p:tab title="Hot Pixels">

					<p:spacer width="100" height="10" />

					<p:dataTable id="ccdBadPixelTable" var="hotPixel" value="#{ccdDefController.ccd.hotPixelList}" style="width: 300px">

						<p:column headerText="X">
							<h:outputText value="#{hotPixel.x}" />
						</p:column>
						<p:column headerText="Y">
							<h:outputText value="#{hotPixel.y}" />
						</p:column>
						<p:column headerText="Delete">
							<p:commandLink action="#{ccdDefController.doDeleteHotPixel}" title="delete" styleClass="ui-icon ui-icon-closethick"
								update="@form :growl">
								<f:setPropertyActionListener target="#{ccdDefController.hotPixel}" value="#{hotPixel}" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
					<br/>
					<h:panelGroup>
						<h:outputText value="x: &#160;"/>
						<p:inputText id="xHot" value="#{ccdDefController.xHotPixel}" size="2"/>
						<h:outputText value="&#160;&#160;y: &#160;"/>
						<p:inputText id="yHot" value="#{ccdDefController.yHotPixel}" size="2"/>
						<p:spacer width="10px"/>
						<p:commandButton value="Add Hot Pixel" update="@form :growl"  
             				ajax="true" action="#{ccdDefController.doAddHotPixel}" /> 
					</h:panelGroup>
				</p:tab>
			</p:tabView>



			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
