<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="ccdForm" style="margin:30px">

			<p:tabView id="ccdDetailTabView" >

				<p:tab title="Ccd Detail">

					<p:panelGrid columns="2" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

						<h:outputLabel value="Name" for="ccdName" />
						<p:inputText id="ccdName" value="#{ccdDefController.ccd.ccdName}" required="true"/>

						<h:outputLabel value="CCD Type" for="ccdType" />
						<h:outputText id="ccdType" value="#{ccdDefController.ccd.ccdType.ccdTypeName}" required="true"/>

						<h:outputLabel value="Description" />
						<p:inputTextarea value="#{ccdDefController.ccd.ccdDescription}" rows="2" cols="70" />
						
						<h:outputLabel value="Rows" for="rowCount" />
						<h:outputText id="rowCount" value="#{ccdDefController.ccd.rowCount}" size="3" required="true" />

						<h:outputLabel value="Columns" for="colCount" />
						<h:outputText id="colCount" value="#{ccdDefController.ccd.colCount}" size="3" required="true"/>

						<h:outputLabel value="Non Linear Threshold" for="nonLinearThresh" />
						<h:outputText id="nonLinearThresh" value="#{ccdDefController.ccd.nonLinearThreshold}" size="3" required="true"/>

						
						<p:spacer height="10" /> <p:spacer height="10" />
						<h:outputLabel value="Gain Setting 0 Value (electrons/DN)" for="gain0" />
						<h:outputText id="gain0" value="#{ccdDefController.ccd.ccdGain0.gainValue}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 0 Channel0 Offset" for="gain0Offset0" />
						<p:inputText id="gain0Offset0" value="#{ccdDefController.ccd.ccdGain0.gainOffsetChannel0}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 0 Channel1 Offset" for="gain0Offset1" />
						<p:inputText id="gain0Offset1" value="#{ccdDefController.ccd.ccdGain0.gainOffsetChannel1}" size="3" required="true"/>

						<p:spacer height="10" /> <p:spacer height="10" />
						<h:outputLabel value="Gain Setting 1 Value (electrons/DN)" for="gain1" />
						<h:outputText id="gain1" value="#{ccdDefController.ccd.ccdGain1.gainValue}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 1 Channel0 Offset" for="gain1Offset0" />
						<p:inputText id="gain1Offset0" value="#{ccdDefController.ccd.ccdGain1.gainOffsetChannel0}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 1 Channel1 Offset" for="gain1Offset1" />
						<p:inputText id="gain1Offset1" value="#{ccdDefController.ccd.ccdGain1.gainOffsetChannel1}" size="3" required="true"/>

						<p:spacer height="10" /> <p:spacer height="10" />
						<h:outputLabel value="Gain Setting 2 Value (electrons/DN)" for="gain2" />
						<h:outputText id="gain2" value="#{ccdDefController.ccd.ccdGain2.gainValue}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 2 Channel0 Offset" for="gain2Offset0" />
						<p:inputText id="gain2Offset0" value="#{ccdDefController.ccd.ccdGain2.gainOffsetChannel0}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 2 Channel1 Offset" for="gain2Offset1" />
						<p:inputText id="gain2Offset1" value="#{ccdDefController.ccd.ccdGain2.gainOffsetChannel1}" size="3" required="true"/>

						<p:spacer height="10" /> <p:spacer height="10" />
						<h:outputLabel value="Gain Setting 3 Value (electrons/DN)" for="gain3" />
						<h:outputText id="gain3" value="#{ccdDefController.ccd.ccdGain3.gainValue}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 3 Channel0 Offset" for="gain3Offset0" />
						<p:inputText id="gain3Offset0" value="#{ccdDefController.ccd.ccdGain3.gainOffsetChannel0}" size="3" required="true"/>
						<h:outputLabel value="Gain Setting 3 Channel1 Offset" for="gain3Offset1" />
						<p:inputText id="gain3Offset1" value="#{ccdDefController.ccd.ccdGain3.gainOffsetChannel1}" size="3" required="true"/>

						<f:facet name="footer">
							<p:commandButton id="saveButton" value="Save" ajax="true" icon="ui-icon-check" style="float:right" update="@form :growl :errorGrowl"
								action="#{ccdDefController.doSaveCcd}" />
							<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update="@form :growl :errorGrowl"
								action="#{ccdDefController.doCancelSaveCcd}" />
						</f:facet>
					</p:panelGrid>

				</p:tab>

				<p:tab title="Hot Pixels">

					<p:spacer width="100" height="10" />

					<p:dataTable id="ccdBadPixelTable" var="hotPixel" value="#{ccdDefController.ccd.hotPixelList}" style="width: 300px"
					columnClasses="btmsFormOutputColumn">

						<p:column headerText="P1 (x,y)">
							(<h:outputText value="#{hotPixel.p1.x}" />, <h:outputText value="#{hotPixel.p1.y}" />)
						</p:column>
						<p:column headerText="P2 (x,y)">
							(<h:outputText value="#{hotPixel.p2.x}" />, <h:outputText value="#{hotPixel.p2.y}" />)
						</p:column>
						<p:column headerText="Delete">
							<p:commandLink action="#{ccdDefController.doDeleteHotPixel}" title="delete" styleClass="ui-icon ui-icon-closethick"
								update="@form :growl :errorGrowl">
								<f:setPropertyActionListener target="#{ccdDefController.hotPixelBoundingRect}" value="#{hotPixel}" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
					<br/>
					<h:panelGroup>
						<h:outputText value="P1 (x): &#160;"/>
						<p:inputText id="p1xHot" value="#{ccdDefController.hotPixelBoundingRect.p1.x}" size="2"/>
						<h:outputText value="&#160;&#160;P1 (y): &#160;"/>
						<p:inputText id="p1yHot" value="#{ccdDefController.hotPixelBoundingRect.p1.y}" size="2"/>
						<p:spacer width="10px"/>
						<h:outputText value="P2(x): &#160;"/>
						<p:inputText id="p2xHot" value="#{ccdDefController.hotPixelBoundingRect.p2.x}" size="2"/>
						<h:outputText value="&#160;&#160;P2 (y): &#160;"/>
						<p:inputText id="p2yHot" value="#{ccdDefController.hotPixelBoundingRect.p2.y}" size="2"/>
						<p:spacer width="10px"/>
						<p:commandButton value="Add Hot Pixel" update="@form :growl :errorGrowl"  
             				ajax="true" action="#{ccdDefController.doAddHotPixel}" /> 
					</h:panelGroup>
				</p:tab>
				
				<p:tab title="Hot Columns">

					<p:spacer width="100" height="10" />

					<p:dataTable id="ccdBadColumnTable" var="hotColumn" value="#{ccdDefController.ccd.hotColumnList}" style="width: 300px"
					columnClasses="btmsFormOutputColumn">

						<p:column headerText="P1 (x,y)">
							(<h:outputText value="#{hotColumn.p1.x}" />, <h:outputText value="#{hotColumn.p1.y}" />)
						</p:column>
						<p:column headerText="P2 (x,y)">
							(<h:outputText value="#{hotColumn.p2.x}" />, <h:outputText value="#{hotColumn.p2.y}" />)
						</p:column>
						<p:column headerText="Delete">
							<p:commandLink action="#{ccdDefController.doDeleteHotColumn}" title="delete" styleClass="ui-icon ui-icon-closethick"
								update="@form :growl :errorGrowl">
								<f:setPropertyActionListener target="#{ccdDefController.hotColumnBoundingRect}" value="#{hotColumn}" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
					<br/>
					<h:panelGroup>
						<h:outputText value="P1 (x): &#160;"/>
						<p:inputText value="#{ccdDefController.hotColumnBoundingRect.p1.x}" size="2"/>
						<h:outputText value="&#160;&#160;P1 (y): &#160;"/>
						<p:inputText value="#{ccdDefController.hotColumnBoundingRect.p1.y}" size="2"/>
						<p:spacer width="10px"/>
						<h:outputText value="P2(x): &#160;"/>
						<p:inputText value="#{ccdDefController.hotColumnBoundingRect.p2.x}" size="2"/>
						<h:outputText value="&#160;&#160;P2 (y): &#160;"/>
						<p:inputText value="#{ccdDefController.hotColumnBoundingRect.p2.y}" size="2"/>
						<p:spacer width="10px"/>
						<p:commandButton value="Add Hot Column" update="@form :growl :errorGrowl"  
             				ajax="true" action="#{ccdDefController.doAddHotColumn}" /> 
					</h:panelGroup>
				</p:tab>
			</p:tabView>



			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
