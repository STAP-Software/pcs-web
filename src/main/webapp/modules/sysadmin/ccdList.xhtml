<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="ccdListForm">


			<br />

			<div style="margin:30px;width:800px">
				<p:dataTable id="sessionTable" var="ccd" value="#{ccdDefController.ccdList}">
					<f:facet name="header">
					PCS CCDs 
				</f:facet>

					<p:column>
						<p:commandLink action="#{ccdDefController.doViewCcd}" style="float:left;" title="View CCD">
						    <i class="pi pi-search"></i>
						    <f:setPropertyActionListener target="#{ccdDefController.ccd}" value="#{ccd}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="CCD name">
						<h:outputText value="#{ccd.ccdName}" />
					</p:column>
					<p:column headerText="Description">
						<h:outputText value="#{ccd.ccdDescription}" />
					</p:column>
					<p:column headerText="Current Instrument Assignment">
						<h:outputText value="#{ccd.instrument.instrumentName}" />
					</p:column>

				</p:dataTable>

				<br />
			</div>
		</h:form>

	</ui:define>
</ui:composition>
</html>
