<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="filterForm" style="margin:30px">

			<p:panelGrid columns="2" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

				<f:facet name="header">
					<h:outputText value="Filter Information" />
				</f:facet>

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','FilterName')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel}" />
				<p:inputText value="#{filterController.filter.filterName}" />

				<h:outputLabel value="Filter Type" />
				<p:selectOneMenu value="#{filterController.filter.filterType}" converter="#{filterTypeConverter}">
					<f:selectItems value="#{filterController.filterTypeList}" var="type" itemLabel="#{type.filterTypeName}" itemValue="#{type}" />
				</p:selectOneMenu>
				
				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','WaveLength')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{filterController.filter.wavelength}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','Bandwidth')}" />
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{filterController.filter.bandwidth}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','CoherenceLength')}" />
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{filterController.filter.coherenceLength}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','MinCoherenceLimit')}" />
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{filterController.filter.minCoherenceLimit}" />


				<f:facet name="footer">
					<p:commandButton id="saveButton" value="Save" ajax="true" icon="ui-icon-check" style="float:right" update="@form :growl :errorGrowl"
						action="#{filterController.doSaveFilter}" />
					<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update="@form :growl :errorGrowl"
						action="#{filterController.doCancelSaveFilter}" />
				</f:facet>
			</p:panelGrid>

			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
