<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">
	

		<h:form id="filterForm" style="margin:30px">

			<div style="display: inline-flex; flex-direction: column; gap: 0; 
                width: fit-content; border: 1px solid #d0d0d0;">
			
		       <div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
                   padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
           			Filter Information
       			</div>

        		<div style="padding: 16px;">
        		
	            	<div class="label-input-grid" 
	                 	style="display: grid; grid-template-columns: max-content max-content;
	                        align-items: baseline; 
	                        row-gap: 24px; column-gap: 24px;">
	
	
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','FilterName')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel}" for="filterName"/> 
						<p:inputText id="filterName" value="#{filterController.filter.filterName}" size="3" />
		
						<h:outputLabel value="Filter Type" for="filterType"/>
						<p:selectOneMenu id="filterType" value="#{filterController.filter.filterType}" converter="#{filterTypeConverter}">
							<f:selectItems value="#{filterController.filterTypeList}" var="type" itemLabel="#{type.filterTypeName}" itemValue="#{type}" />
						</p:selectOneMenu>
						
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','WaveLength')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{filterController.filter.wavelength}" size="5" />
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','Bandwidth')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{filterController.filter.bandwidth}" size="3" />
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','CoherenceLength')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{filterController.filter.coherenceLength}" size="3" />
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('Filter','MinCoherenceLimit')}" />
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{filterController.filter.minCoherenceLimit}" size="3" />
		
					</div>
		
					<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">
						<p:commandButton id="saveButton" value="Save" ajax="true" icon="pi pi-check" style="float:right" update="@form :growl :errorGrowl"
							action="#{filterController.doSaveFilter}" />
						<p:commandButton id="closeButton" value="Close" icon="pi pi-times" style="float:right" update="@form :growl :errorGrowl"
							action="#{filterController.doCancelSaveFilter}" />
					</div>
						
				</div>
		
			</div>

		</h:form>

	</ui:define>
</ui:composition>
</html>
