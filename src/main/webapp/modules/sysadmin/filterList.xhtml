<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="filterListForm">

			<p:spacer width="100" height="10" />
			<div style="margin-left: 30px">
				<p:commandLink value="" action="#{filterController.doNewFilter}" ajax="true" update="@form :growl :errorGrowl" 
					style="float: left; padding-right: 10px">
					<i class="pi pi-plus" />
				</p:commandLink>
				<p:commandLink value="Add a New Filter" action="#{filterController.doNewFilter}" ajax="true" update="@form :growl :errorGrowl"
					style="float: left" />
			</div>
			<br />

			<div style="margin:30px;width:400px">
				<p:dataTable id="sessionTable" var="filter" value="#{filterController.filterList}">
					<f:facet name="header">
					PCS Filters 
				</f:facet>

					<p:column>
						<p:commandLink value="" style="float:left" action="#{filterController.doViewFilter}">
						    <i class="pi pi-search"></i>
							<f:setPropertyActionListener target="#{filterController.filter}" value="#{filter}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="Filter Name">
						<h:outputText value="#{filter.filterName}" />
					</p:column>
					<p:column headerText="Filter Type">
						<h:outputText value="#{filter.filterType.filterTypeName}" />
					</p:column>

				</p:dataTable>

				<br />
			</div>
		</h:form>

	</ui:define>
</ui:composition>
</html>
