<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="filterWheelForm" style="margin:30px">

			<div style="display: inline-flex; flex-direction: column; gap: 0; 
                width: fit-content; border: 1px solid #d0d0d0;">
			
		       <div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
                   padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
           			Filter Wheel Configuration
       			</div>

        		<div style="padding: 16px;">
        		
	            	<div class="label-input-grid" 
	                 	style="display: grid; grid-template-columns: max-content max-content;
	                        align-items: baseline; 
	                        row-gap: 24px; column-gap: 24px;">


						<h:outputLabel value="Filter #1" />
						<p:selectOneMenu value="#{filterController.filterWheel.filter1}" converter="#{filterConverter}">
							<f:selectItem itemLabel="No Filter" itemValue=""/> 
							<f:selectItems value="#{filterController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
						</p:selectOneMenu>
		
						<h:outputLabel value="Filter #2" />
						<p:selectOneMenu value="#{filterController.filterWheel.filter2}" converter="#{filterConverter}">
							<f:selectItem itemLabel="No Filter" itemValue=""/> 
							<f:selectItems value="#{filterController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
						</p:selectOneMenu>
		
						<h:outputLabel value="Filter #3" />
						<p:selectOneMenu value="#{filterController.filterWheel.filter3}" converter="#{filterConverter}">
							<f:selectItem itemLabel="No Filter" itemValue=""/> 
							<f:selectItems value="#{filterController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
						</p:selectOneMenu>
		
						<h:outputLabel value="Filter #4" />
						<p:selectOneMenu value="#{filterController.filterWheel.filter4}" converter="#{filterConverter}">
							<f:selectItem itemLabel="No Filter" itemValue=""/> 
							<f:selectItems value="#{filterController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
						</p:selectOneMenu>
		
						<h:outputLabel value="Filter #5" />
						<p:selectOneMenu value="#{filterController.filterWheel.filter5}" converter="#{filterConverter}">
							<f:selectItem itemLabel="No Filter" itemValue=""/> 
							<f:selectItems value="#{filterController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
						</p:selectOneMenu>
		
						<h:outputLabel value="Filter #6" />
						<p:selectOneMenu value="#{filterController.filterWheel.filter6}" converter="#{filterConverter}">
							<f:selectItem itemLabel="No Filter" itemValue=""/> 
							<f:selectItems value="#{filterController.filterList}" var="filter" itemLabel="#{filter.filterName}" itemValue="#{filter}" />
						</p:selectOneMenu>

					</div>
					
					<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">

						<p:commandButton id="saveButton" value="Save" ajax="true" icon="pi pi-check" style="float:right" update="@form :growl :errorGrowl"
							action="#{filterController.doSaveFilterWheel}" />
						<p:commandButton id="closeButton" value="Close" icon="pi pi-times" style="float:right" update="@form :growl :errorGrowl"
							action="#{filterController.doCancelSaveFilterWheel}" /> 
	
					</div>										
					
				</div>								
				
			</div>


			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
