<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="coarseForm" style="margin:30px">

			<div style="display: inline-flex; flex-direction: column; gap: 0; 
                width: fit-content; border: 1px solid #d0d0d0;">
			
		       <div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
                   padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
           			Fine Tilt Mirror Information
       			</div>

        		<div style="padding: 16px;">
        		
	            	<div class="label-input-grid" 
	                 	style="display: grid; grid-template-columns: max-content max-content;
	                        align-items: baseline; 
	                        row-gap: 24px; column-gap: 24px;">


						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','MechanismLeverArmX')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.mechanismLeverArmX}" size="8" />
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','MechanismLeverArmX')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.mechanismLeverArmY}" size="8"/>
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','WindowThickness')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.windowThickness}" size="8" />
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','Xbk7')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.xbk7}"  size="5" />
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','PupilMagnification')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.pupilMagnification}"  size="7" />
						
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','OffloadThreshold')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.offloadThreshold}"  size="4" />
	
					</div>
					
					<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">	
						<p:commandButton id="saveButton" value="Save" ajax="true" icon="pi pi-check" style="float:right" update="@form :growl :errorGrowl"
							action="#{fineTiltMirrorController.doSaveFineTiltMirror}" />
						<p:commandButton id="closeButton" value="Close" icon="pi pi-times" style="float:right" update="@form :growl :errorGrowl"
							action="#{fineTiltMirrorController.doCancelSaveFineTiltMirror}" />
					</div>
					
				</div>
				
			</div>


			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
