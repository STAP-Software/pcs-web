<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="coarseForm" style="margin:30px">

			<p:panelGrid columns="2" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

				<f:facet name="header">
					<h:outputText value="Fine Tilt Mirror Information" />
				</f:facet>

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','MechanismLeverArmX')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.mechanismLeverArmX}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','MechanismLeverArmX')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.mechanismLeverArmY}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','WindowThickness')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.windowThickness}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','Xbk7')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel}" />
				<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.xbk7}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','PupilMagnification')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel}" />
				<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.pupilMagnification}" />
				
				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('FineTiltMirror','OffloadThreshold')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{fineTiltMirrorController.fineTiltMirror.offloadThreshold}" />

				<f:facet name="footer">
					<p:commandButton id="saveButton" value="Save" ajax="true" icon="ui-icon-check" style="float:right" update="@form :growl :errorGrowl"
						action="#{fineTiltMirrorController.doSaveFineTiltMirror}" />
					<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update="@form :growl :errorGrowl"
						action="#{fineTiltMirrorController.doCancelSaveFineTiltMirror}" />
				</f:facet>
			</p:panelGrid>

			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
