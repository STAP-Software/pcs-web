<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="pupilMaskForm" style="margin:30px">

			<p:panelGrid columns="2" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

				<f:facet name="header">
					<h:outputText value="Pupil Mask Information" />
				</f:facet>

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','MaskName')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel}" />
				<p:inputText value="#{pupilMaskController.pupilMask.maskName}" />

				<h:outputLabel value="Pupil Mask Type" />
				<p:selectOneMenu value="#{pupilMaskController.pupilMask.pupilMaskType}" converter="#{pupilMaskTypeConverter}">
					<f:selectItems value="#{pupilMaskController.pupilMaskTypeList}" var="type" itemLabel="#{type.pupilMaskTypeName}" itemValue="#{type}" />
				</p:selectOneMenu>

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','MaskRotation')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{pupilMaskController.pupilMask.maskRotation}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','RadPerPixel')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{pupilMaskController.pupilMask.radPerPixel}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','SecPerPixel')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{pupilMaskController.pupilMask.secPerPixel}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','SpotDiamInterior')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{pupilMaskController.pupilMask.spotDiamInterior}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','SpotDiamPeripheral')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{pupilMaskController.pupilMask.spotDiamPeripheral}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','CrossHairDiam')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{pupilMaskController.pupilMask.crossHairDiam}" />

				<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('PupilMask','PcsFocusToAcs')}" />				
				<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
				<p:inputText value="#{pupilMaskController.pupilMask.pcsFocusToAcs}" />

				<f:facet name="footer">
					<p:commandButton id="saveButton" value="Save" ajax="true" icon="ui-icon-check" style="float:right" update="@form :growl :errorGrowl"
						action="#{pupilMaskController.doSavePupilMask}" />
					<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update="@form :growl :errorGrowl"
						action="#{pupilMaskController.doCancelSavePupilMask}" />
				</f:facet>
			</p:panelGrid>

			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
