<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="pupilMaskListForm">

			<p:spacer width="100" height="10" />
			<div>
				<p:commandLink value="" action="#{pupilMaskController.doNewPupilMask}" ajax="true" update="@form :growl" styleClass="ui-icon ui-icon-plus"
					style="float: left" />
				<p:commandLink value="Add a New Pupil Mask" action="#{pupilMaskController.doNewPupilMask}" ajax="true" update="@form :growl"
					style="float: left" />
			</div>
			<br />

			<div style="margin:30px;width:400px">
				<p:dataTable id="sessionTable" var="mask" value="#{pupilMaskController.pupilMaskList}">
					<f:facet name="header">
					PCS Pupil Masks 
				</f:facet>

					<p:column>
						<p:commandLink value="" styleClass="ui-icon ui-icon-search" style="float:left" action="#{pupilMaskController.doViewPupilMask}">
							<f:setPropertyActionListener target="#{pupilMaskController.pupilMask}" value="#{mask}" />

						</p:commandLink>
					</p:column>
					<p:column headerText="Pupil Mask Name">
						<h:outputText value="#{mask.maskName}" />
					</p:column>
					<p:column headerText="Pupil Mask Type">
						<h:outputText value="#{mask.pupilMaskType.pupilMaskTypeName}" />
					</p:column>

				</p:dataTable>

				<br />
			</div>
		</h:form>

	</ui:define>
</ui:composition>
</html>
