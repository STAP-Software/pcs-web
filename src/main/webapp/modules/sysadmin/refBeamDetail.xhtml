<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="refBeamForm" style="margin:30px">


			<f:event listener="#{refBeamController.validate}" type="postValidate" />

			<h:inputHidden id="referenceBeamId" value="#{refBeamController.referenceBeam.referenceBeamId}"/>
			
			
			<div style="display: inline-flex; flex-direction: column; gap: 0; 
                width: fit-content; border: 1px solid #d0d0d0;">
			
		       <div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
                   padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
           			Reference Beam Information
       			</div>

        		<div style="padding: 16px;">
        		
	            	<div class="label-input-grid" 
	                 	style="display: grid; grid-template-columns: max-content max-content;
	                        align-items: baseline; 
	                        row-gap: 24px; column-gap: 24px;">



						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ReferenceBeam','RefBeamNum')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<p:inputText id="refBeamNum" value="#{refBeamController.referenceBeam.refBeamNum}" required="true" disabled="#{!refBeamController.referenceBeam.newRecord}" size="2">
							<f:validateLongRange minimum="1" maximum="9" />
						</p:inputText>
						
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ReferenceBeam','Wavelength')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel} (#{fieldMetaData.units})" />
						<p:inputText id="wavelength" value="#{refBeamController.referenceBeam.wavelength}" required="true" size="6" />
		
						<c:set var="fieldMetaData" value="#{metaDataController.findFieldMetaData('ReferenceBeam','SegmentNumAlignment')}" />				
						<h:outputLabel value="#{fieldMetaData.displayLabel}" />
						<p:inputText id="segAlign" value="#{refBeamController.referenceBeam.segmentNumAlignment}" required="true" size="2">
							<f:validateLongRange minimum="0" maximum="36" />
						</p:inputText>
		
		
		
					</div>
					
					<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">
				
							<p:commandButton id="saveButton" value="Save" ajax="true" icon="pi pi-check" style="float:right" update="@form :growl :errorGrowl"
								action="#{refBeamController.doSaveReferenceBeam}" />
							<p:commandButton id="closeButton" value="Close" icon="pi pi-times" style="float:right" update="@form :growl :errorGrowl"
								action="#{refBeamController.doCancelSaveReferenceBeam}" />
					</div>
					
				</div>
				
			</div>

			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
