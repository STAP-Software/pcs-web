<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="refBeamListForm">

			<p:spacer width="100" height="10" />
			<div>
				<p:commandLink value="" action="#{refBeamController.doNewReferenceBeam}" ajax="true" update="@form :growl" styleClass="ui-icon ui-icon-plus"
					style="float: left" />
				<p:commandLink value="Add a New Reference Beam" action="#{refBeamController.doNewReferenceBeam}" ajax="true" update="@form :growl"
					style="float: left" />
			</div>
			<br />

			<div style="margin:30px;width:400px">
				<p:dataTable id="sessionTable" var="refBeam" value="#{refBeamController.referenceBeamList}">
					<f:facet name="header">
					Reference Beams 
				</f:facet>

					<p:column>
						<p:commandLink value="" styleClass="ui-icon ui-icon-search" style="float:left" action="#{refBeamController.doViewReferenceBeam}">
							<f:setPropertyActionListener target="#{refBeamController.referenceBeam}" value="#{refBeam}" />

						</p:commandLink>
					</p:column>
					<p:column headerText="Reference Beam Number">
						<h:outputText value="#{refBeam.refBeamNum}" />
					</p:column>
					<p:column headerText="Wavelength">
						<h:outputText value="#{refBeam.wavelength}" />
					</p:column>
					<p:column headerText="Aligned To Segment #">
						<h:outputText value="#{refBeam.segmentNumAlignment}" />
					</p:column>

				</p:dataTable>

				<br />
			</div>
		</h:form>

	</ui:define>
</ui:composition>
</html>
