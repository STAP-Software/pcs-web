<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="sufsGroupForm" style="margin:30px">

			<f:event listener="#{sufsGroupController.validate}" type="postValidate" />
			<h:inputHidden id="sufsGroupId" value="#{sufsGroupController.sufsGroup.sufsGroupId}"/>


			<div style="display: inline-flex; flex-direction: column; gap: 0; 
                width: fit-content; border: 1px solid #d0d0d0;">
			
		       <div style="background: #e8e8e8; border-bottom: 1px solid #d0d0d0;
                   padding: 6px 12px; font-weight: bold; font-size: 18px; font-family: Arial, sans-serif;">
           			SUFS Group Information
       			</div>

        		<div style="padding: 16px;">
        		
	            	<div class="label-input-grid" 
	                 	style="display: grid; grid-template-columns: max-content max-content;
	                        align-items: baseline; 
	                        row-gap: 24px; column-gap: 24px;">
	


						<p:outputLabel value="Group Number" for="groupNumber"/>
						<p:inputText id="groupNumber" value="#{sufsGroupController.sufsGroup.groupNumber}" required="true"  disabled="#{!sufsGroupController.sufsGroup.newRecord}" size="2" >
							<f:validateLongRange minimum="1" maximum="6" />
						</p:inputText>
		
						<p:outputLabel value="Default Reference Beam" for="defaultRefBeamNum" />
						<p:inputText id="defaultRefBeamNum" value="#{sufsGroupController.sufsGroup.defaultRefBeamNum}" required="true" size="2" />
	
					</div>
					
					<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">
	
						<p:commandButton id="saveButton" value="Save" ajax="true" icon="pi pi-check" style="float:right" update="@form :growl :errorGrowl"
							action="#{sufsGroupController.doSaveSufsGroup}" />
						<p:commandButton id="closeButton" value="Close" icon="pi pi-times" style="float:right" update="@form :growl :errorGrowl"
							immediate="true" action="#{sufsGroupController.doCancelSaveSufsGroup}" />

					</div>
					
				</div>
				
			</div>
			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
