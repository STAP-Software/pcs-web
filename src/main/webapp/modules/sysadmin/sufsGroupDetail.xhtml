<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="sufsGroupForm" style="margin:30px">

			<p:panelGrid columns="2" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

				<f:facet name="header">
					<h:outputText value="Sufs Group Instrument/Telescope related Configuation Information" />
				</f:facet>

				<h:outputLabel value="Group Number" />
				<p:inputText value="#{sufsGroupController.sufsGroup.groupNumber}" />

				<h:outputLabel value="Coarse Mirror Pos X" />
				<p:inputText value="#{sufsGroupController.sufsGroup.coarseMirrorPosX}" />

				<h:outputLabel value="Coarse Mirror Pos Y" />
				<p:inputText value="#{sufsGroupController.sufsGroup.coarseMirrorPosY}" />

				<h:outputLabel value="Telescope Offset (Az) from Group 0" />
				<p:inputText value="#{sufsGroupController.sufsGroup.telPosAz}" />

				<h:outputLabel value="Telescope Offset (El) from Group 0" />
				<p:inputText value="#{sufsGroupController.sufsGroup.telPosEl}" />

				<h:outputLabel value="Default Reference Beam" />
				<p:inputText value="#{sufsGroupController.sufsGroup.defaultRefBeamNum}" />


				<f:facet name="footer">
					<p:commandButton id="saveButton" value="Save" ajax="true" icon="ui-icon-check" style="float:right" update="@form :growl"
						action="#{sufsGroupController.doSaveSufsGroup}" />
					<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update="@form :growl"
						action="#{sufsGroupController.doCancelSaveSufsGroup}" />
				</f:facet>
			</p:panelGrid>

			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
