<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="sufsGroupForm" style="margin:30px">

			<f:event listener="#{sufsGroupController.validate}" type="postValidate" />
			<h:inputHidden id="sufsGroupId" value="#{sufsGroupController.sufsGroup.sufsGroupId}"/>

			<p:panelGrid columns="2" styleClass="pcsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn">

				<f:facet name="header">
					<h:outputText value="Sufs Group Information" />
				</f:facet>

				<p:outputLabel value="Group Number" for="groupNumber"/>
				<p:inputText id="groupNumber" value="#{sufsGroupController.sufsGroup.groupNumber}" required="true"  disabled="#{!sufsGroupController.sufsGroup.newRecord}" >
					<f:validateLongRange minimum="1" maximum="6" />
				</p:inputText>

				<p:outputLabel value="Default Reference Beam" for="defaultRefBeamNum" />
				<p:inputText id="defaultRefBeamNum" value="#{sufsGroupController.sufsGroup.defaultRefBeamNum}" required="true" />


				<f:facet name="footer">
					<p:commandButton id="saveButton" value="Save" ajax="true" icon="ui-icon-check" style="float:right" update="@form :growl :errorGrowl"
						action="#{sufsGroupController.doSaveSufsGroup}" />
					<p:commandButton id="closeButton" value="Close" icon="ui-icon-cancel" style="float:right" update="@form :growl :errorGrowl"
						immediate="true" action="#{sufsGroupController.doCancelSaveSufsGroup}" />
				</f:facet>
			</p:panelGrid>

			<br />

		</h:form>

	</ui:define>
</ui:composition>
</html>
