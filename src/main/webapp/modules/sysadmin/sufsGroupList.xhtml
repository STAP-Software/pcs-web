<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../template.xhtml">

	<ui:define name="content">

		<h:form id="sufsGroupListForm">

			<p:spacer width="100" height="10" />
			<div>
				<p:commandLink value="" action="#{sufsGroupController.doNewSufsGroup}" ajax="true" update="@form :growl :errorGrowl" styleClass="ui-icon ui-icon-plus"
					style="float: left" />
				<p:commandLink value="Add a New Sufs Group" action="#{sufsGroupController.doNewSufsGroup}" ajax="true" update="@form :growl :errorGrowl"
					style="float: left" />
			</div>
			<br />

			<div style="margin:30px;width:400px">
				<p:dataTable id="sessionTable" var="sufsGroup" value="#{sufsGroupController.sufsGroupList}">
					<f:facet name="header">
					Sufs Groups Instrument/Telescope related Configuation 
				</f:facet>

					<p:column>
						<p:commandLink value="" styleClass="ui-icon ui-icon-search" style="float:left" action="#{sufsGroupController.doViewSufsGroup}">
							<f:setPropertyActionListener target="#{sufsGroupController.sufsGroup}" value="#{sufsGroup}" />

						</p:commandLink>
					</p:column>
					<p:column headerText="Group Number">
						<h:outputText value="#{sufsGroup.groupNumber}" />
					</p:column>
					
					<p:column headerText="Coarse Mirror Pos">
						<h:outputText value="#{sufsGroup.coarseMirrorPosX}" />
						<h:outputText value=", " />
						<h:outputText value="#{sufsGroup.coarseMirrorPosY}" />
					</p:column>
					
					<p:column headerText="Telescope Az,El offset from group 0">
						<h:outputText value="#{sufsGroup.telPosAz}" />
						<h:outputText value=", " />
						<h:outputText value="#{sufsGroup.telPosEl}" />
					</p:column>
					
					<p:column headerText="Default Ref Beam">
						<h:outputText value="#{sufsGroup.defaultRefBeamNum}" />
					</p:column>

				</p:dataTable>

				<br />
			</div>
		</h:form>

	</ui:define>
</ui:composition>
</html>
