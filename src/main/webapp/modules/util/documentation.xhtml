<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">



<ui:composition template="../../helpTemplate.xhtml">

	<ui:define name="content">

		<style type="text/css">
			.pcsContentsCol {
				flex: 0 0 auto !important;
				width: auto !important;
				max-width: none !important;
			}

			.pcsFrameCol {
				flex: 1 1 auto !important;
				width: auto !important;
			}
		</style>

		<h:form id="documentationForm">


			<p:panelGrid columns="2" style="margin:10px; width:100%;" styleClass="pcsExecutionPanel" columnClasses="pcsContentsCol,pcsFrameCol">
				<p:panelGrid columns="1" style="margin:0;" styleClass="pcsFormNoBorder">

					<f:facet name="header">
					Contents
					</f:facet>

					<p:tree value="#{helpController.helpContentRoot}" var="node" id="contentsTree" expanded="true" style="white-space:nowrap; border:0 none;">

						<p:treeNode expandedIcon="ui-icon-folder-open" collapsedIcon="ui-icon-folder-collapsed" type="folder">
							<h:outputText style="font-weight:bold" value="#{node}" />
						</p:treeNode>
						<p:treeNode icon="ui-icon-document" type="link">
							<p:commandLink value="#{node.name}" action="#{helpController.doUpdatePage(node.link)}" update=":documentationForm" />
						</p:treeNode>
					</p:tree>

				</p:panelGrid>

   				<iframe style="border: 0 none; width:100%; height:1200px;" src="#{helpController.currentPage}" />

			</p:panelGrid>

		</h:form>

	</ui:define>
</ui:composition>
</html>
