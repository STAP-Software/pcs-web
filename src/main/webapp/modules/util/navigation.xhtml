<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">
  
			<h:form id="menuForm">
			
				<h:inputHidden id="helpUrl" value="#{sessionController.helpUrl}" />
			
				<p:menubar style="z-index:10">
				
					<p:submenu label="Session" icon="pi pi-file">
					
						<p:menuitem value="Connect ..." ajax="true" action="#{sessionController.extInfChangeListener}" update="@form" rendered="#{sessionController.extInfSimulationMode and sessionController.ifCommandPermission}"/>
						<p:menuitem value="Disconnect" ajax="true" action="#{sessionController.extInfChangeListener}" update="@form" rendered="#{!sessionController.extInfSimulationMode and sessionController.ifCommandPermission}"/>
					
						<p:menuitem value="View Sessions" ajax="false" action="#{sessionController.doViewSessionList}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="View Current Session" ajax="true" update="@form" action="#{sessionController.doViewCurrentSession}" onclick="PF('waitDialog').show();" oncomplete="PF('waitDialog').hide();" disabled="#{sessionController.navDisabled}"/>
					</p:submenu>
					<p:menuitem value="Rerun Last Procedure" action="#{procedureController.doNewLastProc}" disabled="#{sessionController.navDisabled}" 
						icon="pi pi-refresh" rendered="#{sessionController.currentSessionLastProcedure != null and not sessionController.navDisabled and sessionController.runProcedurePermission}" />
					<p:menuitem value="Go to Running Procedure" action="#{procedureController.doViewProcedure}"
						icon="pi pi-refresh" rendered="#{sessionController.navDisabled and sessionController.runProcedurePermission}" oncomplete="procedureExecutionPoller.start();" />
					<p:submenu label="Run" icon="pi pi-cog" rendered="#{sessionController.runProcedurePermission}">
						<p:menuitem value="Passive Tilt" action="#{procedureController.doNewPassiveTilt}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Coarse Phasing" action="#{procedureController.doNewCoarsePhasing}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Narrow Band Phasing" action="#{procedureController.doNewNarrowBandPhasing}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Fine Screen" action="#{procedureController.doNewFineScreen}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="SUFS" action="#{procedureController.doNewSufs}" disabled="#{sessionController.navDisabled}"/>
						<p:separator />
						<p:menuitem value="Create Reference Beam" action="#{procedureController.doNewCreateRefBeam}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Pupil Registration" action="#{procedureController.doNewPupilRegistration}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Center Telescope" action="#{procedureController.doNewCenterTelescope}" disabled="#{sessionController.navDisabled}"/>
					</p:submenu>
					<p:submenu label="Tools" icon="pi pi-wrench">
						<p:menuitem value="Frame and Instrument Tools" action="#{frameController.doSetupFrameViewer}" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.engineeringView }" />
						<p:menuitem value="Camera Manual Control" action="#{cameraManualController.doViewCameraDiagnostic}" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.ifCommandPermission}"/>
						<p:menuitem value="ACS Manual Control" action="#{acsManualController.doViewAcsManualInterface}" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.ifCommandPermission}"/>
						<p:menuitem value="DCS Manual Control" action="#{dcsManualController.doViewDcsManualInterface}" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.ifCommandPermission}"/>
					</p:submenu>

					<p:submenu label="General Configuration" icon="pi pi-pencil" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.configPermission}">
						<p:menuitem value="Global Config" action="#{globalConfigController.doViewGlobalConfig}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Incomplete Mirror" action="#{incompleteMirrorController.doViewIncompleteMirror}" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.engineeringView}"/>
						<p:menuitem value="Missing Spots" action="#{missingSpotsController.doViewMissingSpots}" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.administrationView}"/>
						<p:menuitem value="SUFS Segment Zernikes" action="#{globalConfigController.doViewSufsZernikes}" disabled="#{sessionController.navDisabled}" update=":growl :errorGrowl"/>
						<p:separator />
						<p:submenu label="PCS Components"  disabled="#{sessionController.navDisabled}" rendered="#{sessionController.administrationView}">
							<p:menuitem value="Manage CCDs" action="#{ccdDefController.doViewCcdList}" />
							<p:menuitem value="Manage Filters" action="#{filterController.doViewFilterList}" />
							<p:menuitem value="Manage Pupil Masks" action="#{pupilMaskController.doViewPupilMaskList}" />
						</p:submenu>
						<p:submenu label="#{cameraDefController.instrument.instrumentName} Configuration"  disabled="#{sessionController.navDisabled}" rendered="#{sessionController.administrationView}" >
							<p:menuitem value="Manage Filter Wheel" action="#{filterController.doViewFilterWheel}" />
							<p:menuitem value="Manage Pupil Wheel" action="#{pupilMaskController.doViewPupilWheel}" />
							<p:menuitem value="Manage Reference Beams" action="#{refBeamController.doViewReferenceBeamList}" />
							<p:menuitem value="Select CCD" action="#{ccdDefController.doViewCcdSelectList}" />
							<p:menuitem value="Manage Coarse Tilt Mirror" action="#{coarseTiltMirrorController.doViewCoarseTiltMirror}" />
							<p:menuitem value="Manage Fine Tilt Mirror" action="#{fineTiltMirrorController.doViewFineTiltMirror}" />
							<p:menuitem value="SUFS Tel/Inst Config" action="#{sufsGroupController.doViewSufsGroupList}" disabled="#{sessionController.navDisabled}" update=":growl :errorGrowl"/>
						</p:submenu>
					</p:submenu>

					<p:submenu label="Procedure Configuration" icon="pi pi-pencil" rendered="#{breadcrumbMenuBean.inProcedure}" >
						<p:menuitem value="Advanced Options" action="#{procedureController.doViewAdvancedOptions}" oncomplete="PF('advancedDialog').show();" disabled="#{sessionController.navDisabled}" update=":advancedForm" rendered="#{sessionController.engineeringView}"/>
						<p:menuitem value="Execution Preferences" type="button" onclick="PF('executionPrefsDialog').show();" disabled="#{sessionController.navDisabled}" rendered="#{sessionController.engineeringView}" />
					</p:submenu>
					
					<p:submenu label="Procedure Displays" icon="pi pi-image" rendered="#{breadcrumbMenuBean.inProcedure}" >
						
						<c:forEach var="iterationOutput" items="#{procedureController.procedure.procedureOutput.procedureIterationOutputList}" varStatus="loop">
						<p:submenu label="Iteration #{loop.index+1}" >
							<p:menuitem value="Centroids" action="#{visualizationController.doPopulateCentroidDisplay(loop.index)}" update=":spotsForm"  oncomplete="runDrawSpots();PF('centroidsDisplayDialog').show();" rendered="#{visualizationController.centroidDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>
							<p:menuitem value="Centroid Offsets" action="#{visualizationController.doPopulateCentroidOffsetDisplay(loop.index)}" update=":offsetsForm" oncomplete="runDrawOffsets(); PF('centroidOffsetDisplayDialog').show()" rendered="#{visualizationController.centroidOffsetDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>
							
							<p:menuitem value="SUFS Centroid Offsets" action="#{visualizationController.doPopulateSufsCentroidOffsetDisplay(loop.index)}" update=":sufsOffsetsForm" oncomplete="runDrawSufsOffsets(); PF('sufsCentroidOffsetDisplayDialog').show()" rendered="#{visualizationController.sufsCentroidOffsetDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>
							
							<p:menuitem value="Single Filter Edge Heights" action="#{visualizationController.doPopulateSingleFilterEdgeHeightsDisplay(loop.index)}" update=":singleFilterEdgeHeightsForm" oncomplete="runDrawSingleFilterEdgeHeights(); PF('singleFilterEdgeHeightsDisplayDialog').show()" rendered="#{visualizationController.singleFilterEdgeHeightsDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>		
 						</p:submenu>
						</c:forEach>
					
						<p:menuitem value="Centroids" action="#{visualizationController.doPopulateCentroidDisplay}" update=":spotsForm"  oncomplete="runDrawSpots();PF('centroidsDisplayDialog').show();" rendered="#{procedureController.procedure.procedureType.createRefMap}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Avg. Pseudo PT Centroid Offsets" action="#{visualizationController.doPopulateAvgPtCentroidOffsetDisplay}" update=":avgPtOffsetsForm" oncomplete="runDrawAvgPtOffsets(); PF('avgPtCentroidOffsetDisplayDialog').show()" rendered="#{visualizationController.avgPtCentroidOffsetDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>
						<p:menuitem value="Avg. FS Centroid Offsets" action="#{visualizationController.doPopulateAvgFsCentroidOffsetDisplay}" update=":avgFsOffsetsForm" oncomplete="runDrawAvgFsOffsets(); PF('avgFsCentroidOffsetDisplayDialog').show()" rendered="#{visualizationController.avgFsCentroidOffsetDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>						
						<p:menuitem value="Avg. SUFS Centroid Offsets" action="#{visualizationController.doPopulateAvgSufsCentroidOffsetDisplay}" update=":avgSufsOffsetsForm" oncomplete="runDrawAvgSufsOffsets(); PF('avgSufsCentroidOffsetDisplayDialog').show()" rendered="#{visualizationController.avgSufsCentroidOffsetDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>						
 						<p:menuitem value="Actuator Deltas" action="#{visualizationController.doPopulateActuatorDeltaDisplay}" update=":actDeltasForm" oncomplete="runDrawActDeltas(); PF('actuatorDeltasDisplayDialog').show()" rendered="#{visualizationController.actuatorDeltaDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>
 						<p:menuitem value="Edge Heights" action="#{visualizationController.doPopulateEdgeHeightsDisplay}" update=":edgeHeightsForm" oncomplete="runDrawEdgeHeights(); PF('edgeHeightsDisplayDialog').show()" rendered="#{visualizationController.edgeHeightsDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>
 						<p:menuitem value="Edge Residuals" action="#{visualizationController.doPopulateEdgeResidualsDisplay}" update=":edgeResidualsForm" oncomplete="runDrawEdgeResiduals(); PF('edgeResidualsDisplayDialog').show()" rendered="#{visualizationController.edgeResidualsDisplayEnabled}" disabled="#{sessionController.navDisabled}"/>
						
					</p:submenu>
					
							


					<p:submenu label="Help" icon="pi pi-question-circle">
					    <p:menuitem value="About..."
					                onclick="PF('helpAboutDialog').show(); return false;" />
					    <p:menuitem value="Documentation"
					                onclick="openHelpWindow(); return false;" />
					</p:submenu>`
					
					<f:facet name="options">            			
            			<p:selectBooleanButton id="value2" value="#{sessionController.advancedViewMode}" onLabel="#{sessionController.advancedViewModeLabel}" offLabel="OA Mode"  style="margin-right:10px">
            				<p:ajax update="@form" listener="#{sessionController.modeChangeListener}"/> 
        				</p:selectBooleanButton>
            			<p:commandButton id="endSessionBtn" value="End Session" update=":growl :errorGrowl :menuForm"
							action="#{sessionController.doEndSession}" disabled="#{sessionController.extInfSimulationMode}" style="margin-right:10px"
							onclick="sessionClosingDialog.show();" oncomplete="sessionClosingDialog.hide();"/>
        			</f:facet>

				</p:menubar>
			</h:form>
			
			
			<h:form id="breadcrumbForm">
			    <p:breadCrumb model="#{breadcrumbMenuBean.model}" styleClass="btmsBreadcrumb" />
			</h:form>
			

			
			
<script>

//<![CDATA[
    		
    
       
	function openHelpWindow() {
		var helpUrl = document.getElementById('menuForm:helpUrl').value;

		window.open(helpUrl, 'Help'); 
		return false;

	}
	
//]]> 
	
</script>
			
</ui:composition>
