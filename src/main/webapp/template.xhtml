<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html">
	<h:head>
		<f:facet name="first">
			<meta http-equiv="X-UA-Compatible" content="EmulateIE8" />
			<meta content='text/html; charset=UTF-8' http-equiv="Content-Type" />
			<title>Phasing Camera Software</title>
		</f:facet>
  
		<link rel="stylesheet" type="text/css" href="${request.contextPath}/css/peas.css" />

<style type="text/css">

#svgbasics { width: 700px; height: 700px; border: 1px solid #484; }
</style>

<h:outputScript library="primefaces" name="jquery/jquery.js"/>
<h:outputScript library="js" name="jquery-1.7.2.js" />





	</h:head>


	<h:body>
		<!--  workaround for "java.lang.IllegalStateException: Cannot create a session after the response has been committed" problem with JSF -->
		<f:event type="javax.faces.event.PreRenderViewEvent"
			listener="#{applicationScopeBean.preRenderView}" />

		<p:growl id="growl" showDetail="true" sticky="false" life="10000"/>
		
		<p:layout fullPage="true">

			<p:layoutUnit id="top" position="north" size="64" collapsible="true">

				<h:outputText value="Phasing Camera System" style="margin:40px;color:#d4f8ff;font-size:30pt;text-shadow: 1px 1px 1px #bbb;" />
				<div style="float:right;margin-right:30px;margin-top:20px;">
				<h:outputText value="" style="color:#d4f8ff;font-size:14pt;text-shadow: 1px 1px 1px #bbb;" />
				</div>
			</p:layoutUnit>


			<p:layoutUnit id="center" position="center">

			<h:form id="menuForm">
			
				<p:menubar>
				
					<p:submenu label="Session" icon="ui-icon-document">
						<p:menuitem value="View Sessions" ajax="false" action="#{sessionController.doViewSessionList}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="View Current Session" ajax="false" action="#{sessionController.doViewCurrentSession}" disabled="#{sessionController.procedureExecuting}"/>
					</p:submenu>
				
					<p:submenu label="Run" icon="ui-icon-gear" >
						<p:menuitem value="Passive Tilt" action="#{procedureController.doNewPassiveTilt}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="Phasing" action="#{procedureController.doNewPhasing}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="Fine Screen" action="#{procedureController.doNewFineScreen}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="SUFS" action="#{procedureController.doNewSufs}" disabled="#{sessionController.procedureExecuting}"/>
						<p:separator />
						<p:menuitem value="Reference Beam" action="#{procedureController.doNewCreateRefBeam}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="First Reference Beam" action="#{procedureController.doNewCreateFirstRefBeam}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="Pupil Registration" action="#{procedureController.doNewPupilRegistration}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="Center Telescope" action="#{procedureController.doNewCenterTelescope}" disabled="#{sessionController.procedureExecuting}"/>
					</p:submenu>
					<p:submenu label="Tools" icon="ui-icon-contact">
						<p:menuitem value="Frame and Instrument Tools" action="#{frameController.doSetupFrameViewer}" disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}" />
						<p:menuitem value="Camera Manual Control" action="#{cameraManualController.doViewCameraDiagnostic}" disabled="#{sessionController.procedureExecuting}"/>
					</p:submenu>

					<p:submenu label="General Configuration" icon="ui-icon-pencil" disabled="#{sessionController.procedureExecuting}">
						<p:menuitem value="Global Config" action="#{globalConfigController.doViewGlobalConfig}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="Missing Spots" action="#{missingSpotsController.doViewMissingSpots}" disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}"/>
						<p:separator />
						<p:submenu label="PCS Components"  disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}">
							<p:menuitem value="Manage CCDs" action="#{ccdDefController.doViewCcdList}" />
							<p:menuitem value="Manage Filters" action="#{filterController.doViewFilterList}" />
							<p:menuitem value="Manage Pupil Masks" action="#{pupilMaskController.doViewPupilMaskList}" />
						</p:submenu>
						<p:submenu label="#{cameraDefController.instrument.instrumentName} Configuration"  disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}" >
							<p:menuitem value="Manage Filter Wheel" action="#{filterController.doViewFilterWheel}" />
							<p:menuitem value="Manage Pupil Wheel" action="#{pupilMaskController.doViewPupilWheel}" />
							<p:menuitem value="Manage Reference Beams" action="#{refBeamController.doViewReferenceBeamList}" />
							<p:menuitem value="Select CCD" action="#{ccdDefController.doViewCcdSelectList}" />
							<p:menuitem value="Manage Coarse Tilt Mirror" action="#{coarseTiltMirrorController.doViewCoarseTiltMirror}" />
							<p:menuitem value="Manage Fine Tilt Mirror" action="#{fineTiltMirrorController.doViewFineTiltMirror}" />
							<p:menuitem value="SUFS Tel/Inst Config" action="#{sufsGroupController.doViewSufsGroupList}" disabled="#{sessionController.procedureExecuting}" update=":growl"/>
						</p:submenu>
					</p:submenu>

					<p:submenu label="Procedure Configuration" icon="ui-icon-pencil" >
						<p:menuitem value="Advanced Options" type="button" onclick="advancedDialog.show();" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="Execution Preferences" type="button" onclick="executionPrefsDialog.show();" disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}" />
						<p:menuitem value="Load Default Values" url="#" disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}" />
						<p:menuitem value="Load Last Session Values" url="#" disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}" />
						<p:menuitem value="Save As Default Values" url="#" disabled="#{sessionController.procedureExecuting}" rendered="#{sessionController.advancedViewMode}" />
					</p:submenu>

				 	<p:submenu label="External Interfaces" icon="ui-icon-wrench" disabled="true" rendered="#{sessionController.advancedViewMode}">
						<p:menuitem value="ACS Manual Control" action="#{acsManualController.doViewAcsManualInterface}" disabled="#{sessionController.procedureExecuting}"/>
						<p:menuitem value="DCS Manual Control" action="#{dcsManualController.doViewDcsManualInterface}" disabled="#{sessionController.procedureExecuting}"/>
							
					</p:submenu>

				 	<p:submenu label="Help" icon="ui-icon-help">
						<p:menuitem value="About..."  onclick="helpAboutDialog.show();" />
					</p:submenu>
					
					<f:facet name="options">
            			
            			<p:selectBooleanButton id="value2" value="#{sessionController.advancedViewMode}" onLabel="Expert Mode" offLabel="OA Mode"  style="margin-right:10px">
            				<p:ajax update="@form" listener="#{sessionController.modeChangeListener}"/> 
        				</p:selectBooleanButton>
        			</f:facet>

				</p:menubar>
			</h:form>

				<h:form id="breadcrumbForm">
					<p:breadCrumb model="#{breadcrumbMenuBean.model}"
						styleClass="btmsBreadcrumb" />
				</h:form>

				<ui:insert name="content" />

			</p:layoutUnit>

		</p:layout>

		<ui:include src="modules/procedure/centroidOffsetsDialog.xhtml"/>

		<ui:include src="modules/procedure/centroidsDialog.xhtml"/>
		
		<ui:include src="modules/procedure/userPromptDialog.xhtml"/>
		<ui:include src="modules/procedure/instructionDialog.xhtml"/>

		<p:dialog id="helpAboutDlg" header="About PEAS PCS" widgetVar="helpAboutDialog">  
    		<div>
    		<p:panelGrid columns="2" style="width:100%" styleClass="helpAboutHeader">
    		<p:graphicImage url="../../images/peas.jpg" height="84px" width="126px" />
    		<h:panelGroup>
    		<p:spacer width="66px" height="10px"/>
  			<h:outputText style="font-weight:bold; font-size:14px" value="PEAS PCS version 0.1"/>
    		<p:spacer width="66px" height="10px"/>
  			</h:panelGroup>
    		</p:panelGrid>
			<br/><br/>
			Written 2013-2014 by Scott Michaels, Mitch Troy, Gary Chanan, Cathy Ohara<br/>
			<br/><br/>
			<br/><br/>
			The authors would like to thank the Thirty Meter Telescope Corporation and<br/>the W. M. Keck Observatory for their support. 
			<br/><br/>
			</div>
		</p:dialog> 
		
		<p:dialog id="loginDlg" header="Expert Login" widgetVar="loginDialog" closable="false" modal="true" resizable="false">  
    		<h:form> 

                    <p:panelGrid columns="2" styleClass="btmsForm" columnClasses="btmsFormLabelColumn, btmsFormInputColumn"> 
  
  						<p:spacer height="10px"/>
  						<p:spacer height="10px"/>
  
                        <h:outputLabel for="password" value="Password:" /> 
                        <p:password  value="#{sessionController.password}" id="password" label="password" /> 

  						<p:spacer height="10px"/>
  						<p:spacer height="10px"/>

                        <f:facet name="footer"> 
                            <p:commandButton id="loginButton" value="Login" update=":growl :menuForm" actionListener="#{sessionController.login}" onclick="loginDialog.hide()" /> 
                        </f:facet> 
                    </p:panelGrid> 


                </h:form>  
		</p:dialog> 

	</h:body>

</f:view>
</html>
