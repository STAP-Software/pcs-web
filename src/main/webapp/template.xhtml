<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html">
	<h:head>
		<f:facet name="first">
			<meta http-equiv="X-UA-Compatible" content="EmulateIE8" />
			<meta content='text/html; charset=UTF-8' http-equiv="Content-Type" />
			<title>Phasing Camera Software</title>
		</f:facet>
  
		<link rel="stylesheet" type="text/css" href="${request.contextPath}/css/peas.css" />

<style type="text/css">

#svgbasics { width: 700px; height: 700px; border: 1px solid #484; }
</style>

<h:outputScript library="primefaces" name="jquery/jquery.js"/>
<h:outputScript library="js" name="jquery-1.7.2.js" />
    
	</h:head>


	<h:body>
		<!--  workaround for "java.lang.IllegalStateException: Cannot create a session after the response has been committed" problem with JSF -->
		<f:event type="javax.faces.event.PreRenderViewEvent"
			listener="#{applicationScopeBean.preRenderView}" />



		<p:layout fullPage="true">

			<p:layoutUnit id="top" position="north" size="64" collapsible="true">
					
				<h:form id="topForm">
				<h:panelGroup style="float:left">

				<h:outputText value="PEAS PCS" style="position: relative; top:14px; margin:40px 20px 40px 10px;color:#d4f8ff;font-size:24pt;text-shadow: 1px 1px 1px #bbb;" />
				<h:outputText value="#{sessionController.telescope.telescopeName}" style="position: relative; top:14px; margin:40px 10px 40px 10px;color:#d4f8ff;font-size:24pt;text-shadow: 1px 1px 1px #bbb;" />
				
				</h:panelGroup>
				 <h:panelGroup id="extInfMode" style="float:right">
				
				<h:outputText id="extInfSim" value="Disconnected" style="position:relative; top:18px; margin:40px 10px 40px 10px;color:#ff4444;font-size:20pt;text-shadow: 1px 1px 1px #b22;" 
					rendered="#{sessionController.renderSimulationMode}"/>
					
				<h:outputText  value="select 'Session -> Connect' to run PCS" style="position:relative; top:18px; margin:20px 20px 20px 20px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" 
					rendered="#{sessionController.renderSimulationMode}"/>

				<h:panelGrid id="extInfConn" columns="4" rendered="#{!sessionController.renderSimulationMode}" 
					columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormLabelColumn, btmsFormInputColumn" >
					
					<h:outputText value="CAM: " style="position: relative;  top:5px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					<h:outputText value="#{sessionController.extInfConnectConfig.cameraStatus}" style="margin-right:20px; position: relative; top:5px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.cameraEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.cameraStatus}" style="margin-right:20px; position: relative; top:5px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.cameraEnabled}"/>
					<h:outputText value="ACS: " style="position: relative; margin-right:20px; top:5px; color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					<h:outputText value="#{sessionController.extInfConnectConfig.acsStatus}" style="margin-right:20px; position: relative; top:5px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.acsEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.acsStatus}" style="margin-right:20px; position: relative; top:5px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.acsEnabled}"/>
					
					<h:outputText value="CCD: " style="position: relative; margin-right:20px; top:5px; color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					<h:outputText value="#{sessionController.extInfConnectConfig.ccdStatus}" style="margin-right:20px; position: relative; top:5px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.ccdEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.ccdStatus}" style="margin-right:20px; position: relative; top:5px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.ccdEnabled}"/>
					<h:outputText value="DCS: " style="position: relative; margin-right:20px; top:5px; color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					<h:outputText value="#{sessionController.extInfConnectConfig.dcsStatus}" style="margin-right:20px; position: relative; top:5px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.dcsEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.dcsStatus}" style="margin-right:20px;position: relative; top:5px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.dcsEnabled}"/>
				</h:panelGrid>
				
				</h:panelGroup>
				<p:poll async="true" immediate="true" interval="2" update="extInfMode" />
				
				
				<div style="float:right;margin-right:30px;margin-top:20px;">
				<h:outputText value="" style="color:#d4f8ff;font-size:14pt;text-shadow: 1px 1px 1px #bbb;" />
				</div>
				
				<p:ajaxStatus style="display:block;margin-top:1.2em;float:right">
  
    				<f:facet name="start">
        				<p:graphicImage name="images/ajax-loader.gif" />
    				</f:facet>
   					<f:facet name="complete">
        				<h:outputText value="" />
    				</f:facet>
 
 				</p:ajaxStatus>
 				
 				
 				</h:form>
				
			</p:layoutUnit>


			<p:layoutUnit id="center" position="center">
				<ui:include src="modules/util/navigation.xhtml"/>

				<p:messages id="errorGrowl" severity="error,fatal" showDetail="true" closable="true"/>
				<p:growl id="growl" severity="info,warn" showDetail="false" sticky="false" life="10000"/>

				<ui:insert name="content" />

			</p:layoutUnit>

		</p:layout>

		<p:dialog modal="true" widgetVar="waitDialog" header="Please wait while records are retrieved..." resizable="false" draggable="false" close="false">
        	<h:graphicImage value="../../images/ajaxloadingbar.gif" />
		</p:dialog>

		<ui:include src="modules/procedure/centroidOffsetsDialog.xhtml"/>
		<ui:include src="modules/procedure/avgPtCentroidOffsetsDialog.xhtml"/>
		<ui:include src="modules/procedure/avgFsCentroidOffsetsDialog.xhtml"/>
		<ui:include src="modules/procedure/centroidsDialog.xhtml"/>
		<ui:include src="modules/procedure/actuatorDeltasDialog.xhtml"/>
		<ui:include src="modules/procedure/edgeHeightsDialog.xhtml"/>
		<ui:include src="modules/procedure/edgeResidualsDialog.xhtml"/>
		<ui:include src="modules/procedure/sufsCentroidOffsetsDialog.xhtml"/>
		
		<ui:include src="modules/procedure/userPromptDialog.xhtml"/>
		<ui:include src="modules/procedure/instructionDialog.xhtml"/>
		
		<ui:include src="modules/util/helpAboutDialog.xhtml"/>
		<ui:include src="modules/util/helpDialog.xhtml"/>
		<ui:include src="modules/util/loginDialog.xhtml"/>
		<ui:include src="modules/config/extInfDialog.xhtml"/>

		


	</h:body>

</f:view>
</html>
