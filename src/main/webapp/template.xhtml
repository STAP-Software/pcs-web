<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html">
	<h:head>
		<f:facet name="first">
			<meta http-equiv="X-UA-Compatible" content="EmulateIE8" />
			<meta content='text/html; charset=UTF-8' http-equiv="Content-Type" />
			<title>Phasing Camera Software</title>
		</f:facet>
  

<style type="text/css">

#svgbasics { width: 700px; height: 700px; border: 1px solid #484; }

   

</style>

    <!-- PrimeFlex (still fine to use from CDN) -->
    <link rel="stylesheet" href="https://unpkg.com/primeflex@3.3.1/primeflex.min.css" />

    <!-- Load PrimeFaces resources correctly from the JAR -->
    <h:outputScript name="components.js" library="primefaces" />
    <h:outputScript name="core.js" library="primefaces" />
    
    

    <!-- Choose a theme you have in your JAR: 'lara-light-indigo' is not in the core jar -->
    <!-- For example, use nova-light if using free built-in theme: -->
    <!--  h:outputStylesheet name="theme.css" library="primefaces-nova-light" / -->
	
	<link rel="stylesheet" type="text/css" href="${request.contextPath}/css/peas.css" />


	</h:head>


	<h:body styleClass="m-0 p-0">
		<!--  workaround for "java.lang.IllegalStateException: Cannot create a session after the response has been committed" problem with JSF -->
		<f:event type="jakarta.faces.event.PreRenderViewEvent"
			listener="#{applicationScopeBean.preRenderView}" />



		<div class="flex flex-column h-screen appearance-none">

			<div class="app-header h-6rem border-bottom-1 border-gray-300 p-3">
					
				<h:form id="topForm">
				<h:panelGroup style="float:left">

				<h:outputText value="PEAS PCS" style="position: relative; top:20px; margin:40px 20px 40px 10px;color:#d4f8ff;font-size:24pt;text-shadow: 1px 1px 1px #bbb;" />
				<h:outputText value="#{sessionController.telescope.telescopeName}" style="position: relative; top:20px; margin:40px 10px 40px 10px;color:#d4f8ff;font-size:24pt;text-shadow: 1px 1px 1px #bbb;" />
				
				</h:panelGroup>
				 <h:panelGroup id="extInfMode" style="float:right">
				
				<h:outputText id="extInfSim" value="Disconnected" style="position:relative; top:18px; margin:40px 10px 40px 10px;color:#ff4444;font-size:20pt;text-shadow: 1px 1px 1px #b22;" 
					rendered="#{sessionController.renderSimulationMode}"/>
					
				<h:outputText  value="select 'Session -> Connect' to run PCS" style="position:relative; top:18px; margin:20px 20px 20px 20px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" 
					rendered="#{sessionController.renderSimulationMode}"/>

				<h:panelGrid id="extInfConn" columns="4" rendered="#{!sessionController.renderSimulationMode}" 
					columnClasses="btmsFormLabelColumn, btmsFormInputColumn, btmsFormLabelColumn, btmsFormInputColumn" >
					
					<h:outputText value="CAM: " style="position: relative; top:10px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					 
					<h:outputText value="#{sessionController.extInfConnectConfig.cameraStatus}" style="margin-right:20px; position: relative; top:10px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.cameraEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.cameraStatus}" style="margin-right:20px; position: relative; top:10px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.cameraEnabled}"/>
					
					<h:outputText value="ACS: " style="position: relative; margin-right:20px; top:10px; color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					 
					<h:outputText value="#{sessionController.extInfConnectConfig.acsStatus}" style="margin-right:20px; position: relative; top:10px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.acsEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.acsStatus}" style="margin-right:20px; position: relative; top:10px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.acsEnabled}"/>
					
					<h:outputText value="CCD: " style="position: relative; top:10px; color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					 
					<h:outputText value="#{sessionController.extInfConnectConfig.ccdStatus}" style="margin-right:20px; position: relative; top:10px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.ccdEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.ccdStatus}" style="margin-right:20px; position: relative; top:10px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.ccdEnabled}"/>
					 
					<h:outputText value="DCS: " style="position: relative; margin-right:20px; top:10px; color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" />
					 
					<h:outputText value="#{sessionController.extInfConnectConfig.dcsStatus}" style="margin-right:20px; position: relative; top:10px;color:#d4f8ff;font-size:12pt;text-shadow: 1px 1px 1px #bbb;" rendered="#{sessionController.extInfConnectConfig.dcsEnabled}"/>
					<h:outputText value="#{sessionController.extInfConnectConfig.dcsStatus}" style="margin-right:20px; position: relative; top:10px;color:#ff4444;font-size:12pt;text-shadow: 1px 1px 1px #b22;" rendered="#{not sessionController.extInfConnectConfig.dcsEnabled}"/>
				 
				</h:panelGrid>
				
				</h:panelGroup>
				<p:poll async="true" immediate="true" interval="2" update="extInfMode :menuForm:endSessionBtn" />
				
				<p:remoteCommand name="checkStartSession" action="#{sessionController.doCheckStartSession}" update=":growl :errorGrowl" autoRun="true" />
				
				<div style="float:right;margin-right:30px;margin-top:20px;">
				<h:outputText value="" style="color:#d4f8ff;font-size:14pt;text-shadow: 1px 1px 1px #bbb;" />
				</div>
				
				<p:ajaxStatus style="display:block;margin-top:1.2em;float:right">
  
    				<f:facet name="start">
        				<p:graphicImage name="images/ajax-loader.gif" />
    				</f:facet>
   					<f:facet name="complete">
        				<h:outputText value="" />
    				</f:facet>
 
 				</p:ajaxStatus>
 				
 				
 				</h:form>
				
			</div>


			<div class="flex-1 overflow-auto p-0">
				<ui:include src="modules/util/navigation.xhtml"/>

				<p:messages id="errorGrowl" severity="error,fatal" showDetail="true" closable="true"/>
				<p:growl id="growl" severity="info,warn" showDetail="false" sticky="false" life="20000"/>

				<div styleClass="rightGrowl">
				<p:messages id="asyncErrorGrowl" severity="error,fatal" showDetail="true" closable="true"/>
				<p:growl id="asyncGrowl" severity="info,warn" showDetail="false" sticky="false" life="20000" />
				</div>

				<ui:insert name="content" />

			</div>

		</div>


		
		<ui:include src="modules/util/waitDialog.xhtml"/>
		<ui:include src="modules/procedure/userPromptDialog.xhtml"/>
		
		<ui:include src="modules/util/helpAboutDialog.xhtml"/>
		  
		<ui:include src="modules/util/helpDialog.xhtml"/>
		<ui:include src="modules/util/loginDialog.xhtml"/>
		<ui:include src="modules/config/extInfDialog.xhtml"/>
		<ui:include src="modules/util/sessionClosingDialog.xhtml"/>		
		


	</h:body>

</f:view>
</html>
